[project]
name = "technical-knowledge-base"
version = "0.2.0"
description = "Khalid's Technical knowledge base: every page's interactive HTML and its sources, the tools that build and check them, and the explainer video toolchain."
requires-python = ">=3.12"
# The page data scripts (src/recompute.py, gen_data.py, ...) are stdlib Python plus PyYAML and numpy; every build.sh runs them with this .venv.
# Run them with `uv run python recompute.py` from a page's src/.
# The voice environments are separate uv projects: .claude/skills/explainer-video/narration/voice_cuda and .../voice_mac.
dependencies = [
    "numpy>=2.5.4",
    "pyyaml>=6",
]

[tool.uv]
package = false
