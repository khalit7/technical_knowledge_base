[project]
name = "tech-knowledge-base"
version = "0.1.0"
description = "Mirror of Khalid's Notion technical knowledge base, and the toolchain that turns its pages into narrated explainer videos."
requires-python = ">=3.12"

# The mirror needs nothing but an HTTP client. Everything heavier is a group,
# so `uv sync` on a fresh machine gives you a working sync in seconds without
# downloading three gigabytes of CUDA wheels you may not want.
dependencies = [
    "requests>=2.32",
]

[dependency-groups]
# The voice half of the video pipeline. This is the group that needs a GPU.
tts = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "transformers==5.17.0",
    "accelerate>=1.15",
    "diffusers>=0.40",
    "librosa>=0.11",
    "soundfile>=0.14",
    "numpy>=2.2",
    "huggingface-hub>=1.32",
    "faster-whisper>=1.1",
    "num2words>=0.5",
]

# The animation half. manim builds pycairo and manimpango from source against
# cairo and pango development headers, which are installed on this machine.
video = [
    "manim>=0.20,<0.22",
]

# The RTX 5090s are Blackwell, compute capability 12.0, and only the CUDA 12.8
# wheels drive them. Installing the default PyPI torch gives a working import
# and a GPU that never engages, which is a slow thing to debug.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

# System packages this project needs, installed once with apt:
#   build-essential pkg-config python3-dev libcairo2-dev libpango1.0-dev ffmpeg
# plus, for LaTeX equations in a scene:
#   texlive texlive-latex-extra texlive-fonts-extra dvisvgm
