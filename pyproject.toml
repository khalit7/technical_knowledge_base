[project]
name = "technical-knowledge-base"
version = "0.2.0"
description = "Khalid's Technical knowledge base: every page's interactive HTML and its sources, the tools that build and check them, and the explainer video toolchain."
requires-python = ">=3.12"
# The page data scripts (src/recompute.py, gen_data.py, ...) are stdlib Python plus PyYAML.
# Run them with `uv run python recompute.py` from a page's src/.
# The voice environments are separate uv projects: video_utils/voice_cuda and video_utils/voice_mac.
dependencies = [
    "pyyaml>=6",
]

[tool.uv]
package = false
