# The animation environment, pinned to what is known to work on this box.
#
# manim cannot be pip-installed here: manimpango and pycairo publish no Linux
# wheels and both need cairo and pango development headers, which would need
# root. conda-forge ships those libraries prebuilt, so micromamba is the route.
#
#   video/env/setup.sh        builds this into video/env/manim
#
# There is no LaTeX in this environment, so scenes must use Pango `Text` and
# `Paragraph`. `Tex` and `MathTex` will fail. If real equations are ever
# needed, add texlive-core here rather than installing a system TeX.
name: kb-manim
channels:
  - conda-forge
dependencies:
  - python=3.11.16
  - manim=0.20.1
  - ffmpeg=9.0.2
  - pycairo=1.29.1
  - manimpango=0.6.1
  - cairo=1.18.4
  - pango=1.58.2
  - numpy=2.4.6
  - pillow=12.3.0
