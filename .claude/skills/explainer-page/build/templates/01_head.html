<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAGE_TITLE</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2733;--mute:#5f6b7a;--line:#e1e4e9;--soft:#f0f2f5;--acc:#2a62a8;--acc2:#dde8f6;--good:#3f7f56;--bad:#c2703a;--dim:#d3d3d0;--hl:#fff3c4;--open:#1a7f37;--open2:#dcefe0;--closed:#8250df;--closed2:#ece3fb;--c1:#2f6fb5;--c2:#c2703a;--c3:#3f7f56;--c4:#8a5cb8;--c5:#b8983a;--c6:#3a9aa8;--shadow:0 1px 2px rgba(20,35,60,.06),0 8px 24px rgba(20,35,60,.07);--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#121519;--card:#1a1e24;--ink:#e6e9ee;--mute:#9aa4b2;--line:#2c323b;--soft:#20252c;--acc:#7aaee8;--acc2:#1f334b;--good:#5fae7b;--bad:#e8915c;--dim:#3a3a3a;--hl:#4a4020;--open:#4fbf6a;--open2:#1d3324;--closed:#b48ce0;--closed2:#2e2440;--c1:#6ea8e6;--c2:#e8915c;--c3:#5fae7b;--c4:#b48ce0;--c5:#d9bb5f;--c6:#5fc3d1;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.w{max-width:980px;margin:0 auto;padding:28px 20px 56px}
h1{font-family:var(--serif);font-size:clamp(28px,4.2vw,40px);line-height:1.12;margin:0;letter-spacing:-.005em}.sub{color:var(--mute);font-size:15px;line-height:1.55;max-width:46em;margin:12px 0 18px}
h2{font-family:var(--serif);font-size:clamp(23px,3vw,29px);margin:64px 0 12px;line-height:1.2}h3{font-size:16px;margin:18px 0 6px}
p{margin:8px 0}code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}sub,sup{line-height:0}
section>p,section>ul,section>ol{max-width:46em}
b,strong{font-weight:600}.mute{color:var(--mute)}.small{font-size:12.5px}
ul,ol{margin:6px 0;padding-left:22px}li{margin:3px 0}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.an-play{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc);width:100%}
input[type=checkbox]{accent-color:var(--acc)}
.nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0;margin:0 0 6px}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:13px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;white-space:nowrap}
.nav a.cur{background:var(--acc);border-color:var(--acc);color:var(--bg)}
section{scroll-margin-top:48px}
.lead{font-size:16px}
.try{font-size:13px;color:var(--mute);border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:8px 0 10px}
.try b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;margin:20px 0;min-width:0}.card h4{font-size:15.5px;line-height:1.35;margin:0 0 8px}
.co{border-left:4px solid var(--acc);background:var(--acc2);padding:12px 16px;border-radius:0 12px 12px 0;margin:18px 0}
.co.warn{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}.co.key{border-left-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--bg))}
.co .t{font-weight:600;font-size:14px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px;margin:10px 0}
.grid>div{min-width:0}
.sp{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg)}
.sp .n{font-size:11.5px;color:var(--mute);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.sp p{margin:3px 0 0;font-size:13.5px}.sp a{color:var(--acc);text-decoration:none}.sp a:hover{text-decoration:underline}.sp .n a{text-transform:none;font-size:13.5px;letter-spacing:0}.sp .rt{color:var(--mute);font-size:12.5px}#s-more h3{font-size:14px;margin:14px 0 4px}
.bets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.bet{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--soft)}
.bet h4{margin:0 0 4px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{font-size:12.5px;padding:2px 10px;border-radius:99px}
.band{margin:12px 0 4px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:6px}
.lab{text-align:left;border-radius:8px;padding:6px 9px;border:1px solid var(--line);background:var(--bg);line-height:1.3;min-width:0}
.lab .nm{font-weight:600;font-size:13.5px;display:block}.lab .fl{font-size:12px;color:var(--mute);display:block;overflow-wrap:anywhere}
.lab.o{border-left:4px solid var(--open)}.lab.c{border-left:4px solid var(--closed)}
.lab.sel{outline:2px solid var(--acc);outline-offset:1px}.lab.dim{opacity:.28}
.detail{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:var(--soft)}
.detail h3{margin:0 0 2px}.tag{display:inline-block;font-size:11.5px;border-radius:99px;padding:0 8px;margin:2px 4px 2px 0;border:1px solid var(--line);background:var(--bg)}
.tag.o{color:var(--open);border-color:var(--open)}.tag.c{color:var(--closed);border-color:var(--closed)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;font-size:13.5px;margin:6px 0}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.tw{overflow-x:auto;max-width:100%;margin:8px 0}
table{border-collapse:collapse;font-size:13px;width:100%}
th{text-align:left;color:var(--mute);font-weight:500;border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:bottom}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.fm{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0;overflow-x:auto}
.fm .eq{font-family:"Cambria Math","STIX Two Math",Cambria,Georgia,serif;font-size:18px;text-align:center;white-space:nowrap;padding:4px 0 6px}
.fm dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;margin:4px 0 0;font-size:13px}
.fm dt{font-family:"Cambria Math",Cambria,Georgia,serif;font-style:italic;text-align:right}.fm dd{margin:0}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px 16px;margin:8px 0}
.ctl label{font-size:13px;display:block;min-width:0}.ctl label b{font-variant-numeric:tabular-nums}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px;margin:10px 0}
.stat{border:0;border-radius:10px;padding:10px 12px;background:var(--soft);min-width:0}
.stat .k{font-size:12px;color:var(--mute)}.stat .v{font-size:22px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}.stat .d{font-size:12px;color:var(--mute)}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}svg text:not([fill]){fill:var(--ink)}
.ill{font-size:11.5px;color:var(--bad);font-weight:600}
.bars .row{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 5.2em;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}
.bars .row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{height:14px;background:var(--soft);border-radius:3px;position:relative;overflow:hidden}
.bars .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bars .val{text-align:right;font-variant-numeric:tabular-nums}
.bars .row.hl .nm{font-weight:600}
.mist{border:1px solid var(--line);border-radius:8px;margin:6px 0;overflow:hidden}
.mist summary{cursor:pointer;padding:7px 12px;font-size:14px;list-style:none}
.mist summary::-webkit-details-marker{display:none}
.mist summary:before{content:"+";display:inline-block;width:1.2em;color:var(--acc);font-weight:600}
.mist[open] summary:before{content:"\2212"}
.mist .b{padding:0 12px 9px 30px;font-size:13.5px}
.split{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 10px;align-items:center;margin:8px 0;font-size:13px}.sb{display:flex;height:24px;border-radius:4px;overflow:hidden}.sb span{display:flex;align-items:center;padding:0 6px;color:var(--bg);font-size:12.5px;white-space:nowrap;overflow:hidden}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:15px;border-radius:0;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:9px 14px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.tabs button:hover{color:var(--ink)}
.tabs{flex-wrap:wrap}.tabsep{align-self:center;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);border-left:1px solid var(--line);padding:0 4px 0 10px;margin-left:6px}
.tabs button.deep{font-style:italic}
.deepnote{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13px;color:var(--mute)}.deepnote b{color:var(--ink)}
.tab[hidden]{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--soft);padding:3px;gap:2px;margin:6px 0}.seg button{font:inherit;font-size:13px;background:transparent;color:var(--mute);border:0;border-radius:999px;padding:5px 13px;cursor:pointer;white-space:nowrap}.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,35,60,.15)}
.hmwrap{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px}
table.hm{border-collapse:collapse;font-size:12.5px;min-width:720px;width:100%}
table.hm th,table.hm td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:center}
table.hm thead th{font-weight:600;vertical-align:bottom;background:var(--soft)}table.hm thead th small,table.hm th.mh small{display:block;font-weight:400;color:var(--mute);font-size:11px}
table.hm th.mh{text-align:left;position:sticky;left:0;background:var(--bg);z-index:1;min-width:9.5em}table.hm thead th.mh{background:var(--soft)}
table.hm td.v{cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}table.hm td.v.on{outline:2px solid var(--ink);outline-offset:-2px}
table.hm td.na{color:var(--dim)}table.hm sup{font-size:9px;margin-left:1px}
.hmleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute)}
.q{color:var(--mute);font-size:12.5px}.mute{color:var(--mute)}ul.tight{margin:4px 0;padding-left:20px}ul.tight li{margin:3px 0;font-size:14px}
.chk{font-size:13px;margin:0 10px 0 4px;white-space:nowrap}.plot{margin:8px 0;overflow:hidden}.small{font-size:13px}.hmleg span{display:inline-flex;align-items:center}.hmleg svg{display:inline-block;margin-right:4px}
.foot{margin-top:30px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
a{color:var(--acc)}a:visited{color:var(--acc)}
.an-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:10px 0}.an-ctl input[type=range]{flex:1 1 120px;width:auto;min-width:0}
.an-cap{background:var(--soft);border-left:4px solid var(--acc);border-radius:0 10px 10px 0;padding:10px 14px;margin:8px 0;font-size:14.5px}
figure.ph{margin:20px 0}figure.ph img{display:block;width:100%;height:auto;border-radius:10px}figure.ph figcaption{font-size:13px;color:var(--mute);margin-top:8px;line-height:1.5}
figure.ph.side{float:right;width:min(380px,40%);margin:6px 0 14px 26px}section{display:flow-root}.card,details,.tw,.fm{clear:both}.co{display:flow-root}
@media (max-width:700px){figure.ph.side{float:none;width:auto;margin:16px 0}}
/* eased steps: RD.anim adds rd-fwd to the card when the step moves forward; marks drawn with class rd-new ease in, rd-gone fade out, and the caption fades in */
.rd-fwd .rd-new{animation:rdIn .5s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:center}
.rd-fwd .rd-gone{animation:rdGone .6s ease-out both}
.rd-fade{animation:rdFade .35s ease-out both}
@keyframes rdIn{from{opacity:0;transform:translateY(-8px) scale(.85)}}
@keyframes rdGone{from{opacity:.25}}
@keyframes rdFade{from{opacity:.25}}
@media (prefers-reduced-motion:reduce){.rd-fwd .rd-new,.rd-fwd .rd-gone,.rd-fade{animation:none}}
@media (max-width:520px){h1{font-size:26px}h2{margin-top:48px}.w{padding:20px 14px 40px}.card{padding:14px;border-radius:12px}.seg{flex-wrap:wrap;border-radius:18px}.seg button{padding:5px 10px}.fm .eq{font-size:15px}.bars .row{grid-template-columns:minmax(0,8.6em) minmax(0,1fr) 4.4em;font-size:12px}.bars .row .nm{white-space:normal;line-height:1.2}}
</style></head><body><div class="w">
