[project]
name = "kb-voice-cuda"
version = "0.1.0"
description = "Chatterbox Turbo narration on an NVIDIA GPU (PyTorch). Used by video_utils/narrate.py."
# chatterbox-tts pins torch 2.6 below Python 3.14; 2.6 has no Blackwell (RTX 50xx) kernels.
# On 3.14 it accepts torch >= 2.9, which the CUDA 12.8 wheels below provide.
requires-python = ">=3.14,<3.15"
dependencies = [
    "chatterbox-tts>=0.1.7",
    "torch>=2.9",
    "torchaudio>=2.9",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]
