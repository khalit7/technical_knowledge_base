[project]
name = "kb-voice-mac"
version = "0.1.0"
description = "Chatterbox Turbo narration on Apple Silicon (MLX). Used by video_utils/narrate.py."
requires-python = ">=3.12,<3.14"
dependencies = [
    "mlx-audio[tts]>=0.5",
]

[tool.uv]
package = false
# mlx only exists for Apple Silicon macOS
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
