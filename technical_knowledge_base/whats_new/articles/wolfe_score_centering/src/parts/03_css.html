<style id="wp-css">
/* article page: the headline card (generated by mk_article.py), "in the article" margin labels, figure cards. Copied from the paper pages' card look. */
.crumb{font-size:12.5px;color:var(--mute);margin:0 0 2px}
.hero{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0 8px;background:var(--card);box-shadow:var(--shadow)}
.hero-k{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.hero h1{margin:6px 0 6px}
.hero .au{font-size:13.5px;line-height:1.45;color:var(--mute)}
.hero .tk{font-size:15.5px;margin:10px 0}
.hero-l{font-size:13.5px;margin-top:8px}.hero-n{font-size:12.5px;color:var(--mute);margin-top:6px}
.hn{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px;margin:8px 0}
.hn .stat .v{font-size:22px}.hn .stat .u{font-size:13px;font-weight:500;color:var(--mute)}.hn .stat .k{font-size:12.5px;color:var(--ink)}
.where{display:inline-block;margin:0 0 6px;font-size:12px;line-height:1.3;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 7px;text-decoration:none;background:var(--bg)}
.where:before{content:"in the article: ";opacity:.75}
a.where:visited{color:var(--mute)}.where:hover{color:var(--acc);border-color:var(--acc)}
.wp-fig .t{font-weight:600;font-size:15px;line-height:1.35;margin-bottom:6px}
.wp-fig figcaption,.wp-cap{font-size:13px;color:var(--mute);line-height:1.5;margin-top:8px}
.wp-fig{margin:0}
.wp-lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--mute);margin:4px 0}.wp-lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.wp-hl{color:var(--c2);font-weight:600}
.wp-resp{list-style:none;padding:0;margin:10px 0}.wp-resp li{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 8px;background:var(--card)}
.wp-resp .by{font-size:12.5px;color:var(--mute)}.wp-resp .kind{display:inline-block;font-size:11.5px;border-radius:99px;padding:0 8px;margin-right:6px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.wp-toyout{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;margin:8px 0}
.wp-toyout .stat .v{font-size:19px}
#t-read details.mist .b p,#t-read details.mist .b li{font-size:14px}
blockquote.wp-q{margin:10px 0;padding:6px 14px;border-left:3px solid var(--line);color:var(--ink);font-style:italic}
/* this page (prefix sc): figure cards, the toy, the results chart */
.sc-fig{margin:0}.sc-fig .t{font-weight:600;font-size:15px;line-height:1.35;margin-bottom:6px}
.sc-fig figcaption{font-size:13px;color:var(--mute);line-height:1.5;margin-top:8px}
.sc-eq{font-size:15px;line-height:1.7;margin:8px 0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);overflow-x:auto}
.sc-eq .dr{color:var(--c2);font-weight:600}.sc-eq .sg{color:var(--c3);font-weight:600}
.sc-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:4px 0 6px;font-size:13.5px}
.sc-ctl input[type=range]{flex:1 1 160px;min-width:120px}
.sc-lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--mute);margin:4px 0}.sc-lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sc-lg i.dash{height:0;border-top:2px dashed var(--mute);border-radius:0;vertical-align:3px}
.sc-sub{font-size:12.5px;font-weight:600;color:var(--mute);margin:10px 0 2px}
table.sc-tab{border-collapse:collapse;font-size:12.5px;width:100%;margin:6px 0}
table.sc-tab th,table.sc-tab td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right;vertical-align:top}
table.sc-tab th:first-child,table.sc-tab td:first-child{text-align:left}
table.sc-tab th{font-weight:600;color:var(--mute);font-size:12px}
table.sc-tab td.z{color:var(--c3);font-weight:600}
.sc-verdict{border-left:3px solid var(--acc);padding:4px 12px;background:var(--soft);border-radius:4px}
.sc-pred{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--soft)}
.tw{overflow-x:auto}
</style>
