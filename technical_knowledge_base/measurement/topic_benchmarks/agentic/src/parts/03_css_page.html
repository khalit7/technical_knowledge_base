<style>
/* this page's own pieces */
.an1-wrap{border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.an1-wrap.shared{border-color:var(--bad);border-style:dashed}
.an1-lbl{font-size:12px;font-weight:600;color:var(--mute);margin-bottom:6px}
.an1-files{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:4px 10px}
.fr{display:grid;grid-template-columns:minmax(0,11.5em) minmax(0,1fr);gap:6px;align-items:baseline;font-size:12.5px;border-left:3px solid var(--line);padding:2px 6px;border-radius:0 4px 4px 0;min-width:0}
.fr code{overflow-wrap:anywhere;font-size:11.5px}.fr span{overflow-wrap:anywhere}
.fr.new{border-left-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--bg))}
.fr.good{border-left-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--bg))}
.fr.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.fr.dim{opacity:.55}
.an1-cmd{white-space:pre-wrap;overflow-wrap:anywhere;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:8px 0 0;max-height:190px;overflow:auto}
#rd-ovt td:nth-child(5){min-width:13em}
#rd-tau-task .kv{font-size:13px}
#tk-lines td code{font-size:11.5px}
textarea:disabled{opacity:.5}
select{max-width:100%}
#t-read p code,#t-read li code{overflow-wrap:anywhere;word-break:break-word}
#an2 label.small{display:block}
@media (max-width:520px){.fr{grid-template-columns:minmax(0,1fr)}}
</style>
