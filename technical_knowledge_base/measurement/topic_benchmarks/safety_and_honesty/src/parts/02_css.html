<style>
.nl{display:inline-block;font-style:normal;font-size:10.5px;line-height:1.35;font-weight:600;border-radius:4px;padding:0 4px;margin:0 2px;border:1px solid currentColor;vertical-align:1px;white-space:nowrap}
.nl.d{color:var(--c1)}.nl.i{color:var(--bad)}.nl.r{color:var(--c4)}.nl.u{color:var(--mute)}
.co.corr{border-left-color:var(--bad)}.co.corr .t{color:var(--bad)}
.an-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0}
.an-ctl input[type=range]{flex:1 1 120px;width:auto;min-width:0}
.an-ctl select{padding:3px 6px}.an-play{min-width:6.4em}
.an-cap{min-height:5.2em;border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:8px 0}
.an-cap .t{font-weight:600;font-size:14px}.an-cap p{margin:2px 0;font-size:13.5px}
.an-cnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:6px;margin:6px 0}
.an-cnt .stat .v{font-size:16px}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:4px 0}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.leg i.ln{height:3px;width:14px;border-radius:0}
.rd-svg{width:100%;overflow:hidden}
.rd-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.rd-two>div{min-width:0}
.rd-ph{font-size:12px;color:var(--mute);font-weight:600;margin:6px 0 2px}
table.rd-t{font-size:13px}table.rd-t td,table.rd-t th{padding:5px 6px}
table.rd-t td:first-child{font-weight:600}
table.rd-t tr.lnk{cursor:pointer}table.rd-t tr.lnk:hover td{background:var(--soft)}
.rd-sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:6px 16px;margin:8px 0}
.rd-sl label{font-size:13px;display:block;min-width:0}
.rd-btns{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.rd-btns button{font-size:12.5px;padding:3px 9px}
.rd-chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;font-size:12px}
.rd-chips span{border:1px solid var(--line);border-radius:99px;padding:0 8px;background:var(--bg)}
.rd-pred{border:1px dashed var(--acc);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13.5px}
.rd-pred .ans{margin-top:6px}
.rd-eqline{font-family:"Cambria Math","STIX Two Math",Cambria,Georgia,serif;font-size:15px;overflow-wrap:anywhere;padding:2px 0}
.rd-big{font-size:13.5px;margin:4px 0}
h2 .num{color:var(--mute);font-weight:500;margin-right:4px}
.fm .eq{white-space:normal}
@media (max-width:520px){table.rd-t{font-size:12.5px}.rd-eqline{font-size:14px}}
</style>
<style>
/* this page's own pieces */
.tk{display:block;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:4px 0}
.tk span{border-radius:2px}
.tk span.sel{outline:2px solid var(--ink);outline-offset:0}
.tk.sm{font-size:11px}
.scrollbox{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg)}
.co.unv{border-left-color:var(--mute);border-left-style:dashed}.co.unv .t{color:var(--mute)}
.pill{display:inline-block;font-size:11.5px;border-radius:99px;padding:0 7px;border:1px solid var(--line);margin:0 2px;white-space:nowrap}
.pill.ok{color:var(--good);border-color:var(--good)}.pill.no{color:var(--bad);border-color:var(--bad)}
.vg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:10px;margin:10px 0}
.vg .vc{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);min-width:0}
.vg .vc h4{margin:0 0 4px;font-size:14px}.vg .vc p{margin:4px 0;font-size:13px}
.vg .vc pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11.5px;background:var(--soft);border-radius:6px;padding:6px 8px;margin:6px 0;max-height:220px;overflow:auto}
.cl{counter-reset:c;list-style:none;padding-left:0}.cl>li{counter-increment:c;border:1px solid var(--line);border-radius:8px;padding:7px 12px 7px 40px;position:relative;margin:6px 0}
.cl>li:before{content:counter(c);position:absolute;left:11px;top:7px;width:20px;height:20px;border-radius:50%;background:var(--acc2);color:var(--ink);font-size:12px;font-weight:600;text-align:center;line-height:20px}
.cl>li label{display:block;cursor:pointer}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px}
</style>
