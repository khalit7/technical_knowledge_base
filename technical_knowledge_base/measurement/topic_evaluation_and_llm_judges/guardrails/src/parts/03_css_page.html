<style>
/* this page's own pieces */
.xs-row{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:4px;border-bottom:1px solid var(--line);min-width:0;flex-wrap:wrap}
.xs-row>span:last-child{min-width:0;overflow-wrap:anywhere;flex:1 1 220px}
.xs-dots{white-space:nowrap;flex:0 0 auto}
.fw td:first-child{white-space:nowrap}
table.fw td{font-size:12.5px}
#rd-pa-mode,#rd-pii-mode,#rd-lc-mode,#rd-st-mode,#pl-cv-mode{display:flex;flex-wrap:wrap;max-width:100%}
#rd-pa-mode button,#rd-lc-mode button{flex:1 1 auto}
#rd-pii-rec button{font-size:12px;padding:2px 9px;border-radius:99px}
#rd-pii-text{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-size:12.5px}

#rd-lc .rd-btns button{font-size:12px}
select{max-width:100%}

</style>
<style>
@media (max-width:560px){
table.stack thead{display:none}
table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
table.stack tr{border-bottom:1px solid var(--line);padding:6px 0}
table.stack td{border:0;padding:2px 0}
table.stack td[data-l]:before{content:attr(data-l);display:block;font-size:11.5px;font-weight:600;color:var(--mute)}
