<style>
/* page-specific rules (the shared look is in 01_head.html) */
select{max-width:100%}.ctl label select{display:block;width:100%;margin-top:2px}
.co.corr{border-left-color:var(--bad)}.co.corr .t{color:var(--bad)}
.unc{font-size:11px;font-weight:600;color:var(--bad);border:1px solid var(--bad);border-radius:99px;padding:0 6px;margin-left:3px;white-space:nowrap}
.der{font-size:11px;font-weight:600;color:var(--good);border:1px solid var(--good);border-radius:99px;padding:0 6px;margin-left:3px;white-space:nowrap}
.gcap{min-height:5.6em;font-size:13.5px;margin:6px 0;padding:8px 10px;background:var(--soft);border-radius:6px}
.gctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.gctl input[type=range]{flex:1 1 140px;width:auto;min-width:100px}
.stat .v.bad{color:var(--bad)}.stat .v.good{color:var(--good)}
.cnt4{grid-template-columns:repeat(auto-fit,minmax(min(100%,135px),1fr))}.cnt4 .stat .v{font-size:17px}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:4px 0}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.ladder td:first-child{white-space:nowrap;font-weight:600}
table.mx{width:auto;border-collapse:collapse;font-size:12.5px;margin:6px 0}table.mx td,table.mx th{border:1px solid var(--line);padding:3px 7px;text-align:right;min-width:3.2em}table.mx th{background:var(--soft);color:var(--mute);font-weight:500;text-align:center}
.itemlist{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.item{padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}.item:last-child{border-bottom:0}
.item .h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.item .q{margin:2px 0 3px}.item .op{font-size:12.5px;color:var(--mute)}.item .op b{color:var(--ink)}
.tg{display:inline-block;font-size:11px;border-radius:99px;padding:0 7px;border:1px solid var(--line);background:var(--bg)}
.tg.o{border-color:var(--good);color:var(--good)}.tg.w{border-color:var(--bad);color:var(--bad)}.tg.x{border-color:var(--c5);color:var(--c5)}
.kfm{font-family:"Cambria Math","STIX Two Math",Cambria,Georgia,serif;font-size:16px;white-space:nowrap}
#t-read h2{scroll-margin-top:48px}
#t-read .core{font-size:16.5px;line-height:1.5;border-left:4px solid var(--acc);padding:4px 0 4px 12px;margin:10px 0}
#t-read .hero{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
#t-read .card h4{margin:0 0 4px;font-size:14.5px}
#t-read .terms{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;font-size:13.5px;margin:6px 0}
#t-read .terms dt{font-weight:600}#t-read .terms dd{margin:0}
#t-read details.dp{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--bg)}
#t-read details.dp>summary{cursor:pointer;padding:7px 12px;font-size:14px;font-weight:600}
#t-read details.dp>summary .mute{font-weight:400}
#t-read details.dp>.b{padding:0 12px 10px}
#t-read .rd-svg{width:100%;overflow:hidden;margin:6px 0}#t-read .rd-svg svg{display:block}
#t-read .cap{font-size:13px;color:var(--mute);margin:4px 0 2px}#t-read .cap b{color:var(--ink)}
#t-read .hl{color:var(--acc);font-weight:600}
.rub{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px}
.rub>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,13em);gap:0;border-bottom:1px solid var(--line)}.rub>div:last-child{border-bottom:0}
.rub .x{padding:6px 10px}.rub .why{padding:6px 10px;background:var(--soft);color:var(--mute);font-size:12.5px}.rub .why b{color:var(--acc)}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.forms .f{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}.forms .f .opt{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.forms .f .opt span{border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:12px;background:var(--soft)}
pre.rec{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;overflow-x:auto;margin:6px 0}
@media (max-width:520px){#t-read .terms{grid-template-columns:minmax(0,1fr)}#t-read .terms dd{margin:0 0 4px}.rub>div{grid-template-columns:minmax(0,1fr)}}

@media (max-width:520px){.kfm{font-size:14px}table.mx td,table.mx th{padding:2px 4px;min-width:2.6em}}
</style>
