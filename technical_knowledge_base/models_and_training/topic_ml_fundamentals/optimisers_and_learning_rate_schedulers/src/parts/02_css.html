<style>

.ctl2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:6px 16px;margin:8px 0}

.lanes{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin:8px 0}

.ev td.bar{min-width:120px}

<style id="kb-look">
