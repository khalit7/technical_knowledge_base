<style>
.nl{display:inline-block;font-style:normal;font-size:10.5px;line-height:1.35;font-weight:600;border-radius:4px;padding:0 4px;margin:0 2px;border:1px solid currentColor;vertical-align:1px;white-space:nowrap}
.nl.d{color:var(--c1)}.nl.i{color:var(--bad)}.nl.r{color:var(--c4)}.nl.u{color:var(--mute)}.nl.m{color:var(--good)}
.co.corr{border-left-color:var(--bad)}.co.corr .t{color:var(--bad)}
.an-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0}
.an-ctl input[type=range]{flex:1 1 120px;width:auto;min-width:0}
.an-ctl select{padding:3px 6px}
.an-play{min-width:6.4em}
.an-cap{min-height:4.6em;border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:8px 0}
.an-cap .t{font-weight:600;font-size:14px}
.an-cap p{margin:2px 0;font-size:13.5px}
.an-cnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:6px;margin:6px 0}
.row2{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.lbl{display:block;font-size:12.5px;color:var(--mute);margin:2px 0}
.ctl2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:6px 16px;margin:8px 0}
.ctl2 label{font-size:13px;display:block;min-width:0}.ctl2 label b{font-variant-numeric:tabular-nums}
.ctl2 label.off{opacity:.55}
.fl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--mute)}
.spark{display:block;width:96px;height:30px}.spark path{fill:none;stroke:var(--acc);stroke-width:1.6}.spark .ax{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.legend b.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.modes{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.modes button{font-size:12.5px;padding:3px 10px;border-radius:99px}
/* tensors: one cell per number */
.tz{display:flex;flex-wrap:wrap;gap:10px 14px;margin:8px 0}
.tz .ex{min-width:0}
.tz .ex .h{font-size:11.5px;color:var(--mute);font-weight:600;margin-bottom:2px}
.tz .chs{display:flex;gap:3px}
.tz .ch{display:grid;gap:1px}
.tz .c{width:22px;height:22px;border-radius:3px;font-size:9px;line-height:22px;text-align:center;color:var(--ink);cursor:pointer;border:1px solid transparent;font-variant-numeric:tabular-nums;overflow:hidden}
.tz .c.g{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.tz .c.dim{opacity:.25}
.tz .c.chg{outline:2px solid var(--bad);outline-offset:1px}
.tz .lab{font-size:10px;color:var(--mute);text-align:center}
.tz.tok .row{display:flex;gap:1px;margin:1px 0}
@media (max-width:520px){.tz .c{width:18px;height:18px;line-height:18px;font-size:8px}}
/* BatchNorm grids */
.bng{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px 14px;margin:8px 0}
.bng>div{min-width:0}
.bng .t{font-size:12px;font-weight:600;color:var(--mute);margin:2px 0}
.gr{display:grid;gap:2px;font-size:11px;font-variant-numeric:tabular-nums}
.gr div{height:20px;line-height:20px;text-align:center;border-radius:3px;overflow:hidden;white-space:nowrap}
.gr .hd{color:var(--mute);font-size:10.5px;background:none}
.gr .st{background:none;color:var(--mute);font-size:10.5px}
.gr .hl{outline:2px solid var(--acc);outline-offset:-1px}
/* placement bars */
.pl{width:100%}
.qk .row{grid-template-columns:minmax(0,4.5em) minmax(0,1fr) 7em}
table.mini td,table.mini th{padding:3px 6px;font-size:12.5px}
.calc td.num{font-variant-numeric:tabular-nums}
.calc tr.hl td{background:var(--acc2)}
.calc td .bad{color:var(--bad);font-weight:600}.calc td .ok{color:var(--good);font-weight:600}
.pred{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0;background:var(--soft)}
.pred .opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pred .ans{display:none;margin-top:6px;font-size:13.5px}.pred.done .ans{display:block}
.pred button.right{border-color:var(--good);color:var(--good)}.pred button.wrong{border-color:var(--bad);color:var(--bad)}
.ctl2 select{max-width:100%}
/* closed depth blocks and the top */
details.dp{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--bg)}
details.dp>summary{cursor:pointer;padding:8px 12px;font-size:14px;font-weight:600;list-style:none}
details.dp>summary::-webkit-details-marker{display:none}
details.dp>summary:before{content:"+";display:inline-block;width:1.2em;color:var(--acc)}
details.dp[open]>summary:before{content:"\2212"}
details.dp>.b{padding:0 12px 10px 14px;min-width:0}
.core{font-size:17px;line-height:1.5;border-left:4px solid var(--hlc);padding:4px 0 4px 12px;margin:10px 0}
.hl-t{color:var(--hlc);font-weight:600}
:root{--hlc:#a35a1f}
@media (prefers-color-scheme:dark){:root{--hlc:#f0a868}}
.terms{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;font-size:13.5px;margin:6px 0}
.terms dt{font-weight:600}.terms dd{margin:0}
@media (max-width:520px){.terms{grid-template-columns:minmax(0,1fr)}.terms dd{margin:0 0 4px 0}}
</style>
<style id="kb-look">
/* Reading-site look (2026-10-29), from html_utils/apply_look.py; the template's 01_head.html carries the same */
:root{--bg:#f4f5f7;--card:#fff;--soft:#f0f2f5;--line:#e1e4e9;--ink:#1d2733;--mute:#5f6b7a;--acc:#2a62a8;--acc2:#dde8f6;
--shadow:0 1px 2px rgba(20,35,60,.06),0 8px 24px rgba(20,35,60,.07);--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#121519;--card:#1a1e24;--soft:#20252c;--line:#2c323b;--ink:#e6e9ee;--mute:#9aa4b2;--acc:#7aaee8;--acc2:#1f334b;
--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}}
body{background:var(--bg);font-size:16px;line-height:1.65}
.w{max-width:980px;padding:28px 20px 56px}
h1{font-family:var(--serif);font-size:clamp(28px,4.2vw,40px);line-height:1.12;letter-spacing:-.005em;font-weight:700}
.sub{font-size:15px;line-height:1.55;max-width:46em;margin:12px 0 18px}
h2{font-family:var(--serif);font-size:clamp(23px,3vw,29px);line-height:1.2;margin-top:56px;margin-bottom:12px;font-weight:700}
h3{font-size:16px}sub,sup{line-height:0}
section>p,section>ul,section>ol{max-width:46em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;margin:20px 0}
.card .card{box-shadow:none;margin:12px 0}.card h4{font-size:15.5px;line-height:1.35}
.co{background:var(--acc2);border-left-width:4px;border-radius:0 12px 12px 0;padding:12px 16px;margin:18px 0}
.co.warn{background:color-mix(in srgb,var(--bad) 12%,var(--bg))}.co.key{background:color-mix(in srgb,var(--good) 12%,var(--bg))}
button,select{background:var(--card);border-radius:8px}button:hover{border-color:var(--acc)}
.an-ctl button,.an-ctl select{border-radius:999px;padding:5px 14px}
.an-play{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
.seg{border-radius:20px;background:var(--soft);padding:3px;gap:2px;border-color:var(--line);flex-wrap:wrap;max-width:100%}
.seg button{border-radius:999px;background:transparent;padding:5px 13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,35,60,.15)}
.tabs button{font-size:15px;padding:9px 14px;border-radius:0;background:none}
.nav{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 0;gap:6px}
.nav a{font-size:13px;padding:4px 12px;background:var(--card)}
.nav a.cur{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.stat{background:var(--soft);border-color:transparent;border-radius:10px;padding:10px 12px}.stat .v{font-size:21px}
.an-cap:is(*,#kb){background:var(--soft);border-left-width:4px;border-radius:0 10px 10px 0;padding:10px 14px}
details.dp{background:var(--card);border-radius:12px}
.pr,.dr,.detail,.bet,.fm{background:var(--card);border-radius:12px}
@media (max-width:520px){body{font-size:15px}h1{font-size:26px}h2{margin-top:44px}.w{padding:20px 14px 40px}.card{padding:14px;border-radius:12px}.seg button{padding:5px 10px}
code{overflow-wrap:anywhere}math[display=block]{display:block math;max-width:100%;overflow-x:auto;overflow-y:hidden}}
</style><!--/kb-look--></head><body><div class="w">
