<style>
.sl-pred{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0;background:var(--soft)}
.sl-pred .q{font-size:14px;font-weight:600;margin-bottom:6px}
.sl-pred .opts{display:flex;flex-wrap:wrap;gap:6px}.sl-pred .opts button{font-size:13px;text-align:left}
.sl-pred .opts button.right{border-color:var(--good);background:var(--open2)}.sl-pred .opts button.wrong{border-color:var(--bad)}
.sl-pred .ans{margin-top:8px;font-size:13.5px}
.sl-code{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;overflow-x:auto;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.sl-out{border-left:3px solid var(--good)}
.sl-lbl{font-size:11px;font-weight:600;border-radius:99px;padding:0 7px;border:1px solid var(--line);white-space:nowrap}
.sl-lbl.pub{color:var(--acc);border-color:var(--acc)}.sl-lbl.der{color:var(--good);border-color:var(--good)}.sl-lbl.ill{color:var(--bad);border-color:var(--bad)}.sl-lbl.meas{color:var(--c4);border-color:var(--c4)}.sl-lbl.rough{color:var(--c5);border-color:var(--c5)}
.sl-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:4px 0}.sl-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sl-cap{font-size:13.5px;min-height:3.2em;margin:6px 0}
.sl-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.sl-ctl input[type=range]{width:140px;flex:1 1 120px}
.sl-plot{overflow-x:auto;max-width:100%}
.sl-strip{display:flex;height:22px;border-radius:3px;overflow:hidden;margin:2px 0}
.sl-flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:6px;margin:10px 0}
.sl-flow>div{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--soft);font-size:12.5px;min-width:0}
.sl-flow b{display:block;font-size:13px}
.an-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.an-ctl input[type=range]{flex:1 1 120px;width:auto}
.ctl select{max-width:100%;width:100%;display:block}
.seg{display:flex;flex-wrap:wrap;gap:4px}
</style>
<style>
/* 2026-10-24 rebuild: top of page, depth blocks, inline labs */
#t-read .core{font-size:16.5px;line-height:1.5;border-left:4px solid var(--acc);padding:4px 0 4px 12px;margin:10px 0}
#t-read .hero{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
#t-read .hero h4,#t-read .card h4{margin:0 0 4px;font-size:14.5px}
#t-read .terms{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;font-size:13.5px;margin:6px 0}
#t-read .terms dt{font-weight:600}#t-read .terms dd{margin:0}
@media (max-width:520px){#t-read .terms{grid-template-columns:minmax(0,1fr)}#t-read .terms dd{margin:0 0 4px}}
#t-read .hl{color:var(--acc);font-weight:600}
details.dp{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--bg)}
details.dp>summary{cursor:pointer;padding:7px 12px;font-size:14px;font-weight:600}
details.dp>summary .mute{font-weight:400}
details.dp>.b{padding:0 12px 10px;font-size:14px}
#t-read .rd-svg{width:100%;overflow:hidden;margin:6px 0}
#t-read .card h4 + .small{margin-top:0}
#t-read code{overflow-wrap:anywhere}
#t-read td{overflow-wrap:anywhere}
[hidden]{display:none!important}
@media (max-width:520px){#t-read .out{grid-template-columns:repeat(2,minmax(0,1fr))}#t-read .stat .v{font-size:16px}}
</style>
