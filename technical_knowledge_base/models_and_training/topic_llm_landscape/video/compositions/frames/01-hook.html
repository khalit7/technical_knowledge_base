  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var DUR = 5.76;

      // Scene 1 (0.00 to 3.01): anchor lands and pins
      tl.fromTo("#hook01-kicker", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0.0);
      tl.fromTo("#hook01-num", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.4)" }, 0.05);
      tl.fromTo("#hook01-leader", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0.18);
      tl.fromTo("#hook01-stamp", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.85);
      tl.fromTo("#hook01-chrome", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);

      // Discrete hard-cut cycle of the leader beside the pinned #1 ("change" 1.53, "every" 2.04, then 2.48)
      var SEQUENCE = [
        { t: 0.0, name: "claude opus 5.5", tag: "most published comparisons" },
        { t: 1.53, name: "gpt-6 astra", tag: "terminal-bench-science 0.1" },

        { t: 2.48, name: "glm-5.3", tag: "real-swe private codebases" }
      ];
      function stateAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return i;
        }
        return 0;
      }
      var nameEl = document.getElementById("hook01-name");
      var tagEl = document.getElementById("hook01-tag-val");
      var lastIdx = 0;
      var driver = { t: 0 };
      tl.to(driver, {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          var idx = stateAt(driver.t);
          if (idx !== lastIdx) {
            nameEl.textContent = SEQUENCE[idx].name;
            tagEl.textContent = SEQUENCE[idx].tag;
            lastIdx = idx;
          }
        }
      }, 0);

      // Scene 2 (3.01 to 5.27): slot shrinks aside + dims; hero line assembles per word

        ["#hook01-w-move", 4.75],
        ["#hook01-w-over", 4.99],
