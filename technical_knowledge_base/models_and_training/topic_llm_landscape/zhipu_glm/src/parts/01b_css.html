<style>
/* 2026-10-24 rebuild: top of page, hero, closed depth blocks, figure, inline diagrams */
.core{font-size:16.5px;line-height:1.5;border-left:4px solid var(--acc);padding:4px 0 4px 12px;margin:10px 0}
.terms{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;font-size:13.5px;margin:6px 0}
.terms dt{font-weight:600}.terms dd{margin:0}
@media (max-width:520px){.terms{grid-template-columns:minmax(0,1fr)}.terms dd{margin:0 0 4px}}
.hero{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.vt{font-weight:600;font-size:14.5px;margin:0 0 4px}
details.dp{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--bg)}
details.dp>summary{cursor:pointer;padding:7px 12px;font-size:14px;font-weight:600}
details.dp>summary .mute{font-weight:400}
details.dp>.b{padding:0 12px 10px}
figure.im{margin:12px 0;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
figure.im img{display:block;width:100%;max-width:788px;height:auto;margin:6px auto;background:#fff;border-radius:6px}
figure.im figcaption{font-size:13px}
figure.im .cr{font-size:12px;color:var(--mute)}
/* hero: one row per generation */
.zg-row{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) minmax(0,1fr) minmax(0,150px);gap:4px 12px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.zg-row:first-of-type{border-top:0}
.zg-row.zg-h{font-size:11.5px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:2px 0}
.zg-nm{font-weight:600;font-size:14px;line-height:1.3}.zg-nm .dt{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.zg-chips{display:flex;flex-wrap:wrap;gap:3px}
.zg-c{display:inline-block;font-size:12px;line-height:1.35;border:1px solid var(--line);border-left-width:4px;border-radius:5px;padding:1px 6px;background:var(--bg)}
.zg-c.ds{border-left-color:var(--c2)}.zg-c.ms{border-left-color:var(--c4)}.zg-c.ot{border-left-color:var(--mute)}.zg-c.zp{border-left-color:var(--acc);background:var(--acc2)}
.zg-bar{height:10px;background:var(--soft);border-radius:2px;position:relative;margin:3px 0 2px}.zg-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:2px}
.zg-kv{font-size:12.5px;line-height:1.35}.zg-kv b{font-size:13.5px}
.zg-key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute);margin:6px 0 0}
.zg-key span{border-left:4px solid;padding-left:5px}
@media (max-width:620px){.zg-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.zg-row .zg-nm{grid-column:1/-1}.zg-row.zg-h{display:none}.zg-row .zg-lb{display:block;font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase}.zg-row .zg-kvc{grid-column:1/-1}}
.zg-lb{display:none}
/* GRPO against the critic after compaction */
.zg-cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px 18px;margin:8px 0}
.zg-cmp>div{min-width:0}
.zg-cmp h4{margin:0 0 4px;font-size:13.5px}
.zg-tr{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:6px;align-items:center;font-size:12px;margin:3px 0}
.zg-seg{display:flex;gap:2px;height:16px}
.zg-seg i{display:block;height:100%;border-radius:2px;min-width:3px}
.zg-pos{background:var(--good)}.zg-neg{background:var(--bad)}
.zg-grad{background:linear-gradient(90deg,var(--bad),var(--dim) 45%,var(--good) 80%,var(--dim))}
.zg-grad2{background:linear-gradient(90deg,var(--dim),var(--bad) 60%,var(--dim))}
/* depth against width */
#zg-dw svg{display:block;max-width:100%}
</style>
<style id="kb-look">
/* Reading-site look (2026-10-29), from html_utils/apply_look.py; the template's 01_head.html carries the same */
:root{--bg:#f4f5f7;--card:#fff;--soft:#f0f2f5;--line:#e1e4e9;--ink:#1d2733;--mute:#5f6b7a;--acc:#2a62a8;--acc2:#dde8f6;
--shadow:0 1px 2px rgba(20,35,60,.06),0 8px 24px rgba(20,35,60,.07);--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#121519;--card:#1a1e24;--soft:#20252c;--line:#2c323b;--ink:#e6e9ee;--mute:#9aa4b2;--acc:#7aaee8;--acc2:#1f334b;
--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}}
body{background:var(--bg);font-size:16px;line-height:1.65}
.w{max-width:980px;padding:28px 20px 56px}
h1{font-family:var(--serif);font-size:clamp(28px,4.2vw,40px);line-height:1.12;letter-spacing:-.005em;font-weight:700}
.sub{font-size:15px;line-height:1.55;max-width:46em;margin:12px 0 18px}
h2{font-family:var(--serif);font-size:clamp(23px,3vw,29px);line-height:1.2;margin-top:56px;margin-bottom:12px;font-weight:700}
h3{font-size:16px}sub,sup{line-height:0}
section>p,section>ul,section>ol{max-width:46em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;margin:20px 0}
.card .card{box-shadow:none;margin:12px 0}.card h4{font-size:15.5px;line-height:1.35}
.co{background:var(--acc2);border-left-width:4px;border-radius:0 12px 12px 0;padding:12px 16px;margin:18px 0}
.co.warn{background:color-mix(in srgb,var(--bad) 12%,var(--bg))}.co.key{background:color-mix(in srgb,var(--good) 12%,var(--bg))}
button,select{background:var(--card);border-radius:8px}button:hover{border-color:var(--acc)}
.an-ctl button,.an-ctl select{border-radius:999px;padding:5px 14px}
.an-play{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
.seg{border-radius:20px;background:var(--soft);padding:3px;gap:2px;border-color:var(--line);flex-wrap:wrap;max-width:100%}
.seg button{border-radius:999px;background:transparent;padding:5px 13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,35,60,.15)}
.tabs button{font-size:15px;padding:9px 14px;border-radius:0;background:none}
.nav{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 0;gap:6px}
.nav a{font-size:13px;padding:4px 12px;background:var(--card)}
.nav a.cur{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.stat{background:var(--soft);border-color:transparent;border-radius:10px;padding:10px 12px}.stat .v{font-size:21px}
.an-cap:is(*,#kb){background:var(--soft);border-left-width:4px;border-radius:0 10px 10px 0;padding:10px 14px}
details.dp{background:var(--card);border-radius:12px}
.pr,.dr,.detail,.bet,.fm{background:var(--card);border-radius:12px}
@media (max-width:520px){body{font-size:15px}h1{font-size:26px}h2{margin-top:44px}.w{padding:20px 14px 40px}.card{padding:14px;border-radius:12px}.seg button{padding:5px 10px}
code{overflow-wrap:anywhere}math[display=block]{display:block math;max-width:100%;overflow-x:auto;overflow-y:hidden}}
</style><!--/kb-look-->
