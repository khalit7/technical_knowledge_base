<style>
/* Meta page additions */
:root{--meta:#1f6feb;--mus:#b5562d;--msl:#7a5bb5;--lla:#2f6fb5}
@media (prefers-color-scheme:dark){:root{--meta:#6ea8e6;--mus:#e8915c;--msl:#b48ce0;--lla:#6ea8e6}}
.era{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px;margin:10px 0}
.era>div{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--soft);min-width:0}
.era h4{margin:0 0 4px;font-size:14.5px}
.gen{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:14px 0}
.gen.o{border-left-color:var(--open)}.gen.c{border-left-color:var(--closed)}.gen.x{border-left-color:var(--mute)}
.gen h3{margin:0 0 4px}
.gen .dt{font-size:12.5px;color:var(--mute);font-weight:400}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;margin:8px 0}
.cmp>div{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.cmp h4{margin:0 0 4px;font-size:13.5px}
.l4s{display:grid;gap:2px;margin:6px 0}
.l4s span{height:30px;border-radius:2px;position:relative;cursor:default}
.l4s span.dn{background:var(--c5)}.l4s span.mo{background:var(--acc)}
.l4s span.gl:after{content:"";position:absolute;left:2px;right:2px;bottom:2px;height:6px;border-radius:1px;background:var(--bad)}
.l4s span.lo:after{content:"";position:absolute;left:2px;right:2px;bottom:2px;height:6px;border-radius:1px;background:var(--bg);opacity:.75}
.legsq{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}
.flow{font-size:13px}
.repro{font-size:12.5px;color:var(--mute);border:1px dashed var(--line);border-radius:6px;padding:6px 10px;margin:8px 0}
.repro b{color:var(--ink)}
.unc{color:var(--bad);font-size:11.5px;font-weight:600;white-space:nowrap}
.plot{overflow-x:auto}
.sc{font-size:12px}
.mesh{display:flex;height:30px;border-radius:5px;overflow:hidden;margin:6px 0;font-size:12px}
.mesh span{display:flex;align-items:center;justify-content:center;color:var(--bg);white-space:nowrap;overflow:hidden;min-width:0}
.fitbar{display:flex;height:26px;border-radius:4px;overflow:hidden;background:var(--soft);position:relative;margin:6px 0}
.fitbar span{display:flex;align-items:center;padding:0 6px;color:var(--bg);font-size:12px;white-space:nowrap;overflow:hidden}
.fitbar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.cardh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
table.ptab td.num{font-variant-numeric:tabular-nums}
.lnd{cursor:pointer}
.sp .rt{text-transform:none;letter-spacing:0;font-weight:400}
.ctl select{max-width:100%}.ctl input[type=range]{display:block;max-width:100%}
</style>
