   ["Reward", "Zero until the last token; one scalar (RM score or verifier pass/fail) at the end. Sparse, delayed; horizon = generation length; γ typically 1."],
   ["Policy", "The LLM itself, π_{θ}(a_{t} | s_{t})."]] },
  { type: "formula", label: "The objective: expected score of the policy's responses", html: `${I('J')}(θ) = ${E}<sub>${I('q')} ∼ 𝒟, ${I('o')} ∼ ${pth}(· | ${I('q')})</sub> [ ${I('r')}(${I('q')}, ${I('o')}) ]`, where: [
   [I('q'), "a prompt from the training prompt set 𝒟"], [I('o'), "a response sampled token by token from the policy; |o| is its length in tokens"], [`${I('r')}(${I('q')}, ${I('o')})`, "the scalar score of the whole response"], ["θ", "the model's weights"]] },
  { type: "formula", label: "The policy-gradient update", html: `∇<sub>θ</sub>${I('J')} ≈ ${FR('1', I('N'))} ${SUM(I('n'))} ${SUM(I('t'))} ∇<sub>θ</sub> log ${pth}(${I('o')}<sub>${I('t')}</sub> | ${I('q')}, ${I('o')}<sub>&lt;${I('t')}</sub>) · ${I('Â')}<sub>${I('t')}</sub>`, where: [
   [I('N'), "the number of sampled responses (sum over n), each summed over its tokens t"], [`${I('o')}<sub>&lt;${I('t')}</sub>`, "the tokens before position t"], [`${I('Â')}<sub>${I('t')}</sub>`, "the estimated **advantage** of token t: the score minus a **baseline**, the score this prompt was expected to get"]],
   note: "With γ = 1 and one reward at the end, the return from every token of a response is the same number, the final score. A baseline that does not depend on the action leaves the gradient unbiased and cuts its variance. How the advantage is estimated is what separates the algorithms: PPO learns a value model; GRPO uses a group of samples." },
  { type: "callout", kind: "warn", title: "Consequences", text: "Credit assignment is severe (one scalar for thousands of tokens); the environment model is trivially known, so model-based planning buys nothing; rollouts are expensive, because generation at inference speed dominates wall-clock time." }
 ] },
 { h: "PPO for RLHF (the InstructGPT recipe)", blocks: [
  { type: "table", head: ["Model", "Role"], rows: [
   ["**Policy** π_{θ}", "Trained; initialised from the SFT model."],
   ["**Reference** π_{ref}", "Frozen copy of the SFT model; the KL anchor."],
   ["**Reward model** r_{φ}", "Frozen; trained beforehand on human preference pairs (Bradley-Terry loss); one scalar per full response."],
   ["**Value model** V_{ψ}", "Trained alongside the policy (InstructGPT initialised it from the RM); predicts the expected final reward from each prefix, giving per-token advantages via GAE."]] },
  { text: "**The loop**: sample prompts; generate responses from π_{θ}; score each with the RM; subtract a per-token KL penalty; compute advantages with V_{ψ} and GAE (generalised advantage estimation); update the policy with the clipped objective and the value model by regression; repeat." },
  { type: "formula", label: "The shaped reward: the KL penalty folded in", html: `${I('r')}<sub>${I('t')}</sub> = 𝟙[${I('t')} = ${I('T')}] ${I('r')}<sub>φ</sub>(${I('q')}, ${I('o')}) − β log ${FR(`${pth}(${I('o')}<sub>${I('t')}</sub> | ${I('q')}, ${I('o')}<sub>&lt;${I('t')}</sub>)`, `${pref}(${I('o')}<sub>${I('t')}</sub> | ${I('q')}, ${I('o')}<sub>&lt;${I('t')}</sub>)`)}`, where: [
   [I('T'), "the position of the last token, |o|"], ["𝟙[t = T]", "1 at the last token, 0 elsewhere: the RM score lands only at the end"], ["β", "the KL coefficient"], ["log ratio", "a one-sample estimate of KL(π_{θ} ‖ π_{ref}) at that token; summed over the response it is InstructGPT's β log(π_{RL}(y | x) / π_{SFT}(y | x))"]] },
  { type: "formula", label: "Advantages with GAE", html: `δ<sub>${I('t')}</sub> = ${I('r')}<sub>${I('t')}</sub> + γ ${I('V')}<sub>ψ</sub>(${I('s')}<sub>${I('t')}+1</sub>) − ${I('V')}<sub>ψ</sub>(${I('s')}<sub>${I('t')}</sub>), &nbsp;&nbsp; ${I('Â')}<sub>${I('t')}</sub> = ${SUM(`${I('l')}=0`, `${I('T')}−${I('t')}`)} (γλ)<sup>${I('l')}</sup> δ<sub>${I('t')}+${I('l')}</sub>`, where: [
   ["δ<sub><i>t</i></sub>", "the temporal-difference (TD) error at token t"], [`${I('V')}<sub>ψ</sub>(${I('s')}<sub>${I('t')}</sub>)`, "the value model's prediction for the prefix s_{t} (zero after the last token)"], ["γ", "the discount, 1 here"], ["λ", "in [0, 1]: 0 trusts the value model (low variance, biased when it is wrong), 1 uses the final reward minus the baseline (unbiased, high variance)"]],
   note: "The value model is regressed onto the returns Â_{t} + V_{ψ}(s_{t})." },
  { type: "formula", label: "The clipped update", html: `${I('L')}<sup>CLIP</sup>(θ) = ${E}<sub>${I('t')}</sub>[ min( ρ<sub>${I('t')}</sub> ${I('Â')}<sub>${I('t')}</sub>, clip(ρ<sub>${I('t')}</sub>, 1 − ε, 1 + ε) ${I('Â')}<sub>${I('t')}</sub> ) ], &nbsp;&nbsp; ρ<sub>${I('t')}</sub> = ${FR(`${pth}(${I('o')}<sub>${I('t')}</sub> | ${I('s')}<sub>${I('t')}</sub>)`, `${pold}(${I('o')}<sub>${I('t')}</sub> | ${I('s')}<sub>${I('t')}</sub>)`)}`, where: [
   ["ρ<sub><i>t</i></sub>", "the **importance ratio** between the policy being updated and the policy that generated the data"], ["ε", "the clip range, typically 0.2"]],
   note: "Once the ratio has moved more than ε in the direction the advantage wants, the clipped term is the smaller one, it does not depend on θ, and the gradient is zero; moved the wrong way, the unclipped term wins and the gradient pulls it back. That is what makes several epochs on one batch of rollouts safe. Try it in Explore." },
  { type: "two", cols: [
   { title: "Why the KL penalty", blocks: [{ type: "list", items: ["Keeps the policy on-distribution for the reward model, which is only trustworthy near its training data (anti-reward-hacking).", "Preserves general capabilities and fluency.", "Acts as a trust region tied to a fixed anchor, not just to last iteration's policy."] }] },
   { title: "Pain points", blocks: [{ text: "Four large models in memory; the value model is as big as the policy, must be trained from scratch during RL, and per-token value estimation is hard when the reward is one scalar at the end. **GRPO removes exactly this pain.**" }] }] }
 ] },
 { h: "GRPO in detail (DeepSeekMath, 2024)", blocks: [
  { text: "**Group Relative Policy Optimization** is PPO minus the value model. For each prompt q, sample a **group** of G responses o_{1} … o_{G} from the current policy and score each, giving rewards r_{1} … r_{G}. Every token of response i gets the same advantage:" },
  { type: "formula", label: "The group-relative advantage", html: `${I('Â')}<sub>${I('i')},${I('t')}</sub> = ${FR(`${I('r')}<sub>${I('i')}</sub> − mean(${I('r')}<sub>1</sub>, …, ${I('r')}<sub>${I('G')}</sub>)`, `std(${I('r')}<sub>1</sub>, …, ${I('r')}<sub>${I('G')}</sub>)`)}`, where: [
   ["mean, std", "over the G rewards of this prompt's group only"], [I('t'), "indexes the tokens of response i; all get the same value"]],
   note: "The group mean is the baseline: a Monte Carlo estimate of the prompt's value V(q), computed from samples instead of predicted by a network. Implementations differ on dividing the std by G or G − 1 and add a small constant against division by zero; this page divides by G." },
  { type: "formula", label: "The GRPO objective", html: `𝒥<sub>GRPO</sub>(θ) = ${E}[ ${FR('1', I('G'))} ${SUM(I('i'))} ${FR('1', `|${I('o')}<sub>${I('i')}</sub>|`)} ${SUM(I('t'))} { min( ρ<sub>${I('i')},${I('t')}</sub> ${I('Â')}<sub>${I('i')},${I('t')}</sub>, clip(ρ<sub>${I('i')},${I('t')}</sub>, 1 − ε, 1 + ε) ${I('Â')}<sub>${I('i')},${I('t')}</sub> ) − β 𝔻<sub>KL</sub>[${pth} ‖ ${pref}] } ]`, where: [
   ["ρ<sub><i>i,t</i></sub>", "the per-token importance ratio π_{θ} / π_{θ old} for token t of response i"], [`|${I('o')}<sub>${I('i')}</sub>|`, "the length of response i: tokens are averaged within each response, then responses are averaged"], ["ε, β", "the clip range and the KL coefficient"]],
   note: "The KL term sits in the loss, not in the reward, so it does not contaminate the advantages." },
  { type: "formula", label: "The k3 KL estimator (Schulman), used by DeepSeek", html: `𝔻<sub>KL</sub> ≈ ${I('x')} − log ${I('x')} − 1, &nbsp;&nbsp; ${I('x')} = ${FR(`${pref}(${I('o')}<sub>${I('i')},${I('t')}</sub> | ·)`, `${pth}(${I('o')}<sub>${I('i')},${I('t')}</sub> | ·)`)}`, where: [
   [I('x'), "the reference's probability over the policy's, for the sampled token"]],
   note: "Never negative (x − log x − 1 ≥ 0 for every x > 0, zero only at x = 1), and unbiased for KL(π_{θ} ‖ π_{ref}) when tokens come from π_{θ}, because the expectation of x under π_{θ} is exactly 1." },
  { type: "widget", widget: { type: "calc", title: "The k3 estimator against the plain log-ratio", intro: "Move the ratio x = π_{ref} / π_{θ} for one sampled token.", inputs: [{ id: "x", label: "x = π_{ref} / π_{θ}", min: 0.1, max: 3, step: 0.05, value: 0.5, fmt: v => v.toFixed(2) }], outputs: [
   { label: "k3 = x − log x − 1 (never negative)", f: v => v.x - Math.log(v.x) - 1, fmt: v => (+v.toFixed(3)).toString() },
   { label: "plain estimate log(πθ / π ref) = −log x (can be negative on one sample)", f: v => -Math.log(v.x), fmt: v => (+v.toFixed(3)).toString().replace('-', '−') }], chart: { x: "x", from: 0.1, to: 3, n: 59, y: [0, 1], xlabel: "x = π ref / π θ", ylabel: "per-token estimate" } } },
  { type: "table", head: ["Published settings", "G", "β", "learning rate", "note"], rows: [
   ["DeepSeekMath-RL 7B", "64", "0.04", "1e-6", "one policy update per sampling batch, so the clip barely binds"],
   ["DeepSeek-R1-Zero", "16", "0.001", "3e-6", ""]], num: [1, 2] },
  { type: "example", title: "Worked example: one group of four", setup: "A maths prompt, G = 4, a binary verifier. One response is correct and three are wrong: r = (1, 0, 0, 0).", steps: [
   "Baseline: mean = (1 + 0 + 0 + 0) / 4 = 0.25.",
   "Spread: deviations 0.75, −0.25, −0.25, −0.25; squares average to (0.5625 + 3 × 0.0625) / 4 = 0.1875; std = √0.1875 = 0.433.",
   "Advantages: correct 0.75 / 0.433 = **+1.732** on every token; each wrong −0.25 / 0.433 = **−0.577**. They sum to zero.",
   "Clip on a correct token with ρ = 1.3, ε = 0.2: unclipped 1.3 × 1.732 = 2.252, clipped 1.2 × 1.732 = 2.078; the min is 2.078, constant in θ: **no more gradient**.",
   "Same ρ on a wrong token: unclipped 1.3 × (−0.577) = −0.751, clipped 1.2 × (−0.577) = −0.693; the min is −0.751, unclipped: **the gradient still flows** and pushes the token back down.",
   "KL on a token where the reference gives half the policy's probability: x = 0.5, k3 = 0.5 − ln 0.5 − 1 = 0.5 + 0.693 − 1 = 0.193."],
   result: "Edit this group yourself in Explore." },
  { type: "reveal", q: "What does a group where all four answers are correct contribute to the policy gradient?", a: "Nothing. Every reward equals the mean, so every advantage is zero; only the KL term acts. The same holds when all four are wrong. The group cost four rollouts and taught nothing, which is why DAPO's dynamic sampling filters such groups out." },
  { type: "h3", text: "What is gained and lost" },
  { type: "list", items: [
   "**No value model**: roughly half the memory, no critic warm-up, no per-token value estimation problem. The DeepSeek-R1 team report PPO matching GRPO only with careful GAE tuning (λ = 1.0; the common default 0.95 is much worse), and still at the cost of a full value model.",
   "**The baseline is REINFORCE-with-baseline** (from *Deep RL*): GRPO is closer to group-baselined REINFORCE with PPO-style clipping than to true PPO.",
   "**Pure Monte Carlo credit**: every token in a response is credited equally; fine for verifiable tasks, noisier for long-horizon agentic tasks.",
   "**G rollouts per prompt** (typically 8 to 64): cost shifts from memory to inference compute."] }
 ] },
 { h: "RLVR: verifiable rewards", blocks: [
  { text: "**RL with Verifiable Rewards** replaces the learned reward model with a programmatic verifier: exact-match answer checking for maths, unit tests for code, format checks, task-success checks for agents. The reward is typically binary or a small rubric sum." },
  { type: "callout", title: "The reference shape: DeepSeek-R1-Zero's reward", text: "An accuracy reward (final answer matched against the reference for maths; compilation plus hidden tests for code) plus a format reward for reasoning inside `<think>` tags, equally weighted, and deliberately no neural reward model." },
  { type: "two", cols: [
   { title: "Benefits", text: "No reward-model bias to hack, no preference-data collection, scales with compute." },
   { title: "Limits", text: "Only works where a verifier exists; imperfect verifiers (extractable answers, weak test suites) reintroduce hacking (*Reward Hacking*). Extending RLVR beyond maths and code, \"the verifier problem\", with rubric-based and generative verifiers, is a main 2026 research front." }] },
  { text: "A third reward source: **Reinforcement Learning for Calibrated Decisions**, the method behind TypeSafe's Jev, rewards a well-calibrated confidence score on a typed decision rather than a preferred or passing answer, a property neither RLHF nor RLVR scores. The surrounding product claims (40x to 200x faster than frontier models on comparable tasks) are vendor-reported with no independent evaluation." }
 ] },
 { h: "Case study: DeepSeek-R1 and R1-Zero", blocks: [
  { type: "list", items: [
   "**R1-Zero**: GRPO + RLVR (accuracy + format rewards) directly on the DeepSeek-V3 base model, no SFT. Long chain-of-thought (CoT), self-verification and \"aha-moment\" backtracking **emerged** from RL alone; response length grew as the model learned to spend more test-time compute, and AIME 2024 pass@1 (one sample solving a problem from the American Invitational Mathematics Examination) climbed from 15.6% to 77.9%. Weaknesses: readability, language mixing.",
   "**R1**: cold-start SFT on curated CoT, reasoning-focused RL, rejection sampling to build a new SFT set, a second RL stage for helpfulness and harmlessness. Matched o1-class reasoning at open weights and made GRPO+RLVR the default open recipe through 2025 and 2026.",
   "**Distillation**: cheaper than RL on small models, and better. On Qwen2.5-32B, plain SFT on 800k R1-generated samples beat the full R1-Zero RL recipe run on the same base for over 10,000 steps."] }
 ] },
 { h: "Current debates and refinements", blocks: [
  { text: "The GRPO baseline has accumulated well-understood biases and a family of fixes." },
  { type: "h3", text: "Dr. GRPO: two normalisations that bias the update" },
  { type: "list", items: [
   "**Length bias from 1/|o_{i}|**: every token of a long response carries less weight. Correct answers: shorter ones get bigger updates. Wrong answers: long ones are penalised less per token, so the policy drifts towards long wrong answers. With Â = −0.577, a 100-token wrong response weights each token −0.00577, a 1,000-token one only −0.000577: ten times less push-down.",
   "**Difficulty bias from std**: near-uniform groups (too easy, too hard) have a small std, so their advantages are inflated. Group of 16 with one correct: mean 0.0625, std 0.242, the correct answer gets +3.873. Group of 16 with 8 correct: std 0.5, a correct answer gets +1.0."] },
  { type: "formula", label: "The fix", html: `${I('Â')}<sub>${I('i')},${I('t')}</sub> = ${I('r')}<sub>${I('i')}</sub> − mean(${I('r')}<sub>1</sub>, …, ${I('r')}<sub>${I('G')}</sub>)`, where: [["mean", "the group mean; no division by the std"]], note: "Token losses are summed and divided by a constant (the maximum generation length in the authors' code), not by each response's own length: an unbiased REINFORCE-style estimator with a group-mean baseline. Better token efficiency at equal reasoning performance; the minimalist recipe reaches 43.3% on AIME 2024 from a 7B base model." },
  { type: "h3", text: "DAPO: four fixes for long chain-of-thought RL" },
  { text: "ByteDance Seed with Tsinghua's Institute for AI Industry Research; an open, widely adopted recipe that reports 50 points on AIME 2024 from the Qwen2.5-32B base, above DeepSeek-R1-Zero-Qwen-32B's 47 with 50% of its training steps." },
  { type: "steps", items: [
   "**Clip-higher**: ε_{low} = 0.2, ε_{high} = 0.28. With a symmetric 0.2 a token at probability 0.01 can rise only to 0.012 in one update while one at 0.9 is effectively unconstrained, so exploratory tokens cannot grow and entropy collapses; with 0.28 it can reach 0.0128.",
   "**Dynamic sampling**: over-sample and drop groups whose rewards are all identical (zero advantage), until the batch is full of groups with signal.",
   "**Token-level loss**: divide by the total token count Σ|o_{i}| instead of averaging per response then per group, so long responses are not under-weighted.",
   "**Overlong reward shaping**: a soft length penalty instead of a flat one for truncation (below)."] },
  { type: "formula", label: "Soft overlong punishment", html: `${I('R')}<sub>length</sub>(${I('y')}) = 0 if |${I('y')}| ≤ ${I('L')}<sub>max</sub> − ${I('L')}<sub>cache</sub>; &nbsp; ${FR(`(${I('L')}<sub>max</sub> − ${I('L')}<sub>cache</sub>) − |${I('y')}|`, `${I('L')}<sub>cache</sub>`)} in the soft zone; &nbsp; −1 if |${I('y')}| &gt; ${I('L')}<sub>max</sub>`, where: [
   ["|<i>y</i>|", "the response length in tokens"], [`${I('L')}<sub>max</sub>`, "the maximum length, 16,384 in the paper"], [`${I('L')}<sub>cache</sub>`, "the width of the soft zone, 4,096"]], note: "A 14,336-token response: (12,288 − 14,336) / 4,096 = −0.5." },
  { type: "widget", widget: { type: "calc", title: "The overlong penalty at any length", intro: "DAPO's settings: L_{max} = 16,384, L_{cache} = 4,096.", inputs: [{ id: "y", label: "response length |y| in tokens", min: 0, max: 18000, step: 64, value: 14336, fmt: v => v.toLocaleString('en-GB') }], outputs: [
   { label: "length reward R_{length}(y)", f: v => v.y <= 12288 ? 0 : v.y <= 16384 ? (12288 - v.y) / 4096 : -1, fmt: v => (+v.toFixed(3)).toString().replace('-', '−') }], chart: { x: "y", from: 0, to: 18000, n: 101, y: [0], xlabel: "response length (tokens)", ylabel: "length reward" } } },
  { type: "h3", text: "GSPO: the ratio at the sequence level" },
  { text: "Qwen Team, Alibaba. Token-level ratios are noisy and misaligned with a sequence-level reward, which destabilises long sequences and mixture-of-experts (MoE) training. GSPO uses one length-normalised ratio per response and clips whole sequences; the paper credits it with contributing to the RL of the Qwen3 models." },
  { type: "formula", label: "Sequence-level ratio and objective", html: `${I('s')}<sub>${I('i')}</sub>(θ) = ( ${FR(`${pth}(${I('o')}<sub>${I('i')}</sub> | ${I('q')})`, `${pold}(${I('o')}<sub>${I('i')}</sub> | ${I('q')})`)} )<sup>1/|${I('o')}<sub>${I('i')}</sub>|</sup>, &nbsp;&nbsp; 𝒥<sub>GSPO</sub> = ${E}[ ${FR('1', I('G'))} ${SUM(I('i'))} min( ${I('s')}<sub>${I('i')}</sub> ${I('Â')}<sub>${I('i')}</sub>, clip(${I('s')}<sub>${I('i')}</sub>, 1 − ε, 1 + ε) ${I('Â')}<sub>${I('i')}</sub> ) ]`, where: [
   [`${I('s')}<sub>${I('i')}</sub>`, "the geometric mean of the response's per-token ratios"], [`${I('Â')}<sub>${I('i')}</sub>`, "its group-relative advantage"]], note: "Because s_{i} sits so close to 1, the clip ranges are tiny: 3e-4 below and 4e-4 above in the paper." },
  { type: "widget", widget: { type: "calc", title: "Three token ratios, one sequence ratio", intro: "The page's example: per-token ratios 1.1, 0.9 and 1.0.", inputs: [
   { id: "a", label: "ratio of token 1", min: 0.5, max: 1.5, step: 0.01, value: 1.1, fmt: v => v.toFixed(2) }, { id: "b", label: "ratio of token 2", min: 0.5, max: 1.5, step: 0.01, value: 0.9, fmt: v => v.toFixed(2) }, { id: "c", label: "ratio of token 3", min: 0.5, max: 1.5, step: 0.01, value: 1.0, fmt: v => v.toFixed(2) }], outputs: [
   { label: "mean log-ratio (ln a + ln b + ln c) / 3", f: v => (Math.log(v.a) + Math.log(v.b) + Math.log(v.c)) / 3, fmt: v => (+v.toFixed(5)).toString().replace('-', '−') },
   { label: "GSPO sequence ratio s_{i}", f: v => Math.exp((Math.log(v.a) + Math.log(v.b) + Math.log(v.c)) / 3), fmt: v => (+v.toFixed(5)).toString() },
   { label: "tokens outside a per-token clip of 0.2", f: v => [v.a, v.b, v.c].filter(r => r > 1.2 || r < 0.8).length, fmt: v => String(v) }] } },
  { type: "h3", text: "Off-policy corrections" },
  { text: "Two sources of off-policyness: (a) minibatch updates make later steps off-policy within a batch; (b) **training/inference mismatch**: the vLLM or SGLang rollout engine computes slightly different probabilities than the training stack (kernels, precision, KV-cache). Standard fixes (verl \"rollout correction\"): truncated importance sampling (TIS) against the actual rollout probabilities, masked/clipped IS (MIS/CISPO-style), or rejection sampling." },
  { type: "formula", label: "Token-level truncated importance sampling", html: `${I('w')}<sub>${I('t')}</sub> = min( ${FR(`${I('π')}<sub>train</sub>(${I('o')}<sub>${I('t')}</sub> | ${I('s')}<sub>${I('t')}</sub>)`, `${I('π')}<sub>rollout</sub>(${I('o')}<sub>${I('t')}</sub> | ${I('s')}<sub>${I('t')}</sub>)`)}, ${I('C')} )`, where: [
   [`${I('π')}<sub>train</sub>`, "the probability the training stack computes for the sampled token under the old policy"], [`${I('π')}<sub>rollout</sub>`, "the probability the inference engine actually sampled it with"], [I('C'), "the truncation threshold; verl's default is 2.0"]],
   note: "The sequence-level variant multiplies the per-token ratios (thresholds typically 2 to 10); rejection sampling masks tokens or sequences outside set bounds. \"Group-Relative REINFORCE is Secretly Off-Policy\" (2025) reframes GRPO as off-policy REINFORCE, making these corrections principled. Diagnostic for a from-scratch loop: log rollout-time and training-time logprobs and watch the gap." },
  { type: "widget", widget: { type: "calc", title: "One token's TIS weight", intro: "The page's example: sampled at 0.20, scored at 0.25 by the trainer.", inputs: [
   { id: "tr", label: "π_{train}(token)", min: 0.01, max: 1, step: 0.01, value: 0.25, fmt: v => v.toFixed(2) }, { id: "ro", label: "π_{rollout}(token)", min: 0.01, max: 1, step: 0.01, value: 0.2, fmt: v => v.toFixed(2) }, { id: "C", label: "threshold C", min: 1, max: 10, step: 0.5, value: 2, fmt: v => v.toFixed(1) }], outputs: [
   { label: "raw ratio π_{train} / π_{rollout}", f: v => v.tr / v.ro, fmt: v => (+v.toFixed(3)).toString() },
   { label: "TIS weight min(ratio, C)", f: v => Math.min(v.tr / v.ro, v.C), fmt: v => (+v.toFixed(3)).toString() }] } },
  { type: "h3", text: "Open questions and newer threads" },
  { type: "list", items: [
   "**Does RLVR teach or elicit?** Early pass@k studies: RLVR beats the base at k = 1 but not at large k (sharpening within base-model support, the \"invisible leash\"); \"Spurious Rewards\": random rewards still improve Qwen-Math (ablate on several base families). DeepSeekMath saw the same shape: RL raised Maj@K (majority vote) but not Pass@K. Counter-evidence at ICLR 2026 (CoT-Pass@k, judging the reasoning chain) finds gains beyond the base at all k. The consensus by mid-2026 was that RLVR reliably converts pass@k into pass@1 and improves reasoning validity; capability outside base-model support remains contested, with prolonged multi-stage RL (ProRL-style) the strongest claim for expansion.",
   "**Cost as a term in the objective**: Cognition trained SWE-2's whole effort ladder in a single RL run with slope-matched cost penalties, so the optimiser solves the cost-quality trade. SWE-2 medium used 58% fewer turns and cost 81% less than SWE-1.7 on the same work; for agentic RL, turn count is where the money goes.",

  { type: "list", items: [
   "**Assuming the rollout policy is the old policy.** The engine's probabilities differ from the trainer's; log both and correct with TIS or rejection sampling.",
   "**Forgetting that uniform groups teach nothing.** All right or all wrong means zero advantage everywhere; filter or resample, and track the zero-signal fraction.",

takeaways: [
 "Token generation is an MDP with a deterministic transition, a vocabulary-sized action space and one reward at the end; the hard part is credit assignment.",
 "PPO-RLHF uses four models: policy, frozen reference (KL in the reward), frozen reward model, and a trained value model for per-token advantages via GAE.",
 "GRPO deletes the value model: advantage = (r − group mean) / group std, the same for every token of a response, with the KL moved into the loss (k3 estimator).",
 "The clip stops the gradient only when the ratio has already moved past 1 ± ε in the direction the advantage wants.",
 "A group whose rewards are all identical has zero advantage and teaches nothing: filter it (DAPO's dynamic sampling).",
 "Dr. GRPO drops the 1/|o_{i}| and std terms (length and difficulty biases); DAPO adds clip-higher, token-level loss and overlong shaping; GSPO clips whole sequences.",
 "RLVR swaps the reward model for a program; it cannot be flattered but only exists where answers are checkable, and weak verifiers are hackable.",
 "Rollout engines and trainers disagree on probabilities: log both and correct with truncated importance sampling."
],
glossary: [
 { term: "RLHF", def: "RL from human feedback: a reward model trained on human preference pairs scores responses, and the policy is optimised against it (classically with PPO and a KL penalty)." },
 { term: "RLVR", def: "RL with verifiable rewards: a program (answer checker, unit tests, format check) supplies the reward instead of a learned model." },
 { term: "PPO", def: "Proximal policy optimisation: a policy-gradient method whose clipped importance-ratio objective makes several update epochs on one batch safe." },
 { term: "GRPO", def: "Group relative policy optimisation: PPO without a value model; the advantage is the reward minus the group mean, divided by the group std." },
 { term: "Advantage", def: "How much better an action (here, a response's tokens) did than a baseline expectation; it weights the policy-gradient update." },
 { term: "Baseline", def: "A value subtracted from the score to cut variance without biasing the gradient; PPO learns it, GRPO takes the group mean." },
 { term: "GAE", def: "Generalised advantage estimation: an exponentially weighted sum of TD errors with parameter λ trading bias against variance." },
 { term: "Importance ratio", def: "π_{θ}(token) / π_{θ old}(token): how much more likely the token is under the policy being updated than under the one that generated it." },
 { term: "Reference model", def: "A frozen copy of the SFT model used as the KL anchor." },
 { term: "k3 estimator", def: "Schulman's low-variance, never-negative per-sample KL estimate x − log x − 1, with x = π_{ref} / π_{θ}." },
 { term: "Dr. GRPO", def: "GRPO Done Right: drops length normalisation and std normalisation, which bias GRPO towards long wrong answers and extreme-difficulty prompts." },
 { term: "DAPO", def: "Decoupled Clip and Dynamic sAmpling Policy Optimization: clip-higher, dynamic sampling, token-level loss and overlong reward shaping." },
 { term: "GSPO", def: "Group Sequence Policy Optimization: a length-normalised sequence-level importance ratio, clipped per sequence." },
 { term: "Clip-higher", def: "An asymmetric clip range with a larger upper bound (DAPO: 0.2 and 0.28) so low-probability tokens can grow and entropy does not collapse." },
 { term: "Dynamic sampling", def: "Dropping groups whose rewards are all identical (zero advantage) and sampling more until the batch has signal." },
 { term: "TIS", def: "Truncated importance sampling: reweight each token by min(π_{train} / π_{rollout}, C) to correct the training/inference mismatch." },
 { term: "Training/inference mismatch", def: "The rollout engine and the training stack compute slightly different probabilities for the same tokens (kernels, precision, KV-cache), making data subtly off-policy." },
 { term: "pass@k", def: "The probability that at least one of k samples solves a problem; pass@1 is single-sample accuracy." }
],

<script>
/* ===== PAGE CUSTOM WIDGETS (optional): CUSTOM.name = (el, props, K) => { ... }; reads its numbers from props or DATA ===== */
const CUSTOM = {};
/* Custom widgets for "RL for LLMs: RLHF, GRPO, RLVR".
   grouplab: one GRPO group you edit; advantages under GRPO and Dr. GRPO, and per-token weights under the three loss aggregations.
   clip:     the PPO/GRPO clipped objective against the importance ratio, symmetric or clip-higher, for the page's two advantages. */

const RLL = {
  // plain decimal with up to d significant decimals, never exponent notation; minus sign as U+2212
  num(v, d = 3) {
    if (!isFinite(v)) return '-';
    let s = Math.abs(v) < 0.01 && v !== 0 ? v.toFixed(6).replace(/0+$/, '') : (+v.toFixed(d)).toString();
    return s.replace('-', '−');
  },
  signed(v, d = 3) { return (v > 0 ? '+' : '') + RLL.num(v, d); }
};

CUSTOM.grouplab = (el, o, K) => {
  const presets = o.presets; // [{name, rewards}]
  let rewards = presets[0].rewards.slice();
  let mode = 'grpo', agg = 'seq', lens = 'wrongLong', sel = 0;
  const L = o.budget;

  const aggBar = K.seg([['seq', 'GRPO: 1/|oᵢ| per response'], ['tok', 'DAPO: 1/Σ|o| over tokens'], ['const', 'Dr. GRPO: 1/constant']], agg, v => { agg = v; draw(); });
  const lenBar = K.seg([['wrongLong', `wrong answers ramble (${o.shortLen} vs ${o.longLen} tokens)`], ['equal', `all ${o.longLen} tokens`]], lens, v => { lens = v; draw(); });
  const sizeBar = h => K.h('div', { class: 'bar' },
    K.h('button', { onclick: () => { if (rewards.length > 2) { rewards.pop(); sel = Math.min(sel, rewards.length - 1); draw(); } } }, '− response'),
    K.h('button', { onclick: () => { if (rewards.length < 16) { rewards.push(0); draw(); } } }, '+ response'));
  const chips = K.h('div', { class: 'bar' });
  const rows = K.h('div');

  function draw() {

      const bar = K.h('div', { style: 'position:relative;height:16px;background:var(--soft);border-radius:4px' },
        K.h('div', { style: 'position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--mute)' }),
        K.h('div', { style: `position:absolute;top:2px;bottom:2px;border-radius:3px;${x >= 0 ? `left:50%;width:${pct}%;background:var(--good)` : `right:50%;width:${pct}%;background:var(--bad)`}` }));
      rows.append(K.h('div', { class: 'item click', role: 'button', tabindex: 0, style: `display:grid;grid-template-columns:minmax(64px,90px) minmax(0,1fr) minmax(84px,110px);gap:8px;align-items:center;padding:3px 4px;margin:2px 0;${i === sel ? 'outline:2px solid var(--acc);' : ''}`, onclick: () => { sel = i; draw(); } },

CUSTOM.clip = (el, o, K) => {
  let A = o.advs[0][0], eL = 0.2, eH = 0.2, rho = o.rho;
  const advBar = K.seg(o.advs.map(([v, l]) => [v, l]), A, v => { A = v; draw(); });
  const pre = K.seg([['sym', 'PPO / GRPO: ε = 0.2 both sides'], ['dapo', 'DAPO clip-higher: 0.2 and 0.28']], 'sym', v => { eL = 0.2; eH = v === 'dapo' ? 0.28 : 0.2; sL.set(eL); sH.set(eH); draw(); });
  const sR = K.slider({ label: 'importance ratio ρ', min: 0.5, max: 1.6, step: 0.01, value: rho, fmt: v => v.toFixed(2), onInput: v => { rho = v; draw(); } });
  const sL = K.slider({ label: 'ε_{low}', min: 0.05, max: 0.4, step: 0.01, value: eL, fmt: v => v.toFixed(2), onInput: v => { eL = v; draw(); } });
  const sH = K.slider({ label: 'ε_{high}', min: 0.05, max: 0.4, step: 0.01, value: eH, fmt: v => v.toFixed(2), onInput: v => { eH = v; draw(); } });
  const ctls = K.h('div', { class: 'ctls' }, sR, sL, sH);
  const chartBox = K.h('div');
  const tiles = K.h('div', { class: 'tiles' });
  const work = K.h('div', { class: 'panel' });
  const lab = t => K.h('div', { class: 'small mute', style: 'margin:8px 0 2px' }, t);
  el.append(lab('Advantage of the token (from the page\'s worked example)'), advBar, lab('Clip range'), pre, ctls, chartBox, tiles, work);
  let chart = null;
  const obj = (r, a) => Math.min(r * a, Math.min(Math.max(r, 1 - eL), 1 + eH) * a);
  function draw() {
    const xs = [...Array(111)].map((_, k) => 0.5 + k * 0.01);
    const ser = [{ name: 'unclipped ρ × A', points: xs.map(x => [x, x * A]), dash: '5 4' }, { name: 'clipped objective min(ρA, clip(ρ)A)', points: xs.map(x => [x, obj(x, A)]) }];
    const marks = [{ x: 1 - eL, label: 'lower clip' }, { x: 1 + eH, label: 'upper clip' }, { x: rho, label: 'ρ' }];
    if (!chart) chart = K.lineChart(chartBox, { series: ser, xlabel: 'importance ratio ρ = πθ / π old', ylabel: 'objective for this token', marks, height: 240, xfmt: v => v.toFixed(1) });
    else { chart.opts.marks = marks; chart.set(ser); }
    const cl = Math.min(Math.max(rho, 1 - eL), 1 + eH);
    const un = rho * A, cv = cl * A, m = Math.min(un, cv);
    const flat = cl !== rho && m === cv && cv !== un;
    tiles.innerHTML = '';
    [[RLL.num(un, 3), 'unclipped ρ × A'], [RLL.num(cv, 3), `clipped clip(ρ) × A, clip(ρ) = ${RLL.num(cl, 2)}`], [RLL.num(m, 3), 'the min: what is optimised'], [flat ? 'zero' : 'flows', 'gradient for this token']]
      .forEach(([b, s]) => tiles.append(K.h('div', { class: 'tile' }, K.h('b', null, b), K.h('span', null, s))));
    const why = flat ? (A > 0 ? `The ratio is already above 1 + ε_{high} = ${RLL.num(1 + eH, 2)} and the advantage wants it higher: the clipped term wins, it does not depend on θ, so the token stops being pushed.` : `The ratio is already below 1 − ε_{low} = ${RLL.num(1 - eL, 2)} and the advantage wants it lower: the clipped term wins and the token stops being pushed.`)

    const p1 = 0.01, p2 = 0.9;
    work.innerHTML = K.md(`min(${RLL.num(rho, 2)} × ${RLL.num(A, 3)}, ${RLL.num(cl, 2)} × ${RLL.num(A, 3)}) = min(${RLL.num(un, 3)}, ${RLL.num(cv, 3)}) = **${RLL.num(m, 3)}**. ${why} With ε_{high} = ${RLL.num(eH, 2)}, one update can raise a token at probability ${p1} to at most ${RLL.num(p1 * (1 + eH), 4)}, and a token at ${p2} to ${RLL.num(Math.min(1, p2 * (1 + eH)), 3)}${p2 * (1 + eH) > 1 ? ' (capped at 1: effectively unconstrained)' : ''}: the reason DAPO raises the upper bound.`);
  }
  draw();
};
