<style id="kb-split">
/* The split layout (standing rule, 2026-11-06): a section with a visual is two columns, the explanation on the left and the visual on the right,
   sticky while its section is read; a section without a visual is full width. Below 1100 px the visual sits at the top of its section
   (a stage stays under the section nav while its steps are read; a figure card scrolls with the text). Classes are prefixed s3 to avoid page classes. */
.s3sp{position:relative;margin-top:8px}
.s3R{display:contents}
.stg{position:sticky;top:50px;z-index:3;height:min(44vh,330px);min-height:250px;margin:6px 0 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.stg-top{display:flex;justify-content:space-between;gap:10px;padding:8px 12px 0;font:11.5px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.stg-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.stg-top span:last-child{white-space:nowrap}
.stg-cv{position:relative;flex:1;min-height:0}
.stg canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}.stg canvas.dr{cursor:grabbing}
.stg-rv{position:absolute;right:8px;top:4px;font-size:12px;padding:2px 10px;border-radius:999px}
.stg-hint{position:absolute;right:10px;bottom:4px;font:11px ui-monospace,Menlo,monospace;color:var(--mute);pointer-events:none;letter-spacing:.04em}
.stg-bar{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;padding:6px 10px 8px;border-top:1px solid var(--line);margin:0}
.stg .stg-bar.an-ctl{flex-wrap:nowrap}.stg .stg-bar button{padding:4px 11px;font-size:13px;white-space:nowrap}.stg .stg-bar input.stg-r{flex:1 1 40px;min-width:30px}.stg .stg-bar select{font-size:12.5px;padding:3px 6px}
/* the step list: the explanation of the animation, one item per step; the current step is marked, a click jumps to it */
ol.sx{list-style:none;counter-reset:sx;padding:0;margin:12px 0 18px;max-width:46em}
ol.sx>li{counter-increment:sx;position:relative;padding:8px 12px 8px 40px;margin:0 0 4px;border-radius:10px;border-left:3px solid transparent;cursor:pointer;color:var(--mute);transition:background .25s,color .25s,border-color .25s}
ol.sx>li::before{content:counter(sx);position:absolute;left:10px;top:9px;width:21px;height:21px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:600 12px/19px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;text-align:center;color:var(--mute)}
ol.sx>li b{color:var(--ink)}
ol.sx>li.done{color:var(--ink)}ol.sx>li.done::before{background:var(--soft)}
ol.sx>li.on{background:var(--card);color:var(--ink);border-left-color:var(--acc);box-shadow:var(--shadow)}ol.sx>li.on::before{background:var(--acc);border-color:var(--acc);color:var(--bg)}
ol.sx>li:hover{background:var(--soft)}ol.sx>li.on:hover{background:var(--card)}
ol.sx>li:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sxh{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 0}
.s3chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}.s3chips button{border-radius:999px;padding:3px 12px;font-size:13.5px}
.s3chips button.on{background:var(--c2);border-color:var(--c2);color:var(--bg)}
.s3q{color:var(--c2);font-weight:600}.s3k{color:var(--c6);font-weight:600}.s3v{color:var(--c4);font-weight:600}
/* a compact 2D animation card (about 320 px tall or less on a phone) that should stay in view while its step list is read: put it first in .s3R with class s3stick */
@media (max-width:1099px){.s3stick{position:sticky;top:50px;z-index:3}}
.s3side .card{margin-top:6px}
@media (min-width:1100px){
  .w:has(.tab:not([hidden]) .s3sp){max-width:1380px}
  .s3sp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);column-gap:40px;align-items:stretch}
  .s3L{grid-column:1;grid-row:1;min-width:0}
  .s3R{display:block;grid-column:2;grid-row:1;min-width:0}
  .stg{top:58px;height:min(calc(100vh - 80px),660px);margin:20px 0 0}
  .s3side{position:sticky;top:58px;margin-top:20px}
  .s3L section>h2:first-child{margin-top:44px}
}
@media (max-width:520px){.stg{top:50px;height:min(52vh,400px);min-height:270px;border-radius:12px}.stg-bar{gap:4px;padding:5px 6px 6px}.stg .stg-bar button{padding:4px 9px}.stg .stg-bar select{padding:3px 4px}.stg-hint{display:none}ol.sx>li{padding:7px 10px 7px 36px}ol.sx>li::before{left:7px}}
</style>
