<style>
.tab .nl{display:inline-block;font-style:normal;font-size:10.5px;line-height:1.35;font-weight:600;border-radius:4px;padding:0 4px;margin:0 2px;border:1px solid currentColor;vertical-align:1px;white-space:nowrap}
.tab .nl.d{color:var(--c1)}.tab .nl.i{color:var(--bad)}.tab .nl.r{color:var(--c4)}.tab .nl.u{color:var(--mute)}
.co.corr{border-left-color:var(--bad)}.co.corr .t{color:var(--bad)}
.an-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0}
.an-ctl input[type=range]{flex:1 1 120px;width:auto;min-width:0}
.an-ctl select{padding:3px 6px}.an-play{min-width:6.4em}
.an-cap{min-height:5.2em;border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:8px 0}
.an-cap .t{font-weight:600;font-size:14px}.an-cap p{margin:2px 0;font-size:13.5px}
.an-cnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:6px;margin:6px 0}
.an-cnt .stat .v{font-size:16px}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:4px 0}
.leg i{display:inline-block;width:14px;height:3px;border-radius:0;margin-right:5px;vertical-align:middle}
.rd-svg{width:100%;overflow:hidden}
.rd-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.rd-two>div{min-width:0}
.rd-ph{font-size:12px;color:var(--mute);font-weight:600;margin:6px 0 2px}
table.rd-t{font-size:13px}table.rd-t td,table.rd-t th{padding:5px 6px}
table.rd-t td:first-child{font-weight:600}
.rd-sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:6px 16px;margin:8px 0}
.rd-sl label{font-size:13px;display:block;min-width:0}
.rd-btns{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0;align-items:center}
.rd-btns button{font-size:12.5px;padding:3px 9px}
.seg{flex-wrap:wrap;max-width:100%}
.rd-pred{border:1px dashed var(--acc);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13.5px}
.rd-pred .ans{margin-top:6px}
.rd-eqline{font-family:"Cambria Math","STIX Two Math",Cambria,Georgia,serif;font-size:15px;overflow-wrap:anywhere;padding:2px 0}
h2 .num{color:var(--mute);font-weight:500;margin-right:4px}
.fm .eq{white-space:normal}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0}.prog>div{height:100%;background:var(--acc);width:0}
.repro{font-size:12.5px;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:8px 0}.repro b{color:var(--ink)}
.algo{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:520px){table.rd-t{font-size:12.5px}.rd-eqline{font-size:14px}}
</style>
<style>
.bars .ml{display:block;font-size:11px;color:var(--mute);white-space:normal;line-height:1.2}
.bars .row .nm{white-space:normal;line-height:1.25}
#vb-ev .row,#vb-sd .row,#vb-abS .row{grid-template-columns:minmax(0,16em) minmax(0,1fr) 4.6em}
#ab-b .row,#ab-gb .row{grid-template-columns:minmax(0,10em) minmax(0,1fr) 3.6em;margin:2px 0}
#ab-b .track,#ab-gb .track{height:11px}
@media (max-width:520px){#vb-ev .row,#vb-sd .row,#vb-abS .row{grid-template-columns:minmax(0,10.5em) minmax(0,1fr) 4em}}
</style>
