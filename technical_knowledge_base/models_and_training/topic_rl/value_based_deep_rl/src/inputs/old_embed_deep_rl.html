 ]},
 { h: "DQN: Q-learning with a network, made stable", blocks: [
  { text: "**DQN** is Q-learning with a convolutional network reading raw pixels and outputting one Q-value per action. The 2013 version learned seven Atari games with **experience replay**; the 2015 Nature version added a **target network** and played 49 games with one architecture and one set of hyperparameters. Input: the last 4 frames stacked, since one frame shows where the ball is but not where it is going." },
  { type: "formula", label: "The DQN loss", html: `<i>L</i>(θ) = ${E}<sub>(<i>s,a,r,s′</i>) ∼ 𝒟</sub>[ ( <i>r</i> + γ ${MAX('<i>a′</i>')} ${Q("<i>s′</i>, <i>a′</i>", thm)} − ${Q('<i>s</i>, <i>a</i>', th)} )<sup>2</sup> ]`, where: [["θ", "online network weights, the ones being trained"], [thm, "target network weights, a frozen copy"], ["𝒟", "the replay buffer"], ["(<i>s, a, r, s′</i>)", "a stored transition: state, action, reward, next state"], ["γ", "discount factor"]], note: "At a terminal s′ the target is just r. The Nature paper clipped the TD error to -1 to 1, a Huber-style loss." },
  { type: "two", cols: [
   { title: "Experience replay", text: "Store transitions (the most recent 1 million) and train on random minibatches: breaks the correlation, reuses each transition many times. Legitimate only because Q-learning is **off-policy**." },
   { title: "Target network", text: "Compute targets with θ^{−}, copied from θ only every C updates (10,000): the regression target stands still. Otherwise raising Q(s_{t}, a_{t}) also raises Q(s_{t+1}, a), and so the target: oscillation or divergence." } ] },
  { type: "example", title: "One DQN target", setup: "r = 1, γ = 0.99, target network Q(s′, ·; θ^{−}) = (2.0, 3.5, 3.0).", steps: ["target = 1 + 0.99 × 3.5 = 4.465", "online Q(s, a; θ) = 4.0, so the TD error is 0.465"], result: "The gradient step raises Q(s, a) towards **4.465**." }
 ]},
 { h: "Double DQN: the max is biased upwards", blocks: [
  { text: "The same noise both **selects** the best action and **evaluates** it: whichever action happens to be overestimated gets picked, and its overestimate enters the target. Three actions, all truly worth 0, each estimate with independent standard normal noise: every estimate is unbiased, yet the expected max is about **0.85** (about **1.54** for ten actions). Bootstrapping copies the bias into the next target, and the next." },
  { type: "reveal", q: "Predict: if you add more actions with the same true value, does the bias of the max grow, shrink or stay the same?", a: "It grows: the max of more noisy numbers is larger on average (0.85 for three, 1.54 for ten). Try it in Explore." },
  { type: "formula", label: "The Double DQN target", html: `<i>y</i> = <i>r</i> + γ <i>Q</i>( <i>s′</i>, arg max<sub><i>a′</i></sub> ${Q("<i>s′</i>, <i>a′</i>", th)}; ${thm} )`, where: [["θ", "the online network, which selects the next action"], [thm, "the target network, which evaluates it"]], note: "Noise in one network is unlikely to be the same noise in the other, so a lucky overestimate is less often both chosen and believed ([van Hasselt, Guez and Silver 2015](https://arxiv.org/abs/1509.06461))." },
  { type: "example", title: "Continuing the DQN example", setup: "Online network Q(s′, ·; θ) = (2.5, 3.0, 3.8); target network (2.0, 3.5, 3.0).", steps: ["online argmax: the third action", "target network values it at 3.0", "target = 1 + 0.99 × 3.0 = 3.97"], result: "**3.97** instead of 4.465." }
 ]},
 { h: "Dueling DQN: value plus advantage", blocks: [
  { type: "formula", label: "The dueling head", html: `<i>Q</i>(<i>s,a</i>) = <i>V</i>(<i>s</i>) + ( <i>A</i>(<i>s,a</i>) − ${FR('1', '|𝒜|')} ${SUM("<i>a′</i>")} <i>A</i>(<i>s,a′</i>) )`, where: [["<i>V</i>(<i>s</i>)", "state-value stream: is this state good at all"], ["<i>A</i>(<i>s,a</i>)", "advantage stream: which action is better"], ["|𝒜|", "number of actions"]], note: "Subtracting the mean advantage makes the split identifiable: otherwise a constant could move between V and A without changing Q. Every update improves V whichever action was taken, which helps where the action barely matters." },
  { type: "example", title: "Recombining", setup: "V = 5, A = (1, -1, 3).", steps: ["mean A = 1", "Q = 5 + (1 - 1, -1 - 1, 3 - 1)"], result: "Q = **(5, 3, 7)**." }
 ]},
 { h: "Rainbow: which fixes matter", blocks: [
  { text: "<a href=\"https://arxiv.org/abs/1710.02298\" target=\"_blank\" rel=\"noopener\">Rainbow (Hessel et al. 2017)</a> combined six extensions and reached state-of-the-art Atari performance in data efficiency and final score:" },
  { type: "table", head: ["Extension", "What it does"], rows: [
   ["Double Q-learning", "Online net selects, target net evaluates"],
   ["Dueling networks", "V plus mean-centred A"],
   ["Prioritised replay", "Replay transitions in proportion to their last TD error"],
   ["Multi-step returns", "n real rewards, then bootstrap: ∑_{k<n} γ^{k} r_{t+k+1} + γ^{n} max_{a′} Q(s_{t+n}, a′; θ^{−})"],
   ["Distributional (C51)", "Predict the return's distribution on 51 atoms (support -10 to 10)"],
   ["Noisy nets", "Learned noise on the weights instead of epsilon-greedy"] ] },
  { type: "callout", kind: "", title: "The ablation", text: "Removing one at a time: **prioritised replay and multi-step** were the two most crucial (large drop in median score), distributional next, noisy nets helpful in aggregate, and no significant aggregate difference from removing dueling or double Q-learning. The authors hypothesise double Q-learning mattered little because the -10 to 10 support itself clips values, counteracting overestimation." }
 ]},
 { h: "Policy gradients: optimise the policy directly", blocks: [
  { text: "Acting by argmax_{a} Q(s, a) is awkward for continuous actions (torques) and huge ones (100,000 tokens), and only gives deterministic policies. Instead parameterise π(a | s; θ) (a softmax, or a Gaussian over torques) and do gradient ascent on the expected return." },
  { type: "formula", label: "The objective", html: `<i>J</i>(θ) = ${E}<sub>τ ∼ π<sub>θ</sub></sub>[ <i>G</i>(τ) ]`, where: [["τ", "a trajectory (s_{0}, a_{0}, r_{1}, s_{1}, ...) sampled by running the policy"], ["<i>G</i>(τ)", "its (discounted) return"]] },
  { text: "θ changes which trajectories are sampled, and the dynamics are unknown. The **log-derivative trick** gets round it: ∇_{θ} 𝔼_{x∼p_{θ}}[f(x)] = 𝔼_{x∼p_{θ}}[f(x) ∇_{θ} log p_{θ}(x)], since ∇p = p ∇log p. The trajectory's log-probability is the policy's log-probabilities plus dynamics terms that do not depend on θ, so the dynamics drop out." },
  { type: "formula", label: "The policy gradient theorem (Sutton et al. 1999)", html: `∇<sub>θ</sub><i>J</i>(θ) = ${E}<sub>π<sub>θ</sub></sub>[ ${SUM("<i>t</i>")} ∇<sub>θ</sub> log π(${sub(I('a'), I('t'))} | ${sub(I('s'), I('t'))}; θ) · ${sub(I('Q'), 'π')}(${sub(I('s'), I('t'))}, ${sub(I('a'), I('t'))}) ]`, where: [["∇<sub>θ</sub> log π(<i>a<sub>t</sub></i> | <i>s<sub>t</sub></i>; θ)", "the score function: the weight direction that makes a_{t} more likely in s_{t}"], ["<i>Q</i><sub>π</sub>(<i>s<sub>t</sub></i>, <i>a<sub>t</sub></i>)", "expected return after taking a_{t}, then following π"]], note: "Push up the log-probability of each action in proportion to how good it turned out. Only samples and differentiable log-probabilities needed, never a model." }
 ]},
 { h: "REINFORCE and baselines", blocks: [
  { type: "formula", label: "REINFORCE (Williams 1992)", html: `∇<sub>θ</sub><i>J</i> ≈ ${SUM("<i>t</i>")} ∇<sub>θ</sub> log π(${sub(I('a'), I('t'))} | ${sub(I('s'), I('t'))}; θ) ${sub(I('G'), I('t'))}, &nbsp; ${sub(I('G'), I('t'))} = ${SUM("<i>k</i> ≥ 0")} γ<sup><i>k</i></sup> ${sub(I('r'), I('t') + '+' + I('k') + '+1')}`, where: [["<i>G<sub>t</sub></i>", "the sampled return from step t on (earlier rewards dropped: an action cannot affect the past)"]], note: "Unbiased but very high variance; with all-positive rewards every sampled action is pushed up, good ones merely more." },
  { type: "formula", label: "A state baseline changes nothing in expectation", html: `${E}<sub><i>a</i>∼π</sub>[ ∇<sub>θ</sub> log π(<i>a</i> | <i>s</i>) <i>b</i>(<i>s</i>) ] = <i>b</i>(<i>s</i>) ∇<sub>θ</sub> ${SUM("<i>a</i>")} π(<i>a</i> | <i>s</i>) = <i>b</i>(<i>s</i>) ∇<sub>θ</sub> 1 = 0`, where: [["<i>b</i>(<i>s</i>)", "any baseline depending on the state, not the action"]], note: "So G_{t} − b(s_{t}) is still unbiased, and can have far lower variance." },
  { type: "formula", label: "The advantage", html: `${sub(I('A'), 'π')}(<i>s,a</i>) = ${sub(I('Q'), 'π')}(<i>s,a</i>) − ${sub(I('V'), 'π')}(<i>s</i>)`, where: [["<i>V</i><sub>π</sub>(<i>s</i>)", "expected return from s under π: the natural baseline"]], note: "\"How much better than average was this action.\" The variance-minimising constant is in general a weighted mean of returns, not exactly V, but V is close and is what practice uses." },
  { type: "example", title: "Three actions, rewards 1, 2, 6 (illustrative)", setup: "Softmax with all logits 0: π = (1/3, 1/3, 1/3), V = 3. For a softmax, ∇ log π(a) with respect to the logits is e_{a} − π.", steps: ["exact gradient π_{k}(R_{k} − V) = (-0.667, -0.333, 1)", "sample action 1, no baseline: 1 × (2/3, -1/3, -1/3) = (0.667, -0.333, -0.333): **raises the worst action**", "same sample, baseline 3: (1 − 3) × (2/3, -1/3, -1/3) = (-1.333, 0.667, 0.667): lowers it", "sample action 3: (-2, -2, 4) without, (-1, -1, 2) with the baseline", "averaged over actions both give (-0.667, -0.333, 1)"], result: "Same mean; total variance falls from **7.56 to 1.56**. Here 3 is also the variance-minimising constant, because every score vector has the same length." },
  { text: "GRPO's group-mean baseline is exactly this, with V replaced by the mean reward of a group of responses to the same prompt." }
 ]},
 { h: "Actor-critic and GAE", blocks: [
  { text: "**Actor-critic** learns both at once: an **actor** π(a | s; θ) updated by the policy gradient, and a **critic** V(s; w) trained by TD learning to supply the advantage." },
  { type: "formula", label: "The TD error as an advantage estimate", html: `${sub('δ', I('t'))} = ${sub(I('r'), I('t') + '+1')} + γ <i>V</i>(${sub(I('s'), I('t') + '+1')}; <i>w</i>) − <i>V</i>(${sub(I('s'), I('t'))}; <i>w</i>)`, where: [["<i>r</i><sub><i>t</i>+1</sub>", "reward after acting in s_{t}"], ["<i>V</i>(<i>s</i><sub><i>t</i>+1</sub>; <i>w</i>)", "critic's value of the next state (0 if terminal)"]], note: "Its expectation is exactly A_{π}(s_{t}, a_{t}) when the critic is exact. Low variance, biased when the critic is wrong; return minus V is the unbiased, noisy end of the same dial." },
  { type: "formula", label: "Generalised advantage estimation (Schulman et al. 2015)", html: `${sub('<i>Â</i>', I('t'))} = ${SUM("<i>l</i>=0", "∞")} (γλ)<sup><i>l</i></sup> ${sub('δ', I('t') + '+' + I('l'))}`, where: [["δ<sub><i>t</i>+<i>l</i></sub>", "the TD error l steps later"], ["λ ∈ [0, 1]", "λ = 0: one-step TD error (low variance, most bias); λ = 1: discounted return minus V(s_{t}) (unbiased, noisiest)"]], note: "Analogous to TD(λ). PPO's reference settings: λ = 0.95, γ = 0.99." },
  { type: "example", title: "GAE on a three-step episode (γ = 1)", setup: "Rewards 0, 0, 1; V(s_{0}) = 0.5, V(s_{1}) = 0.6, V(s_{2}) = 0.8, terminal worth 0.", steps: ["δ_{0} = 0 + 0.6 − 0.5 = 0.1; δ_{1} = 0 + 0.8 − 0.6 = 0.2; δ_{2} = 1 + 0 − 0.8 = 0.2", "λ = 0: Â_{0} = 0.1", "λ = 0.95: 0.1 + 0.95 × 0.2 + 0.95^{2} × 0.2 = 0.4705", "λ = 1: 0.1 + 0.2 + 0.2 = 0.5 = return 1 − V(s_{0})"], result: "The advantage of the first action slides from **0.1 to 0.5** as λ goes from 0 to 1." },
  { type: "two", cols: [
   { title: "A3C (Mnih et al. 2016)", text: "Many actor-learners on CPU threads apply gradients to shared weights asynchronously. Parallel actors see different states at once: decorrelation like a replay buffer, while staying on-policy. State of the art on Atari on CPU alone." },
   { title: "A2C", text: "The synchronous version: wait for every actor, one batched update. OpenAI found it as good as A3C, with no evidence asynchrony helps, and better on GPUs. Modern LLM RL loops have this shape: a batch of rollouts, then an update." } ] }
 ]},
 { h: "TRPO to PPO: the clipped objective", blocks: [
  { text: "The policy gradient is only valid near the policy that collected the data. In supervised learning a too-large step costs one bad update; in RL the next batch comes from the broken policy, so the data itself degrades. The goal: the largest safe step, and several gradient steps on one expensive batch." },
  { type: "formula", label: "The importance ratio", html: `${ratio} = ${FR(`π<sub>θ</sub>(${sub(I('a'), I('t'))} | ${sub(I('s'), I('t'))})`, `π<sub>θ<sub>old</sub></sub>(${sub(I('a'), I('t'))} | ${sub(I('s'), I('t'))})`)}`, where: [["π<sub>θ<sub>old</sub></sub>", "the policy that collected the batch"], ["π<sub>θ</sub>", "the policy being optimised"]], note: "Maximising 𝔼_{t}[r_{t}(θ) Â_{t}] has the policy gradient's gradient at θ = θ_{old}; the ratio corrects for drift, an importance-sampling correction for a slightly stale policy." },
  { type: "formula", label: "TRPO (Schulman et al. 2015)", html: `max<sub>θ</sub> ${E}<sub><i>t</i></sub>[ ${ratio} ${Ahat} ] &nbsp; subject to &nbsp; ${E}<sub><i>t</i></sub>[ <i>D</i><sub>KL</sub>(π<sub>θ<sub>old</sub></sub>(· | ${sub(I('s'), I('t'))}) ‖ π<sub>θ</sub>(· | ${sub(I('s'), I('t'))})) ] ≤ δ`, where: [["<i>D</i><sub>KL</sub>", "Kullback-Leibler divergence between old and new action distributions, averaged over visited states"], ["δ", "the trust-region size"]], note: "Needs second-order machinery: the Fisher information matrix as curvature, a natural-gradient step by conjugate gradient, then a line search. Works, but heavy and hard to scale." },
  { type: "formula", label: "PPO's clipped objective (Schulman et al. 2017)", html: `<i>L</i><sup>CLIP</sup>(θ) = ${E}<sub><i>t</i></sub>[ min( ${ratio} ${Ahat}, clip(${ratio}, 1 − ε, 1 + ε) ${Ahat} ) ]`, where: [["clip(<i>x</i>, 1 − ε, 1 + ε)", "forces the ratio into that interval"], ["ε", "the clip range: 0.2 did best among 0.1, 0.2, 0.3 on continuous control; Atari runs started at 0.1, annealed towards 0"], ["<i>Â</i><sub><i>t</i></sub>", "the advantage estimate, GAE in practice"]] },
  { type: "list", items: [
   "**Good action (Â > 0)**: once r_{t} > 1 + ε the clipped term is smaller and constant: flat, zero gradient, no incentive to push further.",
   "**Bad action (Â < 0)**: once r_{t} < 1 − ε the objective goes flat the same way.",
   "**A ratio that moved the wrong way** is never clipped: the unclipped term is the smaller one, so the full gradient pulls it back. The clip stops exploitation, never the correction of a mistake." ] },
  { type: "table", head: ["Case (ε = 0.2)", "r Â", "clip(r) Â", "Objective", "Gradient"], num: [1, 2, 3], rows: [
   ["Â = +2, r = 1.5", "3.0", "1.2 × 2 = 2.4", "2.4", "zero: already raised past 1 + ε"],
   ["Â = +2, r = 0.7", "1.4", "0.8 × 2 = 1.6", "1.4", "active: push the good action back up"],
   ["Â = -1, r = 0.7", "-0.7", "0.8 × (-1) = -0.8", "-0.8", "zero: already lowered past 1 − ε"],
   ["Â = -1, r = 1.5", "-1.5", "1.2 × (-1) = -1.2", "-1.5", "active: push the bad action back down"] ] },
  { type: "widget", widget: { type: "custom", name: "ppoclip", title: "Where does the clip go flat?", intro: "Drag the ratio; flip the sign of the advantage. The solid line is PPO's objective, the dashed one the unclipped surrogate.", eps: 0.2, A: 2, r: 1.5, compact: true } },
  { text: "Result: TRPO-like stability from a first-order objective, so several epochs per batch are safe (10 on continuous control, 3 on Atari in the paper). A full PPO loss adds a value regression term and usually an entropy bonus, and much of its practical performance lives in implementation details (advantage normalisation, learning-rate annealing). This objective, ratios and clip included, is the core of RLHF with PPO and of GRPO." }
 ]},
 { h: "Off-policy continuous control: DDPG, TD3, SAC", blocks: [
  { text: "With continuous actions, max_{a′} Q(s′, a′) is itself an optimisation problem. These methods learn an actor that performs the max, and keep DQN's replay buffer and target networks to learn off-policy." },
  { type: "table", head: ["Method", "What it does", "What it fixes"], rows: [
   ["**DDPG** (Lillicrap et al. 2015)", "Deterministic actor μ(s; θ) climbs the critic's ∇_{a}Q; critic trained on r + γ Q(s′, μ(s′; θ^{−}); w^{−})", "Continuous actions; sample-efficient but brittle"],
   ["**TD3** (Fujimoto et al. 2018)", "Twin critics (min of two in the target), delayed policy updates, target policy smoothing (small clipped noise on the target action)", "Overestimation persists in actor-critic too"],
   ["**SAC** (Haarnoja et al. 2018)", "Stochastic actor under maximum-entropy RL", "Exploration and robustness across seeds"] ] },
  { type: "formula", label: "The maximum-entropy objective", html: `<i>J</i>(π) = ${SUM("<i>t</i>")} ${E}[ <i>r</i>(${sub(I('s'), I('t'))}, ${sub(I('a'), I('t'))}) + α ℋ(π(· | ${sub(I('s'), I('t'))})) ], &nbsp; ℋ(π(· | <i>s</i>)) = −${SUM("<i>a</i>")} π(<i>a</i> | <i>s</i>) log π(<i>a</i> | <i>s</i>)`, where: [["ℋ", "entropy of the action distribution (an integral for continuous actions)"], ["α", "temperature: how much randomness is worth relative to reward"]], note: "An even split between two actions has entropy ln 2 ≈ 0.693, worth 0.2 × 0.693 ≈ 0.139 reward per step at α = 0.2; a deterministic policy earns nothing. A common off-policy default for continuous control and robotics; the same idea returns in LLM RL as KL and entropy terms that stop mode collapse." }
 ]},
 { h: "The model-based line: AlphaGo to MuZero", blocks: [
  { text: "These methods plan with **Monte Carlo tree search (MCTS)**: walk down a tree of futures choosing moves that balance a high value estimate against a high prior and a low visit count, expand a leaf, evaluate it with a network, back the value up. After a fixed number of simulations the root **visit counts** are an improved policy: search is a policy-improvement operator, as in policy iteration on <a href=\"" + DP + "\" target=\"_blank\" rel=\"noopener\">Dynamic programming</a>." },
  { type: "list", items: [
   "**AlphaGo** (2016): policy network by supervised learning on human games, then RL self-play; a value network predicting outcomes; MCTS using the known rules of Go as a perfect model, with both networks guiding and cutting the search.",
   "**AlphaZero** (2017): no human data. One network f_{θ}(s) = (**p**, v) trained on self-play: MCTS visit distribution as policy target, game result as value target. From random play, superhuman in chess, shogi and Go within 24 hours, defeating a world-champion program in each." ] },
  { type: "formula", label: "The AlphaZero loss", html: `ℓ = (<i>z</i> − <i>v</i>)<sup>2</sup> − <b>π</b><sup>⊤</sup> log <b>p</b> + <i>c</i>‖θ‖<sup>2</sup>`, where: [["<i>z</i> ∈ {−1, 0, +1}", "game outcome from the player's point of view"], ["<i>v</i>", "predicted value"], ["<b>π</b>", "MCTS visit distribution"], ["<b>p</b>", "the network's move probabilities"], ["<i>c</i>", "weight-decay coefficient"]] },
  { type: "example", title: "One AlphaZero loss", setup: "z = 1 (the player won), v = 0.6; search visits (0.7, 0.2, 0.1); network gives (0.5, 0.3, 0.2).", steps: ["value term (1 − 0.6)^{2} = 0.16", "policy term −(0.7 ln 0.5 + 0.2 ln 0.3 + 0.1 ln 0.2) ≈ 0.887"], result: "Loss before weight decay ≈ **1.047**; the gradient moves **p** towards what search found. Search improves, the network distils, a better network makes search stronger." },
  { type: "svg", svg: WIDE(muzeroSvg, 640), width: 720, caption: "MuZero: h encodes observations, g steps the hidden state and predicts reward, f predicts policy and value. MCTS runs on these hidden states." },
  { text: "**MuZero** (2019) drops the known rules. Representation s^{0} = h_{θ}(o_{1}, ..., o_{t}); dynamics (r^{k}, s^{k}) = g_{θ}(s^{k−1}, a^{k}); prediction (**p**^{k}, v^{k}) = f_{θ}(s^{k}). Trained end to end by unrolling K = 5 steps along a real trajectory and matching predicted rewards, values and policies to observed rewards, search values and MCTS visit distributions. The hidden state is never trained to reconstruct the observation. 800 simulations per search in board games, 50 in Atari. Without the rules it matched AlphaZero in Go, chess and shogi and set a new state of the art on 57 Atari games, where model-based planning had historically struggled." },
  { type: "callout", kind: "key", title: "Why it matters for LLMs", text: "The ancestry of search plus a learned value at test time: long chain-of-thought in o1 and DeepSeek-R1-style models reads as sequential search in token space, and MCTS-guided decoding applies AlphaZero's recipe to generation directly." }
 ]},
 { h: "Map back to the taxonomy", blocks: [
  { text: "The three axes of <a href=\"" + RLF + "\" target=\"_blank\" rel=\"noopener\">RL foundations</a>: what the agent stores, whether it uses a model, whose data it learns from. The full table is filterable in Explore." },
  { type: "table", head: ["Method", "Stores", "Model", "Data"], rows: [
   ["DQN family", "Value (Q)", "Model-free", "Off-policy"], ["REINFORCE", "Policy", "Model-free", "On-policy"], ["A2C, A3C", "Actor-critic", "Model-free", "On-policy"],
   ["TRPO, PPO", "Actor-critic", "Model-free", "Approximately on-policy"], ["DDPG, TD3, SAC", "Actor-critic", "Model-free", "Off-policy"],
   ["AlphaGo, AlphaZero", "Actor-critic", "Given model", "Self-play"], ["MuZero", "Actor-critic + learned model", "Learned latent model", "Self-play and replay"] ] }
 ]},
 { h: "Trade-offs and when to use which", blocks: [
  { type: "list", items: [
   "**Discrete actions, data precious**: the DQN family. Replay buys sample efficiency and data reuse; the price is exposure to the deadly triad and no natural continuous actions.",
   "**Any action space, stability first**: PPO. Simple and robust; costs data, since each batch is used for a few epochs and discarded.",
   "**Continuous control, samples expensive**: SAC or TD3. Off-policy efficiency; more moving parts (twin critics, target networks, a temperature).",
   "**Known model, combinatorial search**: AlphaZero-style search plus learned policy and value. No model but a need to plan: MuZero, at large compute per decision.",
   "**The bias-variance dial runs through it all**: Monte Carlo returns (λ = 1) unbiased and noisy, TD targets and critics (λ = 0) stable and biased, GAE and n-step returns in between.",
   "**LLM post-training**: PPO with a value model, or GRPO, which deletes the critic for a group-mean baseline ([RL for LLMs](" + LLM + "))." ] }
 ]},
 { h: "Common mistakes and misconceptions", blocks: [
  { type: "list", items: [
   "**\"DQN had replay and a target network from the start.\"** The 2013 version had replay; the target network came with the 2015 Nature version.",
   "**\"Overestimation needs biased estimates.\"** Each estimate can be unbiased; their max is still biased upwards.",
   "**\"A baseline biases the gradient.\"** Not if it depends only on the state; an action-dependent one would.",
   "**\"PPO's clip bounds the ratio.\"** It bounds only the incentive. The ratio can leave [1 − ε, 1 + ε] over several epochs, and a wrong-way move's gradient is never clipped: watch the clip fraction and the KL to the old policy.",
   "**\"PPO is on-policy, so it cannot reuse data.\"** It reuses each batch for several epochs; the ratio corrects the drift.",
   "**\"Off-policy means offline.\"** DQN and SAC interact online and learn off-policy from replay.",
   "**\"MuZero learns a model of the environment.\"** It learns what planning needs: rewards, values, policies. Its hidden state never reproduces observations.",
   "**\"Entropy bonuses are a hack.\"** In SAC the entropy is part of the objective, with a principled temperature." ] }
 ]},
 { h: "How it connects", blocks: [
  { type: "list", items: [
   "[Topic: rl](" + TOPIC + "): the map from the vocabulary through the classical methods and this page to RL for LLMs.",

takeaways: [
 "Networks generalise across states, and that is what makes RL unstable: correlated data, moving targets, policy-dependent data. The deadly triad is function approximation + bootstrapping + off-policy.",
 "DQN = Q-learning + experience replay (decorrelate, reuse) + a target network (freeze the target). Double DQN separates selecting from evaluating because the max of noisy estimates is biased upwards.",
 "The policy gradient pushes up log π(a | s) in proportion to how good a turned out; subtracting a state baseline keeps it unbiased and cuts variance; with V as the baseline the weight is the advantage.",
 "Actor-critic learns the baseline; GAE's λ slides the advantage estimate from TD error (λ = 0) to Monte Carlo (λ = 1).",
 "PPO's min-of-clipped objective goes flat once the ratio has moved ε in the direction the advantage wants, but never blocks the correction of a wrong-way move.",
 "SAC adds entropy to the objective; TD3 fights overestimation with twin critics.",
 "AlphaZero: MCTS improves the policy, the network distils it. MuZero plans the same way inside a learned latent model that predicts only what planning needs."
],
glossary: [
 { term: "DQN", def: "Deep Q-network: Q-learning with a network, stabilised by experience replay and a target network." },
 { term: "Experience replay", def: "A buffer of past transitions sampled at random for training; breaks correlation and reuses data; needs an off-policy learner." },
 { term: "Target network", def: "A frozen copy θ^{−} of the Q-network used to compute TD targets, refreshed every C updates." },
 { term: "Overestimation bias", def: "The max over noisy value estimates is biased upwards even when each estimate is unbiased." },
 { term: "Double DQN", def: "Online network selects the next action, target network evaluates it." },
 { term: "Dueling network", def: "Q = V + (A − mean A): separate state-value and advantage streams." },
 { term: "Rainbow", def: "DQN plus six extensions; prioritised replay and multi-step mattered most in its ablation." },
 { term: "Deadly triad", def: "Function approximation, bootstrapping and off-policy data together can diverge." },
 { term: "Policy gradient theorem", def: "∇J = 𝔼[∑_{t} ∇ log π(a_{t} | s_{t}) Q_{π}(s_{t}, a_{t})]; no model needed." },
 { term: "Score function", def: "∇_{θ} log π(a | s; θ): the weight direction that makes a more likely." },
 { term: "REINFORCE", def: "Monte Carlo policy gradient with the sampled return G_{t}; unbiased, high variance." },
 { term: "Baseline", def: "A state-dependent b(s) subtracted from the return; keeps the gradient unbiased, cuts variance." },
 { term: "Advantage", def: "A(s, a) = Q(s, a) − V(s): how much better than average the action was." },
 { term: "Actor-critic", def: "An actor (policy) trained by policy gradient and a critic (value) trained by TD to supply advantages." },
 { term: "TD error", def: "δ_{t} = r_{t+1} + γ V(s_{t+1}) − V(s_{t}); a one-step advantage estimate." },
 { term: "GAE", def: "Generalised advantage estimation: ∑_{l} (γλ)^{l} δ_{t+l}; λ trades bias against variance." },
 { term: "A3C / A2C", def: "Asynchronous and synchronous advantage actor-critic with parallel actors." },
 { term: "Importance ratio", def: "r_{t}(θ) = π_{θ}(a_{t} | s_{t}) / π_{θ_{old}}(a_{t} | s_{t})." },
 { term: "TRPO", def: "Trust region policy optimisation: maximise the surrogate under a KL constraint; second-order." },
 { term: "PPO", def: "Proximal policy optimisation: the clipped surrogate, first-order, several epochs per batch." },
 { term: "DDPG / TD3", def: "Deterministic actor-critic for continuous actions; TD3 adds twin critics, delayed updates, target smoothing." },
 { term: "SAC", def: "Soft actor-critic: off-policy maximum-entropy RL with temperature α." },
 { term: "MCTS", def: "Monte Carlo tree search: simulations down a tree guided by prior, value and visit counts; root visits give an improved policy." },
 { term: "AlphaZero", def: "Self-play policy iteration with MCTS as the improvement operator and one policy-value network." },
 { term: "MuZero", def: "AlphaZero's search inside a learned latent model: representation h, dynamics g, prediction f." }
],

<script>
/* ===== PAGE CUSTOM WIDGETS (optional): CUSTOM.name = (el, props, K) => { ... }; reads its numbers from props or DATA ===== */
const CUSTOM = {};
/* Custom widgets for "Deep RL: from DQN to PPO to MuZero".
   ppoclip:  PPO's clipped objective against the ratio, with both terms of the min and the gradient status.
   overest:  the upward bias of the max over noisy estimates (DQN) against the double estimator, exact and sampled.
   baseline: the page's three-action policy gradient; mean unchanged by the baseline, variance computed exactly.
   gae:      the page's three-step episode; TD errors and GAE advantages as lambda and gamma move. */

const DRL = {
  num(K, v, d) { if (!isFinite(v)) return String(v); const s = K.fmt(Math.abs(v) < 5e-13 ? 0 : v, d); return s.replace(/^-/, '−'); },
  fixed(v, d) { const s = (Math.abs(v) < 5e-13 ? 0 : v).toFixed(d); return s.replace(/^-/, '−'); },
  par(v, d) { const s = DRL.fixed(v, d); return v < 0 ? '(' + s + ')' : s; },
  rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  normal(r) { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); },
  // expected maximum of n independent standard normals, by numerical integration of x n phi(x) Phi(x)^(n-1)
  emax(n) {
    if (n <= 1) return 0; const erf = x => { const t = 1 / (1 + 0.3275911 * Math.abs(x)); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; };
    let s = 0; const N = 4000, lo = -8, hi = 8, h = (hi - lo) / N;
    for (let i = 0; i < N; i++) { const x = lo + (i + 0.5) * h; const pdf = Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI); const cdf = 0.5 * (1 + erf(x / Math.SQRT2)); s += x * n * pdf * Math.pow(cdf, n - 1) * h; }
    return s;
  },
  panel(K) { return K.h('div', { class: 'small', style: 'margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);line-height:1.7' }); },
  table(K, head, rows, numFrom) {
    const t = K.h('table', { style: 'border-collapse:collapse;font-size:13px;width:100%' });
    const tr = K.h('tr'); head.forEach((x, i) => tr.append(K.h('th', { style: `text-align:${i >= numFrom ? 'right' : 'left'};padding:3px 8px;border-bottom:1px solid var(--line);font-weight:600`, html: x }))); t.append(tr);
    rows.forEach(r => { const row = K.h('tr'); r.forEach((x, i) => row.append(K.h('td', { style: `text-align:${i >= numFrom ? 'right' : 'left'};padding:3px 8px;border-bottom:1px solid var(--line)`, html: x }))); t.append(row); });
    return K.h('div', { style: 'overflow-x:auto' }, t);
  }
};

// ---------- PPO's clipped objective ----------
CUSTOM.ppoclip = (el, o, K) => {
  let eps = o.eps, A = o.A, r = o.r;
  const ctls = K.h('div', { class: 'ctls' });
  const sR = K.slider({ label: 'probability ratio r = π<sub>θ</sub> / π<sub>old</sub>', min: 0.3, max: 1.9, step: 0.05, value: r, fmt: v => v.toFixed(2), onInput: v => { r = v; draw(); } });
  const sA = K.slider({ label: 'advantage Â', min: -2, max: 2, step: 0.5, value: A, fmt: v => DRL.fixed(v, 1), onInput: v => { A = v; draw(); } });
  const sE = K.slider({ label: 'clip range ε', min: 0.05, max: 0.5, step: 0.05, value: eps, fmt: v => v.toFixed(2), onInput: v => { eps = v; draw(); } });
  ctls.append(sR, sA); if (!o.compact) ctls.append(sE);
  const quick = K.h('div', { class: 'bar', style: 'margin:4px 0 6px;flex-wrap:wrap' });
  [['good action, pushed past 1 + ε', 2, 1.5], ['good action, moved the wrong way', 2, 0.7], ['bad action, pushed past 1 − ε', -1, 0.7], ['bad action, moved the wrong way', -1, 1.5]].forEach(([l, a, rr]) => quick.append(K.h('button', { onclick: () => { A = a; r = rr; sA.set(a); sR.set(rr); draw(); } }, l)));
  const chartBox = K.h('div', { style: 'margin-top:6px' }); const out = DRL.panel(K);
  el.append(ctls, quick, chartBox, out);
  const clip = x => Math.max(1 - eps, Math.min(1 + eps, x));
  const L = x => Math.min(x * A, clip(x) * A);
  let chart = null;
  function draw() {
    const pts = [...Array(81)].map((_, i) => 0.3 + 1.6 * i / 80);
    const series = [{ name: 'PPO objective min(rÂ, clip(r)Â)', points: pts.map(x => [x, L(x)]) }, { name: 'unclipped surrogate rÂ', points: pts.map(x => [x, x * A]), dash: '5 4' }];
    const marks = [{ x: 1 - eps, label: '1 − ε' }, { x: 1 + eps, label: '1 + ε' }, { x: r, label: 'r' }];
    if (!chart) chart = K.lineChart(chartBox, { series, marks, xlabel: 'probability ratio r', ylabel: 'objective for this action', xfmt: v => v.toFixed(1), height: 230 });
    else { chart.opts.marks = marks; chart.set(series); }

// ---------- overestimation: max against the double estimator ----------
CUSTOM.overest = (el, o, K) => {

  const ctls = K.h('div', { class: 'ctls' });

  ctls.append(K.slider({ label: 'noise standard deviation σ', min: 0, max: 2, step: 0.1, value: sigma, fmt: v => v.toFixed(1), onInput: v => { sigma = v; draws = []; last = null; draw(); } }));

  const chartBox = K.h('div'); const out = DRL.panel(K); const tbl = K.h('div', { style: 'margin-top:8px' });
  el.append(ctls, bar, chartBox, out, tbl);
  let last = null, chart = null;
  function sample(k) {
    for (let j = 0; j < k; j++) {
      const on = [...Array(n)].map(() => sigma * DRL.normal(rng)), tg = [...Array(n)].map(() => sigma * DRL.normal(rng));

    const marks = [{ x: n, label: 'now' }];
    if (!chart) chart = K.lineChart(chartBox, { series, marks, xlabel: 'number of actions (all truly worth 0)', ylabel: 'expected bias of the target', xfmt: v => K.fmt(v, 0), height: 220 });
    else { chart.opts.marks = marks; chart.set(series); }
    const eb = sigma * DRL.emax(n);
    let txt = `Expected bias of the max with ${n} action${n > 1 ? 's' : ''} and σ = ${sigma.toFixed(1)}: <b>${DRL.fixed(eb, 3)}</b> (true value 0). The double estimator's expected bias is <b>0</b>: the target network's noise is independent of which action the online network chose.`;
    if (draws.length) { const m1 = draws.reduce((s, d) => s + d[0], 0) / draws.length, m2 = draws.reduce((s, d) => s + d[1], 0) / draws.length; txt += `<br>Average over your ${draws.length} sample${draws.length > 1 ? 's' : ''}: max <b>${DRL.fixed(m1, 3)}</b>, double <b>${DRL.fixed(m2, 3)}</b>.`; }

    tbl.innerHTML = '';

      const rows = last.on.map((v, i) => [`action ${i + 1}${i === last.best ? ' (online argmax)' : ''}`, '0', DRL.fixed(v, 2), DRL.fixed(last.tg[i], 2)]);
      tbl.append(K.h('div', { class: 'small mute', html: `Last sample: DQN's target uses the max of the target column, <b>${DRL.fixed(last.single, 2)}</b>; Double DQN evaluates the online argmax in the target column, <b>${DRL.fixed(last.dbl, 2)}</b>.` }), DRL.table(K, ['', 'true value', 'online estimate', 'target estimate'], rows, 1));
    }

};

// ---------- the baseline: same mean, different variance ----------
CUSTOM.baseline = (el, o, K) => {
  const R = o.rewards, n = R.length; let b = o.b, l3 = o.logit3;
  const ctls = K.h('div', { class: 'ctls' });
  const sb = K.slider({ label: 'baseline b', min: -2, max: 8, step: 0.1, value: b, fmt: v => DRL.fixed(v, 1), onInput: v => { b = v; draw(); } });
  ctls.append(sb, K.slider({ label: 'logit of action 3 (others 0)', min: -2, max: 2, step: 0.1, value: l3, fmt: v => DRL.fixed(v, 1), onInput: v => { l3 = v; draw(); } }));
  const bar = K.h('div', { class: 'bar', style: 'margin:4px 0' });
  bar.append(K.h('button', { onclick: () => { b = 0; sb.set(0); draw(); } }, 'no baseline'), K.h('button', { onclick: () => { const v = Math.round(stats().V * 10) / 10; b = v; sb.set(v); draw(); } }, 'b = V (rounded)'));
  const tbl = K.h('div'); const out = DRL.panel(K); const chartBox = K.h('div', { style: 'margin-top:8px' });
  el.append(ctls, bar, tbl, out, chartBox);
  let chart = null;
  const stats = () => {
    const z = [0, 0, l3], mx = Math.max(...z), e = z.map(x => Math.exp(x - mx)), S = e.reduce((a, c) => a + c, 0), pi = e.map(x => x / S);

    const score = a => pi.map((p, k) => (k === a ? 1 : 0) - p);
    const est = bb => [...Array(n)].map((_, a) => score(a).map(x => (R[a] - bb) * x));
    const mean = [...Array(n)].map((_, k) => pi[k] * (R[k] - V));
    const vr = bb => { const g = est(bb); return g.reduce((s, ga, a) => s + pi[a] * ga.reduce((t, x, k) => t + (x - mean[k]) ** 2, 0), 0); };
    const w = [...Array(n)].map((_, a) => pi[a] * score(a).reduce((t, x) => t + x * x, 0));
    const bstar = w.reduce((s, x, a) => s + x * R[a], 0) / w.reduce((s, x) => s + x, 0);
    return { pi, V, est, mean, vr, bstar };
  };
  const vec = v => '(' + v.map(x => DRL.fixed(x, 3)).join(', ') + ')';
  function draw() {
    const st = stats(); const g = st.est(b);
    tbl.innerHTML = '';
    tbl.append(DRL.table(K, ['action', 'π(a)', 'reward', '(R − b) × (e<sub>a</sub> − π): the estimate if a is sampled'], R.map((r, a) => [String(a + 1), st.pi[a].toFixed(3), String(r), `(${r} − ${DRL.par(b, 1)}) × ${vec(st.pi.map((p, k) => (k === a ? 1 : 0) - p))} = <b>${vec(g[a])}</b>`]), 1));
    const avg = [...Array(n)].map((_, k) => g.reduce((s, ga, a) => s + st.pi[a] * ga[k], 0));
    out.innerHTML = `V = ∑ π(a) R(a) = <b>${DRL.fixed(st.V, 3)}</b>. Mean of the estimates, weighted by π: <b>${vec(avg)}</b>, equal to the exact gradient π<sub>k</sub>(R<sub>k</sub> − V) = ${vec(st.mean)} for every b.<br>Total variance at b = ${DRL.fixed(b, 1)}: <b>${DRL.fixed(st.vr(b), 3)}</b>; at b = 0: ${DRL.fixed(st.vr(0), 3)}; smallest possible, at b<sup>∗</sup> = ${DRL.fixed(st.bstar, 3)}: ${DRL.fixed(st.vr(st.bstar), 3)}.` + (Math.abs(st.bstar - st.V) > 0.005 ? ` With an uneven policy b<sup>∗</sup> differs from V, but V is close.` : ` With a uniform policy every score vector has the same length, so b<sup>∗</sup> = V exactly.`);
    const series = [{ name: 'total variance of the estimate', points: [...Array(51)].map((_, i) => { const x = -2 + 10 * i / 50; return [x, st.vr(x)]; }) }];
    const marks = [{ x: b, label: 'b' }, { x: st.V, label: 'V' }];
    if (!chart) chart = K.lineChart(chartBox, { series, marks, xlabel: 'baseline b', ylabel: 'variance', xfmt: v => K.fmt(v, 1), height: 200 });
    else { chart.opts.marks = marks; chart.set(series); }
  }
  draw();
};

// ---------- GAE on the page's three-step episode ----------
CUSTOM.gae = (el, o, K) => {
