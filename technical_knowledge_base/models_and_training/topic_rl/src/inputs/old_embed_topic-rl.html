 { h: "Taxonomy: three independent axes", blocks: [
  { text: "Every agent sits somewhere on each of three axes, and the axes are independent of each other." },
  { type: "table", head: ["Axis", "Options", "Methods"], rows: [
   ["**What the agent stores**", "Value-based: V or Q, policy implicit (act greedily)", "value iteration, SARSA, Q-learning, DQN"],
   ["", "Policy-based: the policy π(a | s) itself", "REINFORCE, GRPO (a group's mean reward replaces the critic)"],
   ["", "Actor-critic: both", "A2C/A3C, TRPO, PPO, DDPG, SAC, AlphaZero, MuZero"],
   ["**Does it model the environment?**", "Model-free: learn from experience only", "MC, TD, SARSA, Q-learning, DQN, REINFORCE, PPO, SAC, GRPO"],
   ["", "Model-based: plan with a known or learned model", "dynamic programming (given), AlphaZero (known rules), MuZero (learned model)"],
   ["**Whose experience does it learn from?**", "On-policy: about π from π's own data", "SARSA, REINFORCE, A2C, PPO*, GRPO*"],
   ["", "Off-policy: about π from other data", "Q-learning, DQN, DDPG, SAC"]] },
  { type: "p", text: "*PPO and GRPO are **nearly** on-policy: importance ratios correct the small staleness of the batch they learn from." },
  { type: "two", cols: [
   { title: "Stores", text: "A **value function** is V(s), the expected return from a state, or Q(s, a), from a state after a given action. An **actor-critic**'s value function (the critic) judges the policy's actions (the actor) and lowers the variance of its updates." },
   { title: "Model", text: "A **model** predicts the next state and reward. It can be given (dynamic programming, the rules of the game in AlphaZero) or learned (MuZero). The reward model in RLHF does **not** make it model-based: nothing plans with it." }] },
  { type: "p", text: "**Off-policy** methods learn about a target policy, usually the greedy one, from data generated by a different behaviour policy, which is what lets them reuse old experience from a replay buffer. Dynamic programming sits outside this axis: it computes from the model and uses no experience at all." },
  { type: "callout", title: "Examples", text: "DQN: value-based, model-free, off-policy. PPO: actor-critic, model-free, approximately on-policy. GRPO: policy-based, model-free, approximately on-policy. AlphaZero: model-based, with policy and value networks trained on its own self-play games." }
 ]},
 { h: "The through-line: one target, many estimators", blocks: [
  { text: "Every method estimates the same quantity, the **expected return**, and improves behaviour against that estimate. The Bellman expectation equation says what the quantity satisfies:" },
  { type: "formula", label: "Bellman expectation equation", html: `${Vpi}(${I('s')}) = ${E}<sub>π</sub>[ ${Rt1} + γ ${Vpi}(${St1}) | ${St} = ${I('s')} ]`, where: [
   [`${Vpi}(${I('s')})`, 'expected return from state s when following policy π'],
   [Rt1, 'the reward received after the action taken at time t'],
   [St1, 'the state that action leads to'],
   ['γ ∈ [0, 1]', 'the discount factor: a reward k steps ahead is weighted by γ<sup>k</sup>'],
   [`${E}<sub>π</sub>`, 'average over the actions π chooses and the next states the environment produces']] },
  { type: "formula", label: "One incremental update, for every value-learning method", html: `${I('V')}(${St}) ← ${I('V')}(${St}) + α ( target − ${I('V')}(${St}) )`, where: [
   [`${I('V')}(${St})`, 'the current estimate'], ['α ∈ (0, 1]', 'the step size'], ['target', 'a stand-in for the expectation in the Bellman equation']] },
  { type: "formula", label: "The policy gradient uses the same stand-ins as its weight", html: `∇<sub>θ</sub>${I('J')}(θ) = ${E}<sub>π<sub>θ</sub></sub>[ ${SUM(I('t'))} ∇<sub>θ</sub> log π<sub>θ</sub>(${At} | ${St}) · Â<sub>${I('t')}</sub> ]`, where: [
   [`${I('J')}(θ)`, 'expected return of the policy π<sub>θ</sub> with parameters θ'],
   [`∇<sub>θ</sub> log π<sub>θ</sub>(${At} | ${St})`, 'the direction in parameter space that makes the action actually taken more likely'],
   [`Â<sub>${I('t')}</sub>`, 'how good that action turned out: the return itself, or the return minus a baseline (an <b>advantage</b>)']],
   note: "Raising the log-probability of actions in proportion to Â_{t} is the whole of policy-gradient RL." },
  { type: "h3", text: "What each method uses for the target" },
  { type: "table", head: ["Method", "What stands in for the expectation", "Needs", "Bias and variance"], rows: [
   ["Dynamic programming", "The exact expectation over the model: ∑_{s′} P(s′ | s, a) [R(s, a) + γ V(s′)], averaged over the policy's actions", "P and R", "Exact, no sampling noise"],
   ["Monte Carlo", "The full sampled return G_{t} = R_{t+1} + γ R_{t+2} + γ² R_{t+3} + ... to the end", "Episodes that end", "Unbiased, high variance"],
   ["TD(0), SARSA, Q-learning", "One sampled step plus the estimate: R_{t+1} + γ V(S_{t+1}); SARSA uses Q(S_{t+1}, A_{t+1}), Q-learning max_{a′} Q(S_{t+1}, a′)", "Single transitions", "Biased by the estimate, low variance"],
   ["n-step, TD(λ), GAE", "A weighted average of targets using n real rewards before the estimate", "n or λ", "A dial between TD(0) and Monte Carlo"],
   ["DQN", "The Q-learning target, computed by a frozen copy of the network", "Replay buffer, target network", "As Q-learning, plus approximation error"],
   ["REINFORCE", "The sampled return G_{t} as the weight Â_{t}, optionally minus a baseline", "Episodes that end", "Unbiased, high variance"],
   ["Actor-critic, PPO", "An advantage from a learned critic: the TD error δ_{t} = R_{t+1} + γ V(S_{t+1}) − V(S_{t}), or GAE's λ-weighted sum of TD errors", "A critic network", "Lower variance, biased by the critic"],
   ["GRPO", "The response's reward minus the group mean for the same prompt, divided by the group's standard deviation", "Several responses per prompt", "Monte Carlo with a sampled baseline, no critic"],
   ["RLVR", "Any of the above, with the reward from a programmatic verifier (unit tests, an answer checker)", "Checkable answers", "Removes reward-model error; checkable tasks only"],
   ["AlphaZero, MuZero", "A tree search: its improved move distribution is the policy target, the observed outcome or return the value target", "Known rules or a learned model", "Better than the raw networks, at a large compute cost per move"]] },
  { type: "formula", label: "n-step return and λ-return", html: `${sub(I('G'), I('t'))}<sup>(${I('n')})</sup> = ${Rt1} + γ${sub(I('R'), I('t')+'+2')} + ... + γ<sup>${I('n')}−1</sup>${sub(I('R'), I('t')+'+'+I('n'))} + γ<sup>${I('n')}</sup>${I('V')}(${sub(I('S'), I('t')+'+'+I('n'))})<br>${sub(I('G'), I('t'))}<sup>λ</sup> = (1 − λ) ${SUM(I('n')+' = 1', '∞')} λ<sup>${I('n')}−1</sup> ${sub(I('G'), I('t'))}<sup>(${I('n')})</sup>`, where: [
   [`${sub(I('G'), I('t'))}<sup>(${I('n')})</sup>`, 'the n-step return: n real rewards, then the estimate of the state reached (past the end of the episode it is just the full return)'],
   ['λ ∈ [0, 1]', 'how fast the weights decay with n: λ = 0 leaves only the TD(0) target, λ = 1 only the Monte Carlo return'],
   ['finite episode', 'ending at time T, the weights are (1 − λ)λ<sup>n−1</sup> for n = 1 to T − t − 1, and the remaining λ<sup>T−t−1</sup> falls on the full return']] },
  { type: "callout", kind: "key", title: "Why there is a dial", text: "A target built from real rewards is **unbiased** but carries every step's randomness; a target that stops after one step and trusts the estimate carries only one step's randomness but **inherits the estimate's error**. Short targets win when the estimate is good, long ones when it is poor. The same trade appears on every layer: TD(λ) with tables, GAE's λ in PPO, and GRPO, which takes the pure Monte Carlo end with a sampled baseline because a per-token critic for a language model is as large as the policy and hard to fit from a single end-of-sequence reward." },
  { type: "reveal", q: "A critic that is badly wrong: should λ go up or down?", a: "Up. A larger λ puts more weight on real rewards and less on the wrong estimate, trading the critic's bias for more variance. With a perfect critic, λ = 0 is best, because it adds no bias and the least randomness. The Explore tab's dial lets you watch both cases." },
  { type: "h3", text: "Worked example: one episode, every target" },
  { type: "svg", svg: targetsSvg, caption: "The same state, three targets: each one uses more real rewards before trusting an estimate.", minWidth: 600 },
  { type: "example", title: "Targets for S₀ (illustrative numbers)", setup: "Episode S₀ → S₁ → S₂ → end; γ = 0.9; rewards R₁ = 0, R₂ = 0, R₃ = 1; estimates V(S₀) = 0.2, V(S₁) = 0.4, V(S₂) = 0.7; step size α = 0.1.", steps: [
   "**Monte Carlo**: G₀ = 0 + 0.9 × 0 + 0.9² × 1 = 0.81; update 0.2 + 0.1 × (0.81 − 0.2) = 0.261",
   "**TD(0)**: R₁ + γ V(S₁) = 0 + 0.9 × 0.4 = 0.36; update 0.2 + 0.1 × (0.36 − 0.2) = 0.216",
   "**Two-step**: R₁ + γ R₂ + γ² V(S₂) = 0 + 0 + 0.81 × 0.7 = 0.567",
   "**λ-return at λ = 0.5**: 0.5 × 0.36 + 0.25 × 0.567 + 0.25 × 0.81 = 0.52425",
   "**Dynamic programming**, if the model said S₁ with probability 0.8 and the end (reward 0) with 0.2: 0.8 × (0 + 0.9 × 0.4) + 0.2 × 0 = 0.288, the expectation with no sample",
   "**Policy-gradient weights**: REINFORCE with V(S₀) as baseline, G₀ − V(S₀) = 0.81 − 0.2 = 0.61; an actor-critic's TD error δ₀ = 0.36 − 0.2 = 0.16"],
   result: "One episode gives targets from **0.36 to 0.81** for the same state, depending only on how many real rewards each method uses before it trusts its own estimates." },
  { type: "widget", widget: { type: "calc", title: "Recompute the example", intro: "The page's episode with R₁ = R₂ = 0 and V(S₀) = 0.2; move the inputs and the page's formulas recompute every target.", inputs: [
    { id: "g", label: "discount γ", min: 0, max: 1, step: 0.05, value: 0.9, fmt: v => v.toFixed(2) },
    { id: "l", label: "λ", min: 0, max: 1, step: 0.05, value: 0.5, fmt: v => v.toFixed(2) },
    { id: "r3", label: "final reward R₃", min: -1, max: 2, step: 0.1, value: 1, fmt: v => v.toFixed(1) },
    { id: "v1", label: "estimate V(S₁)", min: -1, max: 2, step: 0.1, value: 0.4, fmt: v => v.toFixed(1) },
    { id: "v2", label: "estimate V(S₂)", min: -1, max: 2, step: 0.1, value: 0.7, fmt: v => v.toFixed(1) }],
   outputs: [
    { label: "Monte Carlo target G₀ = γ² R₃", f: v => v.g * v.g * v.r3, fmt: f5 },
    { label: "TD(0) target γ V(S₁)", f: v => v.g * v.v1, fmt: f5 },
    { label: "two-step target γ² V(S₂)", f: v => v.g * v.g * v.v2, fmt: f5 },
    { label: "λ-return (1 − λ) TD + (1 − λ)λ two-step + λ² MC", f: v => (1 - v.l) * v.g * v.v1 + (1 - v.l) * v.l * v.g * v.g * v.v2 + v.l * v.l * v.g * v.g * v.r3, fmt: f5 },
    { label: "TD error δ₀ = TD target − V(S₀)", f: v => v.g * v.v1 - 0.2, fmt: f5 },
    { label: "REINFORCE weight G₀ − V(S₀)", f: v => v.g * v.g * v.r3 - 0.2, fmt: f5 }],
   chart: { x: "l", from: 0, to: 1, n: 41, y: [3], xlabel: "λ", ylabel: "λ-return for S₀" } } },
  { type: "example", title: "GRPO on a separate illustrative case", setup: "Four responses to one prompt score 1, 0, 0 and 0.", steps: [
   "group mean = 0.25",
   "standard deviation = √((0.75² + 3 × 0.25²) / 4) = 0.433",
   "correct response: (1 − 0.25) / 0.433 = +1.732; each wrong one: (0 − 0.25) / 0.433 = −0.577"],
   result: "The advantage is applied to **every token** of its response: a Monte Carlo return, with the group standing in for the critic." }
 ]},
 { h: "Map of the space", blocks: [
  { type: "h3", text: "The classical core" },
  { text: "An **MDP** (Markov decision process) is the formal object all of RL optimises over: states, actions, a transition distribution, a reward function and a discount factor, with the **Markov property** (the future depends on the current state alone) making one-step recursion valid. The **Bellman equations** are that recursion: the value of a state is the immediate reward plus the discounted value of its successor, which turns an infinite-horizon problem into a fixed-point problem. Every algorithm solves one of them approximately. Owner of the vocabulary: [RL foundations](" + FOUND + ")." },
  { text: "**Dynamic programming** solves the equations exactly when the transition model is known. **Policy iteration** alternates evaluating the current policy with making it greedy on those values; **value iteration** skips the explicit policy and backs up the best action at every state directly. Both need the full model and a small state space, so they are the ideal everything else approximates by sampling: [Dynamic programming](" + DP + ")." },
  { text: "**Monte Carlo** drops the model and averages the actual returns of complete episodes: unbiased, but a whole episode's randomness lands in every estimate, so variance is high and you must wait for termination. **TD** (temporal-difference) learning updates from its own one-step-ahead estimate instead, trading bias for lower variance and working online on non-terminating tasks; **TD(λ)** is the dial between the two. **SARSA** bootstraps off the action actually taken next, so it learns the value of the exploratory policy it runs (on-policy); **Q-learning** bootstraps off the best next action, learning the greedy policy while behaving exploratorily (off-policy), which is exactly what makes replaying old experience legitimate: [Model-free methods](" + MF + ")." },
  { type: "h3", text: "Deep RL" },
  { text: "Deep RL replaces tables with networks, and is largely a list of stabilisation tricks. **DQN** (deep Q-network) buys stability with an **experience replay buffer** (breaking the correlation of consecutive transitions) and a frozen **target network** (so the regression target stops moving while you chase it)." },
  { text: "**Policy gradients** optimise the policy directly: raise the log-probability of an action in proportion to how good it turned out. **REINFORCE** does it with the sampled return: unbiased, very high variance. Subtracting a state-dependent **baseline** keeps the gradient unbiased and cuts variance; the natural baseline V(s) turns the return into an **advantage**, and learning it with a critic makes a method **actor-critic**. A3C (asynchronous advantage actor-critic) runs parallel workers asynchronously; A2C is its synchronous batched version, structurally what modern LLM RL loops are." },
  { text: "**TRPO** (trust region policy optimisation) made \"take the largest step that is still safe\" precise with a KL constraint, at the cost of second-order machinery. **PPO** (proximal policy optimisation) gets the same effect first-order by **clipping the importance ratio**, so the objective goes flat once the policy has moved far enough in the direction the advantage wants; that makes several epochs of minibatch SGD on one rollout batch safe. **SAC** (soft actor-critic) adds an entropy bonus so exploration does not collapse, which makes it a common off-policy default for continuous control and robotics." },
  { text: "The model-based line: **AlphaZero**, where Monte Carlo tree search (MCTS) over the game's known rules is the policy-improvement operator and its improved move distribution becomes the training target; **MuZero**, which drops the need for known rules by learning a latent dynamics model end to end and planning inside it: [Deep RL](" + DEEP + ")." },
  { type: "h3", text: "RL for LLMs" },
  { text: "Token generation is an MDP with a **deterministic transition** (append the token), a **vocabulary-sized action space** and a **single reward at the end**. So credit assignment over thousands of tokens is the hard part, and the environment model is trivial." },
  { type: "steps", items: [
   "**RLHF** (reinforcement learning from human feedback): a reward model plus PPO, with a per-token KL penalty to a frozen reference.",
   "**GRPO** (group relative policy optimisation): the value model deleted, a sampled group's mean reward as the baseline.",
   "**RLVR** (reinforcement learning from verifiable rewards): a programmatic verifier in place of the learned reward model."] },
  { type: "callout", title: "Two deletions", text: "Read as a lineage, the three are two deletions: GRPO deletes RLHF's critic, and RLVR deletes its learned reward model. DeepSeek-R1 and the 2025-2026 corrections to GRPO's known biases (Dr. GRPO, DAPO, GSPO, off-policy corrections) are on [RL for LLMs](" + LLM + "); the alignment pipeline around them (SFT, reward-model training, the DPO, direct preference optimisation, family) on [Alignment](" + ALIGN + ")." },
  { text: "The largest published recipe in this shape, Mercor's with SkyRL at 397B parameters, argues that exact token accounting, asynchronous RL, environment robustness and harness design decide the outcome as much as the algorithm does. Its figures are on [RL for LLMs](" + LLM + "), and the recipe in full on [Topic: llm-training-and-post-training](" + POST + ")." }
 ]},
 { h: "Trade-offs: which family when", blocks: [
  { text: "Each deep dive weighs its own methods; these are the choices that only show across the whole topic. The Explore tab has them as a decision tree." },
  { type: "table", head: ["Situation", "Use", "Buys and costs"], rows: [
   ["Known, small model", "Dynamic programming", "Exact answers; a sweep over every state per iteration, so small state spaces only"],
   ["Known but huge model (a board game)", "Search, as AlphaZero, with policy and value networks to focus it", "Plans with the real rules"],
   ["No model, but planning pays", "Learn one, as MuZero", "A large compute cost per decision"],
   ["No model, small discrete problem", "Tabular TD: Q-learning, or SARSA", "Q-learning for the greedy optimum when mistakes are cheap (a simulator); SARSA when the exploring agent's own performance while it learns matters"],
   ["Large or continuous states, discrete actions, data precious", "The DQN family", "Off-policy replay reuses old data"],
   ["Any action space, stability first", "PPO", "Robust; costs data, each batch used for a few epochs then discarded"],
   ["Continuous control, expensive samples (robots)", "SAC, or TD3 (twin delayed DDPG; DDPG is deep deterministic policy gradient)", "Off-policy with replay"],
   ["Language models", "PPO with a value model if a per-token critic is affordable; GRPO if not; a verifier (RLVR) wherever answers can be checked", "The verifier removes the learned reward model the policy would otherwise learn to exploit"]] },
  { type: "callout", kind: "key", title: "Across all of them", text: "The bias-variance dial: Monte Carlo targets when estimates are poor or episodes short, bootstrapped targets when estimates are good or episodes long, and n or λ in between." }
 ]},
 { h: "Common mistakes and misconceptions", blocks: [
  { type: "list", items: [
   "**\"Model-based means a learned model.\"** Dynamic programming and AlphaZero are model-based with a given model; of the methods here, only MuZero learns one.",
   "**\"The reward model makes RLHF model-based.\"** It replaces the reward signal and nothing plans with it, so PPO-based RLHF is model-free.",
   "**\"On-policy means online, off-policy means offline.\"** Q-learning and DQN are off-policy while interacting online; PPO reuses each batch for several epochs and is still approximately on-policy.",
   "**\"GRPO has no value estimate, so it is something new.\"** It is a policy-gradient method whose baseline is sampled rather than learned: the group mean plays the role V(s) plays in an actor-critic.",
   "**\"Deep RL is a different theory.\"** Its targets are the classical ones: the Q-learning target in DQN, TD errors in PPO's critic, Monte Carlo returns in REINFORCE and GRPO. What is new is function approximation and the tricks that keep it stable.",
   "**\"Token generation is a hard environment.\"** The transition is trivial; what is hard is assigning credit for one end-of-sequence reward across thousands of tokens, and making the reward itself trustworthy.",
   "**\"A higher reward means a better model.\"** With a learned proxy the policy can keep climbing it while the true objective stalls or degrades (reward hacking), which is why RLHF keeps a KL penalty to a reference model and RLVR prefers verifiers."] }
 ]},
 { h: "Deep dives, in reading order", blocks: [
  { text: "Each one reuses the vocabulary and the methods of the ones before it. The Explore tab has them as a clickable map with a reading tick per page." },
  { type: "table", head: ["#", "Page", "What it covers", "Why at this point"], num: [0], rows: [
   ["1", "[RL foundations](" + FOUND + ")", "The loop, reward, history, state and observability, Markov process to MRP (Markov reward process) to MDP, discounting, V and Q, the Bellman equations with worked student-MDP examples, the agent taxonomy, exploration vs exploitation, prediction vs control, bootstrapping vs sampling, on- and off-policy with importance sampling", "Everything else reuses its vocabulary"],
   ["2", "[Dynamic programming](" + DP + ")", "Policy evaluation and improvement, policy iteration, value iteration, a worked three-state corridor, convergence and its speed, asynchronous DP", "The first classical family: the exact answer every other method approximates"],
   ["3", "[Model-free methods](" + MF + ")", "Monte Carlo, TD, n-step returns and TD(λ), epsilon-greedy and GLIE (greedy in the limit with infinite exploration), SARSA, Q-learning, cliff walking, DP's backups as sampled TD updates", "The second classical family: the same backups from samples"],
   ["4", "[Deep RL](" + DEEP + ")", "DQN and variants (double, dueling, Rainbow), REINFORCE and baselines, actor-critic, GAE and A2C/A3C, TRPO to PPO and the clipped objective, DDPG, TD3 and SAC, AlphaGo to MuZero", "How neural networks replaced tables, and why PPO exists"],
   ["5", "[RL for LLMs](" + LLM + ")", "Token generation as an MDP, PPO for RLHF, GRPO in detail, RLVR, DeepSeek-R1, the 2025-2026 corrections (Dr. GRPO, DAPO, GSPO, off-policy corrections), a checklist for a from-scratch RLVR/GRPO loop", "The payoff for the RLVR/GRPO training-loop project"]] }
 ]},

takeaways: [
 "RL learns to act from a scalar score; the topic runs classical core, then deep RL, then RL for LLMs.",
 "Every method estimates the expected return in the Bellman equation; they differ in what stands in for the expectation: the model (DP), a whole episode (Monte Carlo), one step plus an estimate (TD), a critic (actor-critic, PPO) or a sampled group (GRPO).",
 "The bias-variance dial (n, λ, GAE) runs through every layer: trust the estimate when it is good, the real rewards when it is not.",
 "Three independent axes place any method: what it stores, whether it models the environment, and whose experience it learns from.",
 "For LLMs the environment is trivial and the reward is the hard part: GRPO deletes RLHF's critic, RLVR deletes its learned reward model.",
 "Read the deep dives in order: foundations, dynamic programming, model-free methods, deep RL, RL for LLMs."
],
glossary: [
 { term: "MDP (Markov decision process)", def: "States, actions, a transition distribution, a reward function and a discount factor, with the Markov property: the future depends on the current state alone." },
 { term: "MRP (Markov reward process)", def: "A Markov process with rewards and no actions; the step between a Markov process and an MDP on RL foundations." },
 { term: "Bellman expectation equation", def: "V_{π}(s) = 𝔼_{π}[R_{t+1} + γ V_{π}(S_{t+1}) | S_{t} = s]: the value of a state is the immediate reward plus the discounted value of its successor." },
 { term: "Return", def: "The discounted sum of rewards along one trajectory, G_{t} = R_{t+1} + γ R_{t+2} + ...; the value is its expectation." },
 { term: "Discount factor γ", def: "A number in [0, 1] that weights a reward k steps ahead by γ^{k}." },
 { term: "Value function V, Q", def: "V(s) is the expected return from a state; Q(s, a) the expected return from a state after a given action." },
 { term: "Target", def: "The stand-in for the expectation that an update moves the estimate towards: V ← V + α(target − V)." },
 { term: "Step size α", def: "The fraction of the way the estimate moves towards the target in one update." },
 { term: "Dynamic programming", def: "Solving the Bellman equations exactly with a known model: policy iteration and value iteration." },
 { term: "Policy iteration", def: "Alternate evaluating the current policy with making it greedy on those values." },
 { term: "Value iteration", def: "Back up the best action at every state directly, with no explicit policy." },
 { term: "Monte Carlo", def: "Average the actual returns of complete episodes: unbiased, high variance, needs episodes that end." },
 { term: "TD (temporal-difference) learning", def: "Update towards one sampled step plus the current estimate, R + γ V(S′): biased, lower variance, online." },
 { term: "TD error δ", def: "δ_{t} = R_{t+1} + γ V(S_{t+1}) − V(S_{t}); an actor-critic's one-step advantage estimate." },
 { term: "n-step return", def: "n real rewards, then the discounted estimate of the state reached." },
 { term: "λ-return, TD(λ)", def: "A (1 − λ)λ^{n−1}-weighted average of n-step returns; λ = 0 is TD(0), λ = 1 is Monte Carlo." },
 { term: "GAE", def: "Generalised advantage estimation: a λ-weighted sum of TD errors, the advantage estimator PPO uses." },
 { term: "SARSA", def: "TD control that bootstraps off the action actually taken next: on-policy." },
 { term: "Q-learning", def: "TD control that bootstraps off the best next action: learns the greedy policy while exploring, off-policy." },
 { term: "On-policy, off-policy", def: "On-policy learns about the policy that generated the data; off-policy learns about a target policy from a different behaviour policy's data." },
 { term: "Replay buffer", def: "A store of past transitions that an off-policy method resamples, breaking the correlation of consecutive transitions." },
 { term: "Target network", def: "DQN's frozen copy of the network that computes the target, so it stops moving while the network chases it." },
 { term: "Policy gradient", def: "Move the policy parameters to raise the log-probability of actions in proportion to how good they turned out." },
 { term: "Baseline", def: "A state-dependent quantity subtracted from the return: keeps the policy gradient unbiased and cuts its variance." },
 { term: "Advantage", def: "The return minus a baseline: how much better an action turned out than expected." },
 { term: "Actor-critic", def: "Stores a policy (the actor) and a value function (the critic) that judges its actions and lowers the variance of its updates." },
 { term: "A2C, A3C", def: "Advantage actor-critic; A3C is asynchronous across parallel workers, A2C its synchronous batched version." },
 { term: "TRPO", def: "Trust region policy optimisation: the largest safe step, as a KL constraint with second-order machinery." },
 { term: "PPO", def: "Proximal policy optimisation: clip the importance ratio so the objective goes flat once the policy has moved far enough; several epochs per batch." },
 { term: "SAC", def: "Soft actor-critic: an entropy bonus keeps exploration alive; a common off-policy default for continuous control." },
 { term: "DDPG, TD3", def: "Deep deterministic policy gradient, and TD3 (twin delayed DDPG): off-policy actor-critics for continuous control." },
 { term: "MCTS", def: "Monte Carlo tree search: AlphaZero's policy-improvement operator over the game's known rules." },
 { term: "AlphaZero, MuZero", def: "Search plus policy and value networks; AlphaZero plans with known rules, MuZero with a learned latent dynamics model." },
 { term: "RLHF", def: "Reinforcement learning from human feedback: a reward model plus PPO with a per-token KL penalty to a frozen reference." },
 { term: "GRPO", def: "Group relative policy optimisation: no value model; a sampled group's mean reward (divided by its standard deviation) is the baseline." },
 { term: "RLVR", def: "Reinforcement learning from verifiable rewards: a programmatic verifier in place of the learned reward model." },
 { term: "GLIE", def: "Greedy in the limit with infinite exploration: the exploration schedule that lets model-free control converge." },
 { term: "DPO", def: "Direct preference optimisation: part of the alignment pipeline around RLHF, covered on the Alignment page." },
 { term: "Reward hacking", def: "The policy keeps climbing a proxy reward while the true objective stalls or degrades." }
],

  { q: "Why is the Monte Carlo target unbiased but high-variance?", a: "It uses only real rewards, so no estimate's error enters; but every step's randomness lands in it." },

<script>
/* ===== PAGE CUSTOM WIDGETS (optional): CUSTOM.name = (el, props, K) => { ... }; reads its numbers from props or DATA ===== */
const CUSTOM = {};
/* Custom widgets for "Topic: rl".
   dial: the page's λ-return on an illustrative three-step chain with Bernoulli rewards and a critic whose estimates are off by a set error;
         exact bias, variance and mean squared error over all 2^3 reward outcomes, against λ.
   axes: place a method on the page's three taxonomy axes and check it. */

const TRL = {
  num(v, d = 3) { if (!isFinite(v)) return '-'; return (+v.toFixed(d)).toString().replace('-', '−'); }
};

CUSTOM.dial = (el, o, K) => {
  const g = o.gamma, p = o.p;
  let lam = o.lambda, err = o.error;
  // true values of the chain: each of the three steps pays 1 with probability p
  const V2 = p, V1 = p + g * p, V0 = p + g * p + g * g * p;
  // the page's finite-episode λ-return for S0: (1-λ) G(1) + (1-λ)λ G(2) + λ² G(3)
  const target = (R, l, e) => {
    const G1 = R[0] + g * (V1 + e), G2 = R[0] + g * R[1] + g * g * (V2 + e), G3 = R[0] + g * R[1] + g * g * R[2];
    return (1 - l) * G1 + (1 - l) * l * G2 + l * l * G3;
  };
  const outcomes = [];
  for (let m = 0; m < 8; m++) { const R = [m & 1, (m >> 1) & 1, (m >> 2) & 1]; const k = R[0] + R[1] + R[2]; outcomes.push({ R, pr: Math.pow(p, k) * Math.pow(1 - p, 3 - k) }); }
  const stats = (l, e) => {
    let mean = 0, sq = 0; const vals = outcomes.map(oc => ({ v: target(oc.R, l, e), pr: oc.pr, R: oc.R }));
    vals.forEach(x => { mean += x.pr * x.v; sq += x.pr * x.v * x.v; });
    const variance = Math.max(0, sq - mean * mean), bias = mean - V0;
    return { mean, variance, bias, mse: bias * bias + variance, vals };
  };

  const ctls = K.h('div', { class: 'ctls' });
  const tiles = K.h('div', { class: 'tiles' });
  const reading = K.h('p', { class: 'small', style: 'margin:6px 0' });
  const chartBox = K.h('div');

  const grid = [...Array(41)].map((_, i) => i / 40);

CUSTOM.axes = (el, o, K) => {
  const AX = [
    { key: 'stores', label: 'What it stores', opts: [['value', 'Value (V or Q)'], ['policy', 'Policy'], ['ac', 'Both (actor-critic)']] },

    { key: 'data', label: 'Whose experience?', opts: [['on', 'On-policy'], ['off', 'Off-policy'], ['none', 'None: it plans from the model']] }];
  let mi = 0; const pick = {}; let score = K.store.get('axes:score', { right: 0, tried: 0 });
  const sel = K.h('select', { 'aria-label': 'method' }, o.methods.map((m, i) => K.h('option', { value: i }, m.name)));
  const rows = K.h('div');
  const result = K.h('div', { class: 'panel' });
  const sc = K.h('div', { class: 'small mute', style: 'margin-top:6px' });

  sel.onchange = () => { mi = +sel.value; reset(); };
  el.append(K.h('div', { class: 'bar' }, K.h('span', { class: 'small' }, 'Method:'), sel), rows, K.h('div', { class: 'bar' }, checkBtn, nextBtn), result, sc);
  const updScore = () => sc.textContent = `Axes placed correctly: ${score.right} of ${score.tried}.`;

      rows.append(K.h('div', { class: 'small', style: 'margin:8px 0 2px' }, a.label), K.seg(a.opts, null, v => { pick[a.key] = v; }));
    });

W.tokens=(el,o)=>{/* {tokens:[{t,id,note}]} token strip, click for detail */const strip=h('div',{class:'toks'});const panel=h('div',{class:'panel',html:'<span class="mute">Click a token.</span>'});o.tokens.forEach((t,i)=>{const b=h('span',{class:'tok',style:`background:color-mix(in srgb,${col(i)} 22%,var(--bg))`,onclick:()=>{$$('.tok',strip).forEach(x=>x.classList.remove('on'));b.classList.add('on');panel.innerHTML='';panel.append(h('div',{html:`<b class="mono">${esc(JSON.stringify(t.t))}</b>`+(t.id!=null?` · id ${esc(t.id)}`:'')}));if(t.note)panel.append(h('div',{html:md(t.note)}))}},t.t.replace(/ /g,'␣'));strip.append(b)});el.append(strip,panel)};
W.flashcards=(el,o)=>{const cards=o.cards||DATA.check?.cards||[];if(!cards.length)return;let i=0,back=false;const known=new Set(store.get('fc:'+(o.key||'main'),[]));const c=h('div',{class:'fc',tabindex:0,role:'button'});const cnt=h('span',{class:'small mute'});

// ---------- tabs and boot ----------

const panes={},tabBtns={};

  if(DATA.takeaways)r.append(h('div',{class:'take'},h('h2',null,'Key takeaways'),h('ul',null,DATA.takeaways.map(t=>h('li',{html:md(t)})))));
