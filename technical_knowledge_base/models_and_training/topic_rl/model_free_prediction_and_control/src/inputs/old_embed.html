<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KB visual</title>
<style>
:root{--bg:#fff;--ink:#2f3437;--mute:#787774;--line:#e9e9e7;--soft:#f7f6f3;--acc:#2f6fb5;--acc2:#dbe7f5;--good:#3f7f56;--bad:#c2703a;--dim:#d3d3d0;--hl:#fff3c4;--c1:#2f6fb5;--c2:#c2703a;--c3:#3f7f56;--c4:#8a5cb8;--c5:#b8983a;--c6:#3a9aa8}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--ink:#e6e5e3;--mute:#9b9a97;--line:#2f2f2f;--soft:#222;--acc:#6ea8e6;--acc2:#233a52;--good:#5fae7b;--bad:#e8915c;--dim:#3a3a3a;--hl:#4a4020;--c1:#6ea8e6;--c2:#e8915c;--c3:#5fae7b;--c4:#b48ce0;--c5:#d9bb5f;--c6:#5fc3d1;color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.w{max-width:920px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:23px;line-height:1.25;margin:0;letter-spacing:-.01em}.sub{color:var(--mute);font-size:13px;margin:3px 0 12px}
h2{font-size:18px;margin:30px 0 8px;line-height:1.3}h3{font-size:15px;margin:20px 0 6px}
p{margin:8px 0}a{color:var(--acc)}code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
code{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px}
b,strong{font-weight:600}.mute{color:var(--mute)}.small{font-size:12.5px}
ul,ol{margin:6px 0;padding-left:22px}li{margin:3px 0}
button,select,input,textarea{font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
button{cursor:pointer}button:hover{border-color:var(--mute)}button.on,button.pri{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button:disabled{opacity:.45;cursor:default}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc);width:100%}
input[type=checkbox]{accent-color:var(--acc)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 4px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:9px 12px 8px;color:var(--mute);white-space:nowrap;font-weight:500}
.tab.on{color:var(--ink);border-bottom-color:var(--acc);background:none}.tab.lock{opacity:.6}
.tab .lk{font-size:11px;margin-left:4px}
.pane{display:none;min-width:0}.pane.on{display:block}
.prog{height:3px;background:var(--line);border-radius:2px;margin:0 0 10px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
/* read */
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.toc a{font-size:12.5px;text-decoration:none;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.toc a.seen{border-color:var(--acc);color:var(--acc)}
.sec{scroll-margin-top:52px}

.fm .eq{font-family:"Cambria Math","Latin Modern Math","STIX Two Math",Cambria,Georgia,serif;font-size:18px;text-align:center;white-space:nowrap;padding:4px 0 8px;line-height:1.9}
.fm .lbl{font-size:12.5px;color:var(--mute);font-weight:600;margin-bottom:2px}
.fm dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 12px;margin:6px 0 0;font-size:13.5px}
.fm dt{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:15px;text-align:right}.fm dd{margin:0;color:var(--ink)}
.eq i,.fm dt i{font-style:italic}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}.fr>span:last-child{padding:0 3px}
.bigop{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1}
.bigop>span:nth-child(2){font-size:1.5em;line-height:1.05}.bigop>span:first-child,.bigop>span:last-child{font-size:.62em}
.co{border-left:3px solid var(--acc);background:var(--soft);padding:9px 12px;border-radius:0 6px 6px 0;margin:12px 0}
.co.warn{border-left-color:var(--bad)}.co.key{border-left-color:var(--good)}
.co .t{font-weight:600;font-size:13px;margin-bottom:2px}
.ex{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:12px 0}
.ex .t{font-weight:600;font-size:13.5px;color:var(--good)}
.ex ol{margin:6px 0}.ex .res{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:10px 0}
.two>div{min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px}.two h4{margin:0 0 4px;font-size:14px}
.tw{overflow-x:auto;margin:10px 0;max-width:100%}
table{border-collapse:collapse;font-size:13.5px;width:100%}
th{text-align:left;color:var(--mute);font-weight:500;border-bottom:1px solid var(--line);padding:6px 6px;vertical-align:bottom}
td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
th.sort{cursor:pointer;user-select:none;white-space:nowrap}
pre{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:10px 0}
figure{margin:12px 0}figcaption{font-size:12.5px;color:var(--mute);text-align:center;margin-top:4px}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.s-ink{stroke:var(--ink)}.s-mute{stroke:var(--mute)}.s-line{stroke:var(--line)}.s-acc{stroke:var(--acc)}.s-good{stroke:var(--good)}.s-bad{stroke:var(--bad)}
.f-bg{fill:var(--bg)}.f-soft{fill:var(--soft)}.f-acc{fill:var(--acc)}.f-acc2{fill:var(--acc2)}.f-good{fill:var(--good)}.f-bad{fill:var(--bad)}.f-ink{fill:var(--ink)}.f-mute{fill:var(--mute)}.f-none{fill:none}.f-dim{fill:var(--dim)}
text.f-mute,.t-mute{fill:var(--mute)}
.rv{border:1px dashed var(--acc);border-radius:8px;padding:10px 12px;margin:12px 0}
.rv .q{font-weight:600}.rv .a{display:none;margin-top:6px}.rv.open .a{display:block}
.take{background:var(--acc2);border-radius:8px;padding:12px 16px;margin:24px 0 10px}.take h2{margin:0 0 6px;font-size:16px}
.done{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 0}
.skip{font-size:12.5px;color:var(--mute);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
.lockmsg{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:18px;text-align:center;margin:20px 0}
/* widgets */
.card{border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0;min-width:0}
.card>h3:first-child{margin-top:0}.card .intro{color:var(--mute);font-size:13.5px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:12.5px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:2px 10px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.ctl{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;min-width:0}.ctl label{font-size:12.5px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}.ctl label b{color:var(--ink)}
.ctls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px 16px;margin:8px 0}
.panel{background:var(--soft);border-radius:8px;padding:10px 12px;margin:10px 0;min-height:40px;font-size:14px}
.panel h4{margin:0 0 4px;font-size:14.5px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;font-size:13.5px}.kv>div:nth-child(odd){color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;margin:8px 0}
.tile{background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0}.tile b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile span{color:var(--mute);font-size:12px;display:block;line-height:1.3}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;cursor:default}.item h4{margin:0 0 2px;font-size:14.5px}.item .meta{font-size:12px;color:var(--mute)}
.item.click{cursor:pointer}.item.click:hover{border-color:var(--acc)}.item.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:5px;white-space:nowrap;transform:translate(-50%,-115%);display:none;z-index:9}
.rel{position:relative}
.node{cursor:pointer}.node rect,.node circle{transition:fill .15s,stroke .15s}
.node:hover rect,.node:hover circle{stroke:var(--acc);stroke-width:2}
.node.sel rect,.node.sel circle{stroke:var(--acc);stroke-width:2.5;fill:var(--acc2)}
.node.dim,.edge.dim{opacity:.28}.node.lit rect,.node.lit circle{fill:var(--hl);stroke:var(--bad);stroke-width:2.5}
.edge.lit line,.edge.lit path{stroke:var(--bad);stroke-width:2.5}
.code{font:12.5px/1.65 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 0;overflow-x:auto}
.code div{padding:0 12px;white-space:pre}.code div.cur{background:var(--hl)}.code .ln{color:var(--mute);display:inline-block;width:2.2em;user-select:none}
.fc{border:1px solid var(--line);border-radius:10px;min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;cursor:pointer;font-size:16px;background:var(--soft)}
.fc.back{background:var(--acc2)}
.mcq{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0}.mcq .q{font-weight:600;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;margin:4px 0;background:var(--bg)}.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--bg))}.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg))}
.why{font-size:13.5px;color:var(--mute);margin-top:4px;display:none}.mcq.ans .why{display:block}
.score{font-weight:600}
.res{margin:8px 0}.res .rt{font-weight:600}.res .rm{font-size:12.5px;color:var(--mute)}
.hm{display:grid;gap:1px;font-size:11.5px;margin:6px 0;min-width:0}
.hm .c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:2px;min-width:0;overflow:hidden;cursor:pointer}
.hm .h{display:flex;align-items:center;justify-content:flex-end;padding-right:4px;white-space:nowrap;overflow:hidden;color:var(--mute);min-width:0}
.hm .hc{writing-mode:vertical-rl;transform:rotate(180deg);justify-content:flex-start;padding:4px 0 0;display:flex;align-items:flex-start;color:var(--mute);overflow:hidden;white-space:nowrap}
.hm .h.on,.hm .hc.on{color:var(--ink);font-weight:600}
.toks{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.tok{padding:2px 6px;border-radius:4px;border:1px solid var(--line);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;cursor:pointer}
.tok.on{outline:2px solid var(--acc)}
.log{font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border-radius:6px;padding:6px 10px;max-height:160px;overflow:auto}
.search{width:100%;margin:4px 0 8px}
.hidden{display:none!important}
.narrow{display:none}@media (max-width:600px){.narrow{display:block}}
.fig svg{width:100%;height:auto}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:2px 0 4px}.lg i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
@media (max-width:560px){body{font-size:14.5px}.fm .eq{font-size:16px}h1{font-size:20px}}
</style></head><body><div class="w">

<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="panes"></main>
</div>
<script>
/* ===== PAGE DATA: everything page-specific lives here. Schema: see "DATA schema" in the Build KB visuals skill. ===== */
const DATA = (() => {
const I = x => `<i>${x}</i>`;
const L4 = 'https://davidstarsilver.wordpress.com/wp-content/uploads/2025/04/lecture-4-model-free-prediction-.pdf';
const L5 = 'https://davidstarsilver.wordpress.com/wp-content/uploads/2025/04/lecture-5-model-free-control-.pdf';
const SB = 'http://incompleteideas.net/book/RLbook2020.pdf';
const DP = 'https://app.notion.com/p/3c65c17b0d0d81baada7e1c05ce69d01';
const FOUND = 'https://app.notion.com/p/3c65c17b0d0d810b8c5ce46696baf31f';
const DEEP = 'https://app.notion.com/p/3c65c17b0d0d8180b808c8c0cf8ddbe6';
const LLM = 'https://app.notion.com/p/3c65c17b0d0d818c9bcff7177325fe56';
const TOPIC = 'https://app.notion.com/p/3c65c17b0d0d8195a6c6c11ad093c16e';
const MAX = lo => `<span class="bigop"><span>&nbsp;</span><span>max</span><span>${lo}</span></span>`;
const SUM = (lo, up) => `<span class="bigop"><span>${up || '&nbsp;'}</span><span>∑</span><span>${lo}</span></span>`;
const V = (s) => `${I('V')}(${s})`;
const Q = (s, a) => `${I('Q')}(${s}, ${a})`;
const St = `${I('S')}<sub>t</sub>`, St1 = `${I('S')}<sub>t+1</sub>`, Rt1 = `${I('R')}<sub>t+1</sub>`, Gt = `${I('G')}<sub>t</sub>`;

// backup diagrams: DP, MC and TD side by side
const backups = `<svg viewBox="0 0 720 230" role="img" aria-label="Three backups: DP looks one step at every successor, MC follows one path to the end, TD follows one step">
<g font-size="13" font-weight="600"><text x="120" y="18" text-anchor="middle">DP: full width, one step</text><text x="360" y="18" text-anchor="middle">MC: one path, to the end</text><text x="600" y="18" text-anchor="middle">TD: one path, one step</text></g>
<g class="s-mute" stroke-width="1.3">
<line x1="120" y1="48" x2="60" y2="98"/><line x1="120" y1="48" x2="120" y2="98"/><line x1="120" y1="48" x2="180" y2="98"/>
<line x1="360" y1="48" x2="340" y2="90"/><line x1="340" y1="90" x2="375" y2="132"/><line x1="375" y1="132" x2="350" y2="174"/>
<line x1="600" y1="48" x2="620" y2="98"/>
</g>
<g class="f-acc2 s-acc" stroke-width="2"><circle cx="120" cy="40" r="11"/><circle cx="360" cy="40" r="11"/><circle cx="600" cy="40" r="11"/></g>
<g class="f-soft s-ink" stroke-width="1.2"><circle cx="60" cy="106" r="10"/><circle cx="120" cy="106" r="10"/><circle cx="180" cy="106" r="10"/><circle cx="340" cy="90" r="9"/><circle cx="375" cy="132" r="9"/><circle cx="620" cy="106" r="10"/></g>
<rect x="340" y="166" width="20" height="16" class="f-ink"/><text x="368" y="179" font-size="12">terminal</text>
<g font-size="12" class="f-mute"><text x="120" y="140" text-anchor="middle">every successor, weighted by P</text><text x="120" y="156" text-anchor="middle">needs the model</text>
<text x="360" y="210" text-anchor="middle">target: the whole return G</text>
<text x="600" y="140" text-anchor="middle">target: R + γ V(S′)</text><text x="600" y="156" text-anchor="middle">bootstraps off the estimate</text></g>
</svg>`;

// cliff walking grid with the two paths
const cliffSvg = (() => {
  const cs = 44, W = 12 * cs + 4, H = 4 * cs + 4; let g = '';
  for (let r = 0; r < 4; r++) for (let c = 0; c < 12; c++) { const x = 2 + c * cs, y = 2 + r * cs; const cliff = r === 3 && c >= 1 && c <= 10; const goal = r === 3 && c === 11; g += `<rect x="${x}" y="${y}" width="${cs}" height="${cs}" class="${cliff ? 'f-bad' : goal ? 'f-good' : 'f-bg'} s-line"${cliff ? ' fill-opacity="0.75"' : ''}/>`; }
  const cx = c => 2 + c * cs + cs / 2, cy = r => 2 + r * cs + cs / 2;
  const opt = [[3, 0], [2, 0], [2, 11], [3, 11]].map(([r, c]) => `${cx(c)},${cy(r)}`).join(' ');
  const safe = [[3, 0], [0, 0], [0, 11], [3, 11]].map(([r, c]) => `${cx(c)},${cy(r)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cliff walking: a 4 by 12 grid, start bottom left, goal bottom right, cliff between them; the optimal path hugs the cliff, the safe path runs along the top">${g}
<polyline points="${safe}" fill="none" class="s-good" stroke-width="4" stroke-dasharray="7 5"/>
<polyline points="${opt}" fill="none" class="s-acc" stroke-width="4"/>
<text x="${cx(0) - 8}" y="${cy(3) + 5}" font-size="14" font-weight="700">S</text><text x="${cx(11)}" y="${cy(3) + 5}" text-anchor="middle" font-size="14" font-weight="700" class="f-bg">G</text>
<text x="${cx(5) + cs / 2}" y="${cy(3) + 5}" text-anchor="middle" font-size="13" font-weight="600" class="f-bg">the cliff: −100, back to S</text>
<text x="${cx(5) + cs / 2}" y="${cy(2) - 8}" text-anchor="middle" font-size="12">optimal edge path, 13 steps (Q-learning's values)</text>
<text x="${cx(5) + cs / 2}" y="${cy(0) + 20}" text-anchor="middle" font-size="12">a safe path along the top, 17 steps (SARSA goes up here)</text>
</svg>`;
})();

return {
id: "model-free-methods-monte-carlo-td-sarsa-q-learning",
title: "Model-free methods: Monte Carlo, TD, SARSA, Q-learning",
subtitle: "Built from the page as of 2026-09-30 · learn from samples instead of a model: MC and TD on the same episode, the TD(λ) dial, and SARSA against Q-learning on the cliff",
read: [
 { h: "What it is and why it matters", blocks: [
  { text: "Model-free RL learns values and policies **from experience alone**: the agent never sees the transition probabilities or the reward function, it acts and observes. Every method here answers one question: when the expectation over next states that dynamic programming computes from a model is unavailable, **what replaces it?**" },
  { type: "list", items: [
   "**Monte Carlo** (MC): the **whole sampled return**. Play the episode to the end and use what actually happened.",
   "**Temporal-difference** (TD): **one sampled step plus the current estimate** of where it landed. A guess learned from a guess, online, after every step.",
   "**SARSA** and **Q-learning** turn TD evaluation into control. SARSA learns the value of the exploratory policy it runs (on-policy); Q-learning learns the greedy policy's value while behaving exploratorily (off-policy)."
  ]},
  { type: "two", cols: [
   { title: "Idea 1: one dial", text: "MC and TD are the two ends of a **bias-variance dial**; n-step returns and TD(λ) are the settings in between." },
   { title: "Idea 2: whose values?", text: "**On-policy vs off-policy** decides what the values mean. On the cliff, SARSA learns a safe detour and Q-learning the risky optimal edge." } ] },
  { text: "Every modern target is one of these: DQN regresses onto the Q-learning target, PPO's critic learns a TD target and its advantage is a TD(λ) average, and GRPO's single end-of-sequence reward is a Monte Carlo return." }
 ]},
 { h: "Model-free vs model-based", blocks: [
  { text: "No model and no understanding of the dynamics are needed: sample from the environment and work out the optimal policy from experience. That also covers a model that exists but is too big to use except by sampling, such as Go. The price: you only learn about states you actually visit, which creates the exploration problem." },
  { type: "svg", svg: backups, width: 720, minWidth: 600, caption: "Dynamic programming uses **full-width backups** from a known model. Model-free methods use **sample backups**: one episode (MC) or one transition (TD) stands in for the expectation, so an update's cost no longer depends on the number of states." },
  { text: "The model-based side is on [Dynamic programming: planning with a known model](" + DP + ")." }
 ]},
 { h: "Definitions", blocks: [
  { text: "The vocabulary is owned by [RL foundations](" + FOUND + "); what this page uses:" },
  { type: "table", head: ["Term", "Meaning"], rows: [
   ["**Episode**", "S_{0}, A_{0}, R_{1}, S_{1}, ..., S_{T}: state, action, the reward that follows, until the terminal time T"],
   ["**Return** G_{t}", "R_{t+1} + γR_{t+2} + ... + γ^{T−t−1}R_{T}, the discounted rewards still to come, γ ∈ [0, 1]"],
   ["**V_{π}(s)**, **Q_{π}(s, a)**", "Expected return from s (or after taking a in s) following π. V(s) and Q(s, a) without π are the agent's table of estimates"],
   ["**Prediction / control**", "Estimate V_{π} or Q_{π} for a fixed π / find a good policy"],
   ["**Target, step size α**", "new = old + α (target − old), α ∈ (0, 1]. The methods differ only in the target"],
   ["**Bootstrapping**", "The target contains an existing estimate. DP and TD bootstrap; MC does not"],
   ["**Sampling**", "The target uses sampled transitions instead of a model's expectation. MC and TD sample; DP does not"],
   ["**On- / off-policy**", "Learn about the policy generating the data / learn about a **target policy** π from data made by a **behaviour policy** μ"] ] }
 ]},
 { h: "Monte Carlo policy evaluation", blocks: [
  { text: "Follow the policy for complete episodes and average the returns that actually followed each state. The value **is** the mean return, so the estimate converges to V_{π}(s) as visits grow (law of large numbers)." },
  { type: "steps", items: ["Run an episode with π until it terminates.", "Walk backwards computing each return, G_{t} = R_{t+1} + γG_{t+1}, with G_{T} = 0.", "Move each visited state's estimate towards the return that followed it."] },
  { text: "**First-visit** MC uses only a state's first visit per episode; **every-visit** uses all visits; both converge. A running mean is incremental, μ_{k} = μ_{k−1} + (1/k)(x_{k} − μ_{k−1}); replacing 1/k by a constant gives **constant-α MC**, which forgets old episodes and tracks a changing problem." },
  { type: "formula", label: "Constant-α Monte Carlo", html: `${V(St)} ← ${V(St)} + ${I('α')} ( ${Gt} − ${V(St)} )`, where: [[V(St), 'the current estimate for the state visited at time ' + I('t')], [Gt, 'the return actually observed from ' + I('t') + ' to the end of the episode'], [I('α'), 'the step size; 1/' + I('N') + '(' + St + '), with ' + I('N') + ' the visit count, gives the exact running mean'], [`${Gt} − ${V(St)}`, 'the error the update shrinks']] },
  { type: "two", cols: [
   { title: "Buys", text: "**Unbiased**: G_{t} is a sample of exactly what V_{π}(S_{t}) is the expectation of. Does not rely on the Markov property." },
   { title: "Costs", text: "**High variance**: G_{t} carries every random action, transition and reward to the end. **Needs terminating episodes** and learns nothing mid-episode." } ] }
 ]},
 { h: "Temporal-difference (TD) learning", blocks: [
  { text: "Do not wait for the real return. After one step you know one real reward and where you landed, and you already have an estimate of that place. Use reward plus discounted estimate as the target: TD \"updates a guess towards a guess\"." },
  { type: "formula", label: "TD(0)", html: `${V(St)} ← ${V(St)} + ${I('α')} ( ${Rt1} + ${I('γ')} ${V(St1)} − ${V(St)} )`, where: [[Rt1, 'the reward on the step from ' + St + ' to ' + St1], [`${I('γ')} ${V(St1)}`, 'the discounted current estimate of the next state (0 if terminal)'], [`${Rt1} + ${I('γ')} ${V(St1)}`, 'the **TD target**'], [`${I('δ')}<sub>t</sub> = ${Rt1} + ${I('γ')} ${V(St1)} − ${V(St)}`, 'the **TD error**, the surprise on this step'], [I('α'), 'the step size']], note: "The DP evaluation backup is V(s) ← E_{π}[R_{t+1} + γV(S_{t+1}) | S_{t} = s]. TD is that backup with the expectation replaced by one sample and a step of size α towards it." },
  { type: "two", cols: [
   { title: "Buys", text: "**Online**, works on incomplete episodes and continuing tasks. **Low variance**: one random action, transition and reward. **Usually more sample-efficient**, because it exploits the Markov property." },
   { title: "Costs", text: "**Biased**: the target leans on V(S_{t+1}), which may be wrong, and TD is more sensitive to the initial values. Tabular TD(0) converges to V_{π}, but not always with a function approximator." } ] }
 ]},
 { h: "Worked example: MC and TD on one random-walk episode", blocks: [
  { text: "Five states A to E in a row. Every episode starts in C and moves left or right with probability 0.5; stepping off the right end earns 1, everything else 0, γ = 1. So the true value is the probability of finishing on the right: **1/6, 2/6, 3/6, 4/6, 5/6** for A to E. All estimates start at 0.5; α = 0.1." },
  { type: "example", title: "Episode C → D → E → off the right end (rewards 0, 0, 1)", setup: "Same episode, two update rules.", steps: [
   "**TD**, C → D: δ = 0 + 0.5 − 0.5 = 0, V(C) stays 0.5.",
   "**TD**, D → E: δ = 0 + 0.5 − 0.5 = 0, V(D) stays 0.5.",
   "**TD**, E → end: δ = 1 + 0 − 0.5 = 0.5, V(E) = 0.5 + 0.1 × 0.5 = **0.55**.",
   "**MC**, at the end: every visit had return G = 1, so V(C), V(D), V(E) each become 0.5 + 0.1 × (1 − 0.5) = **0.55**."
  ], result: "MC moved three states by the full surprise; TD moved only the last one. Next time the walk passes D → E, D's TD target is 0 + 0.55 and D rises to 0.505: TD's information travels back one state per episode, while each MC credit carries the full randomness of where that walk ended." },
  { type: "widget", widget: { type: "custom", name: "rwEpisode", title: "Step through it: TD updates now, MC updates at the end", intro: "The first episode is the page's. Then press **Next episode** to keep learning from random walks and watch the bars approach the dashed true values.", alpha: 0.1, init: 0.5, episode: [2, 3, 4, 'R'], seed: 7 } },
  { text: "Measured as the root-mean-square (RMS) error against the true values, averaged over the five states and over 100 runs, TD was consistently better than MC on this task across the step sizes Sutton and Barto compared." }
 ]},
 { h: "Batch MC vs batch TD: what each converges to", blocks: [
  { text: "Replay a fixed batch of experience until convergence and the two methods reach **different answers**. Eight episodes, no discounting: one **A, 0, B, 0**; six **B, 1**; one **B, 0**. Both agree V(B) = 6/8 = 0.75." },
  { type: "reveal", q: "What is V(A) under batch MC, and under batch TD?", a: "**Batch MC: V(A) = 0.** A was seen once and its return was 0: the minimum squared error fit to the observed returns.<br>**Batch TD: V(A) = 0.75.** A always led to B, and B is worth 0.75: the exact value under the **maximum-likelihood Markov model** of the data (certainty equivalence). If the process really is Markov, TD's answer predicts future data better." }
 ]},
 { h: "TD(λ) and the relation to MC", blocks: [
  { text: "Between one step and the whole episode lie the **n-step returns**: n real rewards, then bootstrap." },
  { type: "formula", label: "n-step return", html: `${I('G')}<sub>t</sub><sup>(n)</sup> = ${Rt1} + ${I('γ')}${I('R')}<sub>t+2</sub> + ... + ${I('γ')}<sup>n−1</sup>${I('R')}<sub>t+n</sub> + ${I('γ')}<sup>n</sup> ${V(I('S') + '<sub>t+n</sub>')}`, where: [[`${I('G')}<sub>t</sub><sup>(n)</sup>`, 'the n-step return from time ' + I('t') + '; if the episode ends first, just the rewards to the end'], [V(I('S') + '<sub>t+n</sub>'), 'the estimate of the state reached after ' + I('n') + ' steps']], note: "n = 1 is the TD(0) target; n = ∞ (the end of the episode) is the MC return. **n-step TD** updates V(S_{t}) towards G_{t}^{(n)}." },
  { type: "formula", label: "λ-return (forward view of TD(λ))", html: `${I('G')}<sub>t</sub><sup>λ</sup> = (1 − ${I('λ')}) ${SUM('<i>n</i>=1', '∞')} ${I('λ')}<sup>n−1</sup> ${I('G')}<sub>t</sub><sup>(n)</sup>`, where: [[I('λ'), 'in [0, 1]: how fast the weights decay'], ['(1 − ' + I('λ') + ')', 'makes the weights sum to 1']], note: "In an episode ending at T every n ≥ T − t gives the full return G_{t}, so those weights lump together: (1 − λ)λ^{n−1} for each n < T − t and **λ^{T−t−1}** on G_{t}. **λ = 0** is one-step TD; **λ = 1** is Monte Carlo. More real rewards in the target: less bias, more variance." },
  { type: "example", title: "Worked λ-return: the random-walk episode from C", setup: "All values 0.5, rewards 0, 0, 1, T − t = 3, λ = 0.5.", steps: ["G^{(1)} = 0 + V(D) = 0.5; G^{(2)} = 0 + 0 + V(E) = 0.5; G^{(3)} = G = 1.", "Weights: 0.5, 0.25, and the remaining 0.25 on the full return.", "G^{λ} = 0.5 × 0.5 + 0.25 × 0.5 + 0.25 × 1."], result: "G^{λ} = **0.625**: between TD's target of 0.5 and MC's target of 1." },
  { type: "widget", widget: { type: "custom", name: "lambdaWeights", title: "Turn the dial: where does TD(λ) put its weight?", intro: "Slide λ and the number of steps left. The last bar is the lump on the full Monte Carlo return.", lambda: 0.5, left: 3 } },
  { type: "formula", label: "Backward view: eligibility traces (computes it online)", html: `${I('E')}<sub>t</sub>(${I('s')}) = ${I('γ')}${I('λ')} ${I('E')}<sub>t−1</sub>(${I('s')}) + <b>1</b>(${St} = ${I('s')}), &nbsp;&nbsp; ${V(I('s'))} ← ${V(I('s'))} + ${I('α')} ${I('δ')}<sub>t</sub> ${I('E')}<sub>t</sub>(${I('s')}) for every ${I('s')}`, where: [[`${I('E')}<sub>t</sub>(${I('s')})`, 'the trace of state ' + I('s') + ': how recently and how often it was visited (starts at 0)'], [`<b>1</b>(${St} = ${I('s')})`, '1 if ' + I('s') + ' is the current state, else 0'], [`${I('δ')}<sub>t</sub>`, 'the ordinary one-step TD error']], note: "Each TD error is broadcast back to recent states in proportion to their traces. λ = 0 updates only the current state (TD(0)); λ = 1 with updates applied at the episode's end equals MC exactly, because the discounted TD errors telescope into G_{t} − V(S_{t})." }
 ]},
 { h: "MC vs TD intuition", blocks: [
  { type: "callout", kind: "key", title: "Silver's driving analogy", text: "A car swerves at you, you nearly crash but do not, and the episode ends fine. **MC** only sees the final return, so the near-death moment leaves no trace: every state is credited with a good outcome. **TD** updates online: the moment the crash looks imminent the value estimate plunges, and the preceding states are pulled toward that plunge immediately. TD propagates \"that was almost a disaster\"; MC misses it." },
  { type: "table", head: ["", "Monte Carlo", "TD"], rows: [
   ["Target", "Actual return G_{t}", "R_{t+1} + γV(S_{t+1}) (bootstrapped)"],
   ["Waits for episode end", "Yes", "No (online)"],
   ["Bias / variance", "Unbiased / high variance", "Biased / low variance"],
   ["Episodic MDPs required", "Yes", "No"],
   ["Bootstraps", "No", "Yes"],
   ["Sensitive to initial values", "Little", "More"],
   ["Exploits the Markov property", "No: better when the state is not fully Markov", "Yes: usually more efficient when it is"],
   ["Batch solution", "Best least-squares fit to observed returns", "Exact values of the maximum-likelihood Markov model"],
   ["With function approximation", "Converges", "Not always"] ] }
 ]},
 { h: "Model-free control: evaluation and improvement from samples", blocks: [
  { text: "Control is **generalised policy iteration**: evaluate, then improve, as in DP. With sampled evaluation both halves break: evaluation only covers visited states, and greedy improvement can lock onto actions whose values are wrong because they were never tried. Two fixes:" },
  { type: "two", cols: [
   { title: "1. Learn Q(s, a), not V(s)", text: "Greedy on V needs the model: π′(s) = argmax_{a} [R(s, a) + γ Σ_{s′} P(s′ | s, a) V(s′)]. Greedy on Q is a plain **π′(s) = argmax_{a} Q(s, a)**." },
   { title: "2. ε-greedy exploration", text: "Greedy with probability 1 − ε, otherwise uniformly random over m actions: the greedy action gets 1 − ε + ε/m, every other ε/m. The ε-greedy policy on Q_{π} is at least as good as the ε-greedy π it came from, so improvement still works." } ] },
  { type: "callout", kind: "", title: "GLIE: greedy in the limit with infinite exploration", text: "Every state-action pair is visited infinitely often **and** the policy converges to greedy. ε-greedy with ε_{k} = 1/k on the k-th episode is GLIE. **GLIE Monte Carlo control** (per episode: count N(S_{t}, A_{t}), update Q(S_{t}, A_{t}) ← Q(S_{t}, A_{t}) + (1/N)(G_{t} − Q(S_{t}, A_{t})), set ε ← 1/k, act ε-greedily) converges to Q_{∗}." }
 ]},
 { h: "SARSA (on-policy TD control)", blocks: [
  { text: "Replace MC by TD in the loop: evaluate Q with a TD update after **every step** and act ε-greedily on the latest Q. The update uses (S, A, R, S′, A′), hence the name." },
  { type: "formula", label: "SARSA", html: `${Q(I('S'), I('A'))} ← ${Q(I('S'), I('A'))} + ${I('α')} ( ${I('R')} + ${I('γ')} ${Q(I('S′'), I('A′'))} − ${Q(I('S'), I('A'))} )`, where: [[`${I('S')}, ${I('A')}`, 'the current state and the action taken'], [`${I('R')}, ${I('S′')}`, 'the reward received and the next state'], [I('A′'), 'the action the agent **actually takes next**, chosen ε-greedily'], [Q(I('S′'), I('A′')), '0 if ' + I('S′') + ' is terminal'], [`${I('α')}, ${I('γ')}`, 'step size and discount']] },
  { type: "steps", items: ["Start in S; choose A ε-greedily from Q.", "Take A; observe R and S′.", "Choose A′ ε-greedily from Q in S′.", "Update Q(S, A) with the rule above.", "S ← S′, A ← A′; repeat from step 2 until S is terminal."] },
  { text: "A′ comes from the acting policy, so SARSA learns **the value of the policy it executes, exploration included**: on-policy, model-free, TD control. It converges to Q_{∗} with GLIE policies and **Robbins-Monro** step sizes, Σ_{t} α_{t} = ∞ and Σ_{t} α_{t}^{2} < ∞ (big enough in total to overcome any initial values, shrinking fast enough for the noise to average out). With ε fixed it settles on a policy that is good given that it keeps exploring." },
  { type: "list", items: ["**n-step SARSA**, **SARSA(λ)**: the same MC-TD dial, with n-step Q-returns and one trace per state-action pair.", "**Expected SARSA**: replace the sampled Q(S′, A′) by Σ_{a′} π(a′ | S′) Q(S′, a′), removing the variance from the random choice of A′."] }
 ]},
 { h: "Q-learning (off-policy TD control)", blocks: [
  { text: "Same shape; the bootstrap uses the **best** next action, not the one taken." },
  { type: "formula", label: "Q-learning", html: `${Q(I('S'), I('A'))} ← ${Q(I('S'), I('A'))} + ${I('α')} ( ${I('R')} + ${I('γ')} ${MAX(I('a′'))} ${Q(I('S′'), I('a′'))} − ${Q(I('S'), I('A'))} )`, where: [[`max<sub><i>a′</i></sub> ${Q(I('S′'), I('a′'))}`, 'the largest current estimate over all actions in ' + I('S′') + ' (0 if terminal)'], ['others', 'as for SARSA']] },
  { text: "It **behaves** ε-greedily (behaviour policy μ) but its target evaluates the **greedy** policy (target policy π): off-policy. **No importance sampling** is needed, because the target never uses the action μ chose next; the behaviour only decides which pairs get updated. That is also what lets DQN learn from a replay buffer. Q-learning is the sampled counterpart of **value iteration** (the max is the Bellman optimality backup) and converges to Q_{∗} as long as every pair keeps being updated with suitable step sizes; ε need not decay for the values to converge, only for the behaviour to become optimal." },
  { type: "callout", kind: "warn", title: "Maximisation bias", text: "A max over noisy estimates is biased upwards: if several actions are truly worth 0 but their estimates scatter around 0, the max is positive. **Double Q-learning** keeps Q_{1} and Q_{2} and updates one at random, using it to pick the action and the other to value it: Q_{1}(S, A) ← Q_{1}(S, A) + α(R + γQ_{2}(S′, argmax_{a} Q_{1}(S′, a)) − Q_{1}(S, A)). Unbiased, at double the memory. Double DQN is the same idea with networks." }
 ]},
 { h: "Worked example: one transition, two targets", blocks: [
  { text: "*Illustrative numbers from the page.* In S next to a cliff the agent took A = right and got R = −1; γ = 1, α = 0.5, Q(S, right) = −5. In S′, Q(S′, right) = −4 is best and Q(S′, down) = −100 steps into the cliff. The ε-greedy policy happened to pick the exploratory **A′ = down**." },
  { type: "two", cols: [
   { title: "SARSA: the action taken", text: "target = −1 + (−100) = −101<br>new Q(S, right) = −5 + 0.5 × (−101 − (−5)) = **−53**" },
   { title: "Q-learning: the best action", text: "target = −1 + (−4) = −5<br>new Q(S, right) = −5 + 0.5 × (−5 − (−5)) = **−5**, unchanged" } ] },
  { text: "SARSA's value of \"right, next to the cliff\" absorbs the risk that its own exploration will stumble in; Q-learning's ignores it, because it assumes greedy behaviour from S′ on." }
 ]},
 { h: "Cliff walking: SARSA against Q-learning", blocks: [
  { text: "Sutton and Barto's gridworld: 4 by 12, start bottom left, goal bottom right, the ten cells between them are the cliff. Every step costs −1; stepping into the cliff costs −100 and sends you back to the start; undiscounted; both methods act ε-greedily with ε = 0.1." },
  { type: "svg", svg: cliffSvg, width: 540, minWidth: 540, caption: "The optimal path (solid) hugs the cliff: 13 steps, return −13. A safe path (dashed) along the top row is 17 steps." },
  { type: "reveal", q: "Which path will each method's values describe, and which earns more reward while learning?", a: "**Q-learning learns the values of the edge path**, because its target assumes greedy behaviour. But the agent explores: on each of the ten edge cells the random 10% of actions picks \"down\" a quarter of the time, 0.1/4 = 0.025 per step. One pass without a fall has probability 0.975^{10} ≈ 0.776, so about 22% of passes fall at least once, and its **online** return is poor.<br>**SARSA learns a longer path through the upper part of the grid**, because its values include its own stumbles, and it collects **more reward per episode** while ε stays at 0.1. If ε were gradually reduced, both would converge to the edge path." },
  { type: "callout", kind: "key", title: "Which is right?", text: "Q-learning answers \"what is optimal if I stop exploring?\"; SARSA answers \"what is best given that I will keep exploring like this?\". For a robot exploring on real hardware, SARSA's answer is the safer one." }
 ]},
 { h: "DP and TD: the same backups, sampled", blocks: [
  { text: "Each TD method is a sampled DP method; x ←_{α} y means x ← x + α(y − x)." },
  { type: "table", head: ["Bellman equation", "Full backup (DP, needs the model)", "Sample backup (TD, model-free)"], rows: [
   ["Expectation, V", "Iterative policy evaluation: V(s) ← E[R + γV(S′) | s]", "TD learning: V(S) ←_{α} R + γV(S′)"],
   ["Expectation, Q", "Q-policy iteration: Q(s, a) ← E[R + γQ(S′, A′) | s, a]", "SARSA: Q(S, A) ←_{α} R + γQ(S′, A′)"],
   ["Optimality, Q", "Q-value iteration: Q(s, a) ← E[R + γ max_{a′} Q(S′, a′) | s, a]", "Q-learning: Q(S, A) ←_{α} R + γ max_{a′} Q(S′, a′)"] ] }
 ]},
 { h: "Trade-offs and when to use which", blocks: [
  { type: "table", head: ["Choice", "Pick this", "When"], rows: [
   ["Prediction", "**TD**", "Continuing tasks, long episodes, state close to Markov: lower variance, learns mid-episode"],
   ["Prediction", "**MC**", "Short episodes, partially observed state, or a function approximator where robust convergence matters"],
   ["Prediction", "**n-step / TD(λ)**", "Often better than either end"],
   ["Control", "**Q-learning**", "You want the optimal greedy policy and mistakes while learning are cheap (a simulator), or you learn from old or someone else's data"],
   ["Control", "**SARSA**", "The exploring agent's own performance during learning matters"],
   ["Control", "**Expected SARSA**", "A low-variance compromise; with a greedy target policy it becomes Q-learning"] ] },
  { type: "list", items: ["**Step size α**: larger learns faster and fluctuates more; a constant α never settles exactly but tracks a changing problem.", "**ε**: more exploration finds better actions and costs reward while learning; decay it (GLIE) when the final policy should be greedy.", "**Tables**: one number per state or pair, nothing learned about unvisited states; this stops working once the state space is large or continuous."] }
 ]},
 { h: "Common mistakes and misconceptions", blocks: [
  { type: "list", items: [
   "**\"TD is always better than MC.\"** Usually on Markov tasks with a table; but it is biased, leans on the initial values, and can diverge with function approximation where MC does not.",
   "**MC and TD converge to the same thing on finite data.** No: batch MC fits the returns, batch TD solves the maximum-likelihood Markov model (V(A) = 0 against 0.75).",
   "**Acting greedily on V without a model.** The greedy step over V needs the transitions; learn Q.",
   "**Choosing SARSA's A′ twice.** A′ must be the action actually executed next. Pick one for the update and another to execute and you have neither SARSA nor Q-learning.",
   "**\"Off-policy, so it needs importance sampling.\"** One-step Q-learning does not. Off-policy MC and n-step methods do, and the ratios multiply along the trajectory and can blow up the variance.",
   "**\"On-policy means online, off-policy means offline.\"** Q-learning is off-policy and online; the distinction is which policy the values describe.",
   "**Reading Q-learning's values as the return you will get.** They are the greedy policy's returns; while exploring, you get less, as on the cliff.",
   "**Forgetting maximisation bias.** The max over noisy estimates overestimates; Double Q-learning fixes it.",
   "**Bootstrapping from a terminal state.** V(S′) and Q(S′, ·) are 0 there; a stale estimate leaks value past the end of the episode."
  ]}
 ]},
 { h: "Where this goes next", blocks: [
  { type: "list", items: [
   "**Deep RL**: replace the table with a network plus stabilisers, a replay buffer (legitimate because Q-learning is off-policy) and a frozen target network. DQN regresses onto the Q-learning target, Double DQN applies double learning, actor-critic methods learn a critic with TD targets: [Deep RL: from DQN to PPO to MuZero](" + DEEP + ").",
   "**LLM RL**: GRPO's single end-of-sequence reward, compared against the mean of a sampled group, is a Monte Carlo return (unbiased, no value model, high variance). PPO with a value model uses GAE, a λ-weighted average of the critic's TD errors r + γV(s′) − V(s), so it sits partway along the TD(λ) dial: [RL for LLMs: RLHF, GRPO, RLVR](" + LLM + ").",
   "**Up the tree**: [Topic: rl](" + TOPIC + ") places all four as model-free and value-based; SARSA on-policy, Q-learning off-policy."
  ]}
 ]}
],
takeaways: [
 "Model-free methods replace DP's expectation over successors with **samples**: MC with the whole return, TD with one step plus the current estimate.",
 "MC is unbiased, high variance and needs episodes to end; TD is biased, low variance, online, and usually more efficient on Markov tasks.",
 "n-step returns and **TD(λ)** are the dial between them: λ = 0 is TD(0), λ = 1 is MC.",
 "On finite data, batch MC fits the observed returns; batch TD solves the maximum-likelihood Markov model.",
 "Control needs **Q** (so the greedy step needs no model) and **exploration** (ε-greedy, GLIE for convergence).",
 "**SARSA** bootstraps off the action taken: on-policy, it values the exploring policy. **Q-learning** bootstraps off the max: off-policy, it values the greedy policy, with no importance sampling.",
 "On the cliff, Q-learning learns the optimal edge path but falls in while exploring; SARSA learns a safer path and earns more while ε stays at 0.1.",
 "These targets live on inside DQN, PPO's critic and GAE, and GRPO's Monte Carlo reward."
],
glossary: [
 { term: "Model-free", def: "Learns from sampled experience without the transition probabilities or reward function." },
 { term: "Sample backup", def: "An update from one sampled transition or episode instead of an expectation over all successors." },
 { term: "Return G_{t}", def: "The discounted sum of rewards from time t to the end of the episode." },
 { term: "Monte Carlo (MC) evaluation", def: "Averages the actual returns that followed each state; unbiased, high variance, needs episodes to end." },
 { term: "First-visit / every-visit MC", def: "Use only the first visit to a state per episode, or every visit; both converge." },
 { term: "Constant-α MC", def: "MC with a fixed step size instead of the running mean; forgets old episodes." },
 { term: "TD(0)", def: "Update towards R_{t+1} + γV(S_{t+1}) after every step." },
 { term: "TD target", def: "R_{t+1} + γV(S_{t+1}), the one-step bootstrapped target." },
 { term: "TD error δ_{t}", def: "R_{t+1} + γV(S_{t+1}) − V(S_{t}), the surprise on one step." },
 { term: "Bootstrapping", def: "Using an existing estimate inside the target (DP and TD do; MC does not)." },
 { term: "n-step return", def: "n real rewards plus the discounted estimate of the state reached after n steps." },
 { term: "λ-return", def: "The (1 − λ)λ^{n−1}-weighted average of all n-step returns; the forward view of TD(λ)." },
 { term: "Eligibility trace", def: "A per-state record of how recently and often it was visited, decaying by γλ per step; the backward view of TD(λ)." },
 { term: "Certainty equivalence", def: "Batch TD's answer: the exact values of the maximum-likelihood Markov model fitted to the data." },
 { term: "Generalised policy iteration", def: "Alternating any amount of evaluation with any amount of improvement." },
 { term: "ε-greedy", def: "Greedy with probability 1 − ε, uniformly random otherwise; the greedy action gets 1 − ε + ε/m." },
 { term: "GLIE", def: "Greedy in the limit with infinite exploration: every pair visited infinitely often, the policy converging to greedy (for example ε = 1/k)." },
 { term: "Robbins-Monro conditions", def: "Step sizes with Σα_{t} = ∞ and Σα_{t}^{2} < ∞." },
 { term: "SARSA", def: "On-policy TD control: target R + γQ(S′, A′) with A′ the action actually taken next." },
 { term: "Expected SARSA", def: "SARSA with Q(S′, A′) replaced by its expectation under the policy." },
 { term: "Q-learning", def: "Off-policy TD control: target R + γ max_{a′} Q(S′, a′); the sampled counterpart of value iteration." },
 { term: "Behaviour / target policy", def: "The policy that generates the data (μ) / the policy whose values are learned (π)." },
 { term: "Maximisation bias", def: "The upward bias of a max over noisy estimates." },
 { term: "Double Q-learning", def: "Two tables: one picks the action, the other values it, removing maximisation bias." },
 { term: "Cliff walking", def: "Sutton and Barto's 4 by 12 gridworld with a −100 cliff along the bottom edge, used to contrast SARSA and Q-learning." }
],
explore: [
 { type: "custom", name: "cliff", title: "Cliff walking: which route does each method learn, and which earns more?", intro: "Both methods have already trained for 500 episodes on the same gridworld with the same ε and α; Reset to watch them learn from scratch. Bold arrows are each one's greedy path. Click a cell to see its Q-values. Try ε = 0: both act greedily, their targets coincide, and the difference all but disappears.", eps: 0.1, alpha: 0.5, stepReward: -1, cliffReward: -100, maxEpisodes: 500, startEpisodes: 500, runs: 20, window: 10, ymin: -100 },
 { type: "custom", name: "rwCurves", title: "MC against TD on the random walk: who learns faster?", intro: "RMS error of the value estimates against the true values (1/6 to 5/6), averaged over the five states and over many runs, as Sutton and Barto measured it. Change α and the n of the third curve.", alpha: 0.1, n: 4, episodes: 100, runs: 100, init: 0.5 },
 { type: "custom", name: "rwEpisode", title: "One episode, two update rules", intro: "The page's worked example, then random episodes. TD moves one state per step; MC moves every visited state at the end.", alpha: 0.1, init: 0.5, episode: [2, 3, 4, 'R'], seed: 7 },
 { type: "calc", title: "SARSA or Q-learning: one update", intro: "The page's transition next to the cliff. Change which action the ε-greedy policy happened to take next, and the numbers.", inputs: [
   { id: "ap", label: "A′ actually taken next", options: [["down", "down"], ["right", "right"]], value: "down" },
   { id: "q", label: "Q(S, right) now", min: -20, max: 0, step: 1, value: -5 },
   { id: "r", label: "reward R", min: -5, max: 0, step: 1, value: -1 },
   { id: "alpha", label: "step size α", min: 0.1, max: 1, step: 0.1, value: 0.5, fmt: v => v.toFixed(1) },
   { id: "qr", label: "Q(S′, right), the best", min: -20, max: 0, step: 1, value: -4 },
   { id: "qd", label: "Q(S′, down), into the cliff", min: -120, max: -20, step: 5, value: -100 },
   ],
   outputs: [
   { label: "SARSA target R + γQ(S′, A′), γ = 1", f: v => v.r + (v.ap === 'down' ? v.qd : v.qr), fmt: x => x.toFixed(0) },
   { label: "SARSA: new Q(S, right)", f: v => v.q + v.alpha * (v.r + (v.ap === 'down' ? v.qd : v.qr) - v.q), fmt: x => x.toFixed(2) },
   { label: "Q-learning target R + γ max Q(S′, ·)", f: v => v.r + Math.max(v.qr, v.qd), fmt: x => x.toFixed(0) },
   { label: "Q-learning: new Q(S, right)", f: v => v.q + v.alpha * (v.r + Math.max(v.qr, v.qd) - v.q), fmt: x => x.toFixed(2) } ] },
 { type: "calc", title: "How often does exploring along the edge fall in?", intro: "The page's formula: each edge step picks the fatal action with probability ε/m, so one pass of k edge steps survives with probability (1 − ε/m)^{k}.", inputs: [

   outputs: [
   { label: "chance of the fatal action per step, ε/m", f: v => v.eps / v.m, fmt: x => x.toFixed(4) },
   { label: "chance of a pass with no fall", f: v => Math.pow(1 - v.eps / v.m, v.k), fmt: x => x.toFixed(3) },
   { label: "chance of at least one fall", f: v => 1 - Math.pow(1 - v.eps / v.m, v.k), fmt: x => (100 * x).toFixed(1) + '%' } ],
   chart: { x: "eps", from: 0, to: 0.5, n: 26, y: [2], xlabel: "ε", ylabel: "chance of a fall", yfmt: v => (100 * v).toFixed(0) + '%' } },
 { type: "custom", name: "lambdaWeights", title: "The TD(λ) dial", intro: "Weights on each n-step return; the last bar is the lump on the full return.", lambda: 0.5, left: 3 },
 { type: "decision", title: "Which method should I use?", intro: "From the page's trade-offs.", start: "a", nodes: {
   a: { q: "Are you predicting a fixed policy's values, or finding a good policy?", options: [["Predicting (evaluation)", "p"], ["Finding a policy (control)", "c"]] },
   p: { q: "Do episodes terminate, and are they short?", options: [["No: continuing task, or very long episodes", "td"], ["Yes, short episodes", "p2"]] },
   p2: { q: "Is the state close to Markov?", options: [["Yes", "td2"], ["No: partially observed", "mc"]] },
   td: { answer: "TD (or TD(λ))", why: "MC cannot learn until an episode ends; TD learns online after every step." },
   td2: { answer: "TD, or an intermediate n or λ", why: "TD exploits the Markov property and has lower variance; an intermediate setting is often better than either end." },
   mc: { answer: "Monte Carlo, or a large λ", why: "MC does not rely on the Markov property and has more robust convergence with function approximation." },
   c: { q: "Does the agent's reward while it is still learning matter (real hardware, costly mistakes)?", options: [["Yes", "sarsa"], ["No: a simulator, mistakes are cheap", "c2"]] },
   c2: { q: "Do you need to learn from old data or someone else's behaviour?", options: [["Yes", "ql"], ["No", "ql2"]] },
   sarsa: { answer: "SARSA (or Expected SARSA)", why: "On-policy: it optimises the exploring policy it actually runs, so it avoids risks its own exploration would trigger." },
   ql: { answer: "Q-learning", why: "Off-policy with no importance sampling: its target ignores which action the behaviour policy took." },
   ql2: { answer: "Q-learning (consider Double Q-learning)", why: "It learns the optimal greedy policy directly; double learning removes maximisation bias." } } },
 { type: "sections", title: "Section map", intro: "Jump back to any part of the Read tab." },
 { type: "glossary", title: "Glossary", intro: "Every term the page defines." }
],

 cards: [
  { q: "What does each method use in place of DP's expectation over next states?", a: "MC: the whole sampled return. TD: one sampled step plus the current estimate of the next state." },
  { q: "Why is MC unbiased but high variance?", a: "G_{t} is a sample of exactly what V_{π} is the expectation of, but it carries every random action, transition and reward until the episode ends." },
  { q: "Why is TD biased?", a: "Its target R + γV(S′) uses the current estimate V(S′), which may be wrong." },
  { q: "On the random-walk episode C → D → E → right, which states does each method change?", a: "TD changes only E (to 0.55); MC changes C, D and E (each to 0.55)." },
  { q: "Batch MC and batch TD on the AB example: V(A)?", a: "MC 0 (fit to the observed return), TD 0.75 (the maximum-likelihood Markov model)." },
  { q: "What do λ = 0 and λ = 1 give in TD(λ)?", a: "λ = 0: one-step TD. λ = 1: Monte Carlo." },
  { q: "What is an eligibility trace for?", a: "The backward view: it broadcasts each TD error to recently and frequently visited states, computing TD(λ) online." },
  { q: "Why does model-free control learn Q instead of V?", a: "Greedy improvement over V needs the model to know where each action leads; over Q it is a plain argmax." },
  { q: "What does GLIE require?", a: "Every state-action pair explored infinitely often, and the policy converging to greedy (for example ε = 1/k)." },
  { q: "SARSA's A′: which action is it?", a: "The action actually taken next by the ε-greedy policy. That is what makes SARSA on-policy." },
  { q: "Why does one-step Q-learning need no importance sampling?", a: "Its target uses the max over next actions, never the action the behaviour policy chose." },
  { q: "What is maximisation bias, and the fix?", a: "The max over noisy estimates is biased upwards. Double Q-learning picks the action with one table and values it with the other." },
  { q: "Why does SARSA avoid the cliff edge while ε = 0.1?", a: "Its values include its own exploratory stumbles: about 22% of passes along the edge fall in at least once." },
  { q: "Which Bellman equation does Q-learning sample?", a: "The optimality equation for Q: it is sampled Q-value iteration." }
 ],
 mcq: [

  { q: "Random walk, all values 0.5, α = 0.1, episode C → D → E → right. After TD(0), V(E) is:", options: ["0.5", "0.55", "0.6", "1"], answer: 1, why: "δ = 1 + 0 − 0.5 = 0.5, so V(E) = 0.5 + 0.1 × 0.5 = 0.55. C and D had δ = 0." },
  { q: "In the λ-return for the same episode from C with λ = 0.5, the weight on the full return is:", options: ["0.5", "0.125", "0.25", "0"], answer: 2, why: "With T − t = 3, the lump on G_{t} is λ^{T−t−1} = 0.5^{2} = 0.25; the returns are weighted 0.5, 0.25, 0.25 and G^{λ} = 0.625." },
  { q: "A state is only partially observed (not Markov). Which method is usually more robust?", options: ["TD(0)", "Monte Carlo", "Q-learning", "Value iteration"], answer: 1, why: "MC does not exploit the Markov property, so it is usually more effective in non-Markov environments." },
  { q: "In the page's transition, the exploratory A′ = down has Q = −100 and the best Q(S′, right) = −4. With R = −1, α = 0.5, Q(S, right) = −5, SARSA's new Q(S, right) is:", options: ["−5", "−53", "−101", "−2.5"], answer: 1, why: "Target −1 + (−100) = −101; −5 + 0.5 × (−101 + 5) = −53. Q-learning would keep −5." },

},

<script>
/* ===== PAGE CUSTOM WIDGETS (optional): CUSTOM.name = (el, props, K) => { ... }; reads its numbers from props or DATA ===== */
const CUSTOM = {};
/* Custom widgets for "Model-free methods: Monte Carlo, TD, SARSA, Q-learning".
   rwEpisode: MC and TD(0) updating on the same random-walk episode, step by step.
   rwCurves: RMS error against episodes on the random walk, MC against TD(0) and n-step TD, averaged over runs.
   lambdaWeights: the weight TD(lambda) puts on each n-step return, and the page's worked lambda-return.
   cliff: SARSA and Q-learning trained side by side on the cliff-walking gridworld. */

const RNG = seed => { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };

// ---------- random walk: one episode, MC against TD ----------
CUSTOM.rwEpisode = (el, o, K) => {
  const NS = ['A', 'B', 'C', 'D', 'E'], TRUE = [1, 2, 3, 4, 5].map(i => i / 6);
  let alpha = o.alpha, rng = RNG(o.seed || 7), epNo = 1;
  let Vtd, Vmc, ep, pos, log, done;
  const f = v => K.fmt(v, 4);
  // an episode is a list of states (0..4) followed by 'L' or 'R'
  const sample = () => { let s = 2; const out = [s]; for (;;) { s += rng() < 0.5 ? -1 : 1; if (s < 0) { out.push('L'); break; } if (s > 4) { out.push('R'); break; } out.push(s); } return out; };
  const nm = x => x === 'L' ? 'off the left end' : x === 'R' ? 'off the right end' : NS[x];
  const startEp = e => { ep = e; pos = 0; done = false; log = []; };
  const reset = () => { Vtd = Array(5).fill(o.init); Vmc = Array(5).fill(o.init); epNo = 1; rng = RNG(o.seed || 7); startEp(o.episode.slice()); };
  const stepOnce = () => {
    if (done) return;
    const s = ep[pos], n = ep[pos + 1], r = n === 'R' ? 1 : 0, vn = typeof n === 'number' ? Vtd[n] : 0;
    const d = r + vn - Vtd[s], old = Vtd[s]; Vtd[s] = old + alpha * d;
    log.push(`**TD**, ${NS[s]} → ${nm(n)}: δ = ${r} + ${typeof n === 'number' ? '(V(' + NS[n] + ') = ' + f(vn) + ')' : '0 (terminal)'} − ${f(old)} = ${f(d)}, so V(${NS[s]}) = ${f(old)} + ${alpha} × ${f(d)} = **${f(Vtd[s])}**`);
    pos++;
    if (typeof ep[pos] !== 'number') { // episode over: Monte Carlo now updates every visited state (every-visit)
      done = true; const G = ep[ep.length - 1] === 'R' ? 1 : 0;
      const seen = [];
      for (let t = 0; t < ep.length - 1; t++) { const st = ep[t]; const old2 = Vmc[st]; Vmc[st] = old2 + alpha * (G - old2); seen.push(`V(${NS[st]}) = ${f(old2)} + ${alpha} × (${G} − ${f(old2)}) = **${f(Vmc[st])}**`); }
      log.push(`**MC**, episode over, every visit had return G = ${G}: ` + seen.join('; '));
    }
  };
  const ctl = K.h('div', { class: 'bar' });
  const sl = K.slider({ label: 'step size α', min: 0.05, max: 0.5, step: 0.05, value: alpha, fmt: v => v.toFixed(2), onInput: v => { alpha = +v; reset(); draw(); } });
  const bStep = K.h('button', { class: 'pri', onclick: () => { stepOnce(); draw(); } }, 'Next step');
  const bFin = K.h('button', { onclick: () => { while (!done) stepOnce(); draw(); } }, 'Finish episode');
  const bNew = K.h('button', { onclick: () => { if (!done) while (!done) stepOnce(); epNo++; startEp(sample()); draw(); } }, 'Next episode (random, keeps values)');
  const bReset = K.h('button', { onclick: () => { reset(); draw(); } }, "Reset to the page's episode");
  ctl.append(bStep, bFin, bNew, bReset);
  const epLine = K.h('div', { class: 'small' }), svgBox = K.h('div', { style: 'overflow-x:auto' }), panel = K.h('div', { class: 'panel' });
  el.append(K.h('div', { class: 'ctls' }, sl), ctl, epLine, svgBox, panel);
  const draw = () => {
    epLine.innerHTML = K.md(`Episode ${epNo}: ` + ep.map((x, i) => { const t = nm(x); return i === pos && !done ? `**[${t}]**` : t; }).join(' → ') + (done ? ' (over)' : `, the agent is in **${NS[ep[pos]]}**`) + (epNo === 1 ? ". This is the page's worked example." : ''));
    svgBox.innerHTML = '';
    const W = 640, H = 250, svg = K.s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Value estimates of states A to E under TD and MC, with the true values', style: 'width:100%;min-width:480px;display:block' }, svgBox);
    const rows = [['TD(0)', Vtd, 30], ['Monte Carlo', Vmc, 140]];
    rows.forEach(([name, V, y0]) => {
      K.s('text', { x: 8, y: y0 + 50, 'font-size': 13, 'font-weight': 600, text: name }, svg);
      NS.forEach((n, i) => {
        const x = 120 + i * 100, bh = 80;
        K.s('rect', { x, y: y0, width: 70, height: bh, class: 'f-soft s-line' }, svg);
        K.s('rect', { x, y: y0 + bh * (1 - V[i]), width: 70, height: bh * V[i], class: 'f-acc', 'fill-opacity': 0.55 }, svg);
        K.s('line', { x1: x - 4, x2: x + 74, y1: y0 + bh * (1 - TRUE[i]), y2: y0 + bh * (1 - TRUE[i]), class: 's-ink', 'stroke-width': 2, 'stroke-dasharray': '4 3' }, svg);
        const here = !done && ep[pos] === i;
        if (here) K.s('rect', { x: x - 3, y: y0 - 3, width: 76, height: bh + 6, class: 'f-none s-acc', 'stroke-width': 3 }, svg);
        K.s('text', { x: x + 35, y: y0 + bh + 17, 'text-anchor': 'middle', 'font-size': 13, text: `${n}: ${K.fmt(V[i], 3)}` }, svg);
      });
    });
    K.s('text', { x: W - 8, y: 16, 'text-anchor': 'end', 'font-size': 12, class: 'f-mute', text: 'bar = estimate, dashed line = true value (1/6 to 5/6)' }, svg);
    panel.innerHTML = log.length ? log.slice(-6).map(x => K.md(x)).join('<br>') : '<span class="mute">Press "Next step". TD updates after every step; Monte Carlo waits for the end of the episode.</span>';
    const rms = V => Math.sqrt(V.reduce((t, v, i) => t + (v - TRUE[i]) ** 2, 0) / 5);
    panel.append(K.h('div', { class: 'small mute', style: 'margin-top:6px' }, `RMS error against the true values: TD ${K.fmt(rms(Vtd), 3)}, MC ${K.fmt(rms(Vmc), 3)}.`));
    bStep.disabled = done; bFin.disabled = done;
  };
  K.onTheme(draw);
  reset(); draw();
};

// ---------- random walk: learning curves ----------
CUSTOM.rwCurves = (el, o, K) => {
  const TRUE = [1, 2, 3, 4, 5].map(i => i / 6);
  let alpha = o.alpha, nstep = o.n;
  const rms = V => Math.sqrt(V.reduce((t, v, i) => t + (v - TRUE[i]) ** 2, 0) / 5);
  // n-step TD, online (Sutton and Barto's algorithm); n = Infinity is constant-alpha MC
  const curve = (n, a, seed) => {
    const rng = RNG(seed), err = Array(o.episodes + 1).fill(0);
    for (let run = 0; run < o.runs; run++) {
      const V = Array(5).fill(o.init); err[0] += rms(V);
      for (let e = 1; e <= o.episodes; e++) {
        if (n === Infinity) { // constant-alpha MC, every visit: the return from each visit is the final reward (gamma = 1)
          let s = 2; const vis = [s]; let G;
          for (;;) { s += rng() < 0.5 ? -1 : 1; if (s < 0) { G = 0; break; } if (s > 4) { G = 1; break; } vis.push(s); }
          for (const st of vis) V[st] += a * (G - V[st]);
          err[e] += rms(V); continue;
        }
        const S = [2], Rw = [0]; let T = Infinity, t = 0;
        for (;;) {
          if (t < T) { let s = S[t] + (rng() < 0.5 ? -1 : 1); if (s < 0 || s > 4) { Rw.push(s > 4 ? 1 : 0); S.push(-1); T = t + 1; } else { Rw.push(0); S.push(s); } }
          const tau = t - n + 1;
          if (tau >= 0) { let G = 0; for (let i = tau + 1; i <= Math.min(tau + n, T); i++) G += Rw[i]; if (tau + n < T) G += V[S[tau + n]]; V[S[tau]] += a * (G - V[S[tau]]); }
          if (tau === T - 1) break; t++;
        }
        err[e] += rms(V);
      }
    }
    return err.map((x, e) => [e, x / o.runs]);
  };
  const ctls = K.h('div', { class: 'ctls' });
  ctls.append(K.slider({ label: 'step size α', min: 0.05, max: 0.3, step: 0.05, value: alpha, fmt: v => v.toFixed(2), onInput: v => { alpha = +v; later(); } }));
  const nw = K.h('div', { class: 'ctl' }, K.h('label', null, K.h('span', null, 'third curve: n-step TD with n =')));
  nw.append(K.seg([[2, '2'], [4, '4'], [8, '8']], nstep, v => { nstep = v; draw(); })); ctls.append(nw);
  const box = K.h('div'), reading = K.h('div', { class: 'panel' });
  el.append(ctls, box, reading);
  let chart = null;
  let tmr = null; const later = () => { clearTimeout(tmr); tmr = setTimeout(draw, 120); };
  const draw = () => {
    const td = curve(1, alpha, 11), mc = curve(Infinity, alpha, 11), ns = curve(nstep, alpha, 11);
    const series = [{ name: 'TD(0)', points: td }, { name: 'Monte Carlo', points: mc }, { name: `${nstep}-step TD`, points: ns, dash: '5 4' }];
    if (!chart) chart = K.lineChart(box, { series, xlabel: 'episodes', ylabel: 'RMS error', ymin: 0, xfmt: v => K.fmt(v, 0), yfmt: v => K.fmt(v, 2) }); else chart.set(series);
    const last = s => s[s.length - 1][1];
    reading.innerHTML = K.md(`**Reading.** After ${o.episodes} episodes with α = ${alpha.toFixed(2)}, averaged over ${o.runs} runs: TD(0) ${K.fmt(last(td), 3)}, Monte Carlo ${K.fmt(last(mc), 3)}, ${nstep}-step TD ${K.fmt(last(ns), 3)}. Raise α: everything learns faster early and then flattens at a higher error, because a constant step keeps chasing the latest episodes. Computed live by this page on the page's random walk (all values start at 0.5).`);
  };
  draw();
};

// ---------- TD(lambda) weights ----------
CUSTOM.lambdaWeights = (el, o, K) => {
  let lam = o.lambda, left = o.left;
  const ctls = K.h('div', { class: 'ctls' });
  ctls.append(K.slider({ label: 'λ', min: 0, max: 1, step: 0.05, value: lam, fmt: v => v.toFixed(2), onInput: v => { lam = +v; draw(); } }));
  ctls.append(K.slider({ label: 'steps left in the episode, T − t', min: 1, max: 10, step: 1, value: left, fmt: v => String(v), onInput: v => { left = +v; draw(); } }));

// ---------- cliff walking: SARSA against Q-learning ----------
CUSTOM.cliff = (el, o, K) => {
  const RW = 4, CL = 12, START = 3 * CL, GOAL = 3 * CL + 11, N = RW * CL;
  const isCliff = s => Math.floor(s / CL) === 3 && s % CL >= 1 && s % CL <= 10;
  const DIRS = [[-1, 0, '↑', 'up'], [0, 1, '→', 'right'], [1, 0, '↓', 'down'], [0, -1, '←', 'left']];
  const move = (s, a) => { const r = Math.floor(s / CL), c = s % CL; let nr = r + DIRS[a][0], nc = c + DIRS[a][1]; if (nr < 0 || nr >= RW || nc < 0 || nc >= CL) { nr = r; nc = c; } const n = nr * CL + nc; if (isCliff(n)) return { n: START, r: o.cliffReward, fell: true }; return { n, r: o.stepReward, done: n === GOAL }; };

  const agent = (method, seed) => ({ method, Q: Array.from({ length: N }, () => [0, 0, 0, 0]), rng: RNG(seed), eps: 0, rets: [], last: null });

      const x = move(s, a); G += x.r; if (x.fell) falls++;
      if (x.done) { A.Q[s][a] += alpha * (x.r - A.Q[s][a]); trail.push(x.n); steps++; break; }
      const a2 = pick(A, x.n);
      const target = x.r + (A.method === 'sarsa' ? A.Q[x.n][a2] : Math.max(...A.Q[x.n]));
      A.Q[s][a] += alpha * (target - A.Q[s][a]); s = x.n; a = a2; trail.push(s);
    }
    A.rets.push(G); A.last = { G, falls, steps, trail };
  };
  const greedyPath = Q => { let s = START; const p = [s], seen = new Set([s]); for (let i = 0; i < 60; i++) { const q = Q[s], a = q.indexOf(Math.max(...q)); const x = move(s, a); s = x.n; if (x.fell) return { p, ok: false, why: 'walks into the cliff' }; p.push(s); if (x.done) return { p, ok: true }; if (seen.has(s)) return { p, ok: false, why: 'loops (not settled yet)' }; seen.add(s); } return { p, ok: false, why: 'does not reach the goal' }; };
  let S, Qa, curves = null, trained = 0;
  const fresh = () => { S = agent('sarsa', 101); Qa = agent('q', 101); trained = 0; };
  const train = k => { for (let i = 0; i < k && trained < o.maxEpisodes; i++) { episode(S); episode(Qa); trained++; } };
  // curves: averaged over several independent runs, smoothed over a window
  const computeCurves = () => {
    const E = o.maxEpisodes, sum = { sarsa: Array(E).fill(0), q: Array(E).fill(0) };
    for (let r = 0; r < o.runs; r++) for (const m of ['sarsa', 'q']) { const A = agent(m, 1000 + r); for (let e = 0; e < E; e++) episode(A); A.rets.forEach((g, e) => sum[m][e] += g); }
    const sm = arr => arr.map((_, e) => { const lo = Math.max(0, e - o.window + 1); let t = 0; for (let i = lo; i <= e; i++) t += arr[i]; return [e + 1, Math.max(o.ymin, t / (e - lo + 1) / o.runs)]; });
    return [{ name: 'SARSA', points: sm(sum.sarsa) }, { name: 'Q-learning', points: sm(sum.q) }];
  };
  const ctls = K.h('div', { class: 'ctls' });
  ctls.append(K.slider({ label: 'exploration ε', min: 0, max: 0.3, step: 0.05, value: eps, fmt: v => v.toFixed(2), onInput: v => { eps = +v; later(); } }));
  ctls.append(K.slider({ label: 'step size α', min: 0.1, max: 1, step: 0.1, value: alpha, fmt: v => v.toFixed(1), onInput: v => { alpha = +v; later(); } }));
  let tmr = null; const later = () => { clearTimeout(tmr); tmr = setTimeout(() => restart(), 150); };

  bar.append(K.h('button', { class: 'pri', onclick: () => { train(1); draw(); } }, 'Train 1 episode'), K.h('button', { onclick: () => { train(50); draw(); } }, 'Train 50'), K.h('button', { onclick: () => { train(o.maxEpisodes); draw(); } }, `Train to ${o.maxEpisodes}`), K.h('button', { onclick: () => { restart(0); } }, 'Reset'));
  const gS = K.h('div', { style: 'overflow-x:auto' }), gQ = K.h('div', { style: 'overflow-x:auto' });
  const reading = K.h('div', { class: 'panel' }), detail = K.h('div', { class: 'panel' });
  const chartTitle = K.h('h4', { style: 'margin:14px 0 2px;font-size:14.5px' }, 'Sum of rewards per episode while learning');

    host.append(K.h('div', { style: 'font-weight:600;font-size:14px;margin-top:8px' }, title), K.h('div', { class: 'small mute' }, gp.ok ? `Greedy path: ${gp.p.length - 1} steps, return ${-(gp.p.length - 1)} if followed without exploring.` : `Greedy path so far ${gp.why}.`));

      if (isCliff(s)) { K.s('rect', { x, y, width: cs, height: cs, class: 'f-bad s-line', 'fill-opacity': 0.75 }, g); continue; }
      K.s('rect', { x, y, width: cs, height: cs, class: (s === GOAL ? 'f-good' : lastPass.has(s) ? 'f-soft' : 'f-bg') + ' s-line', 'fill-opacity': s === GOAL ? 0.8 : 1 }, g);

      if (s === GOAL) { K.s('text', { x: x + cs / 2, y: y + cs / 2 + 5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 600, class: 'f-bg', text: 'G' }, g); continue; }

      K.s('text', { x: x + cs / 2, y: y + cs / 2 + 7, 'text-anchor': 'middle', 'font-size': on ? 20 : 15, 'font-weight': on ? 700 : 400, class: on ? 'f-acc' : 'f-mute', text: q.every(v => v === 0) ? '·' : DIRS[a][2] }, g);
      if (sel === s) K.s('rect', { x: x + 2, y: y + 2, width: cs - 4, height: cs - 4, class: 'f-none s-acc', 'stroke-width': 3 }, g);
    }
    K.s('text', { x: 1 + 6 * cs, y: 1 + 3.5 * cs + 5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 600, class: 'f-bg', 'pointer-events': 'none', text: 'the cliff: −100, back to S' }, svg);
  };
  const mean = (arr, k) => { const a = arr.slice(-k); return a.length ? a.reduce((t, x) => t + x, 0) / a.length : NaN; };
  const draw = () => {
    drawGrid(gS, S, 'SARSA (on-policy)'); drawGrid(gQ, Qa, 'Q-learning (off-policy)');
    const k = Math.min(50, trained);
    const lastLine = A => A.last ? `last episode ${A.last.steps} steps, return ${A.last.G}, ${A.last.falls} fall${A.last.falls === 1 ? '' : 's'}` : 'not trained yet';
    reading.innerHTML = trained ? K.md(`**Reading, after ${trained} episodes** (ε = ${eps.toFixed(2)}, α = ${alpha.toFixed(1)}). Average return over the last ${k} episodes while exploring: SARSA **${K.fmt(mean(S.rets, k), 1)}**, Q-learning **${K.fmt(mean(Qa.rets, k), 1)}**. SARSA: ${lastLine(S)}. Q-learning: ${lastLine(Qa)}. Bold arrows are each method's greedy path; shaded cells were visited in its last training episode.`) : K.md('Untrained. Press **Train to ' + o.maxEpisodes + '** (or step one episode at a time). Predict first: which route will each method settle on?');
    drawDetail();
    chartNote.textContent = `Averaged over ${o.runs} independent runs per method and smoothed over the last ${o.window} episodes, with the same ε and α as above; values below ${o.ymin} are drawn at ${o.ymin}. Computed live by this page.`;
    if (!curves) curves = computeCurves();
