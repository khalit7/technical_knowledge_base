<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model-free prediction and control</title>
<style>
:root{--bg:#fff;--ink:#2f3437;--mute:#787774;--line:#e9e9e7;--soft:#f7f6f3;--acc:#2f6fb5;--acc2:#dbe7f5;--good:#3f7f56;--bad:#c2703a;--dim:#d3d3d0;--hl:#fff3c4;--open:#1a7f37;--open2:#dcefe0;--closed:#8250df;--closed2:#ece3fb;--c1:#2f6fb5;--c2:#c2703a;--c3:#3f7f56;--c4:#8a5cb8;--c5:#b8983a;--c6:#3a9aa8}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--ink:#e6e5e3;--mute:#9b9a97;--line:#2f2f2f;--soft:#222;--acc:#6ea8e6;--acc2:#233a52;--good:#5fae7b;--bad:#e8915c;--dim:#3a3a3a;--hl:#4a4020;--open:#4fbf6a;--open2:#1d3324;--closed:#b48ce0;--closed2:#2e2440;--c1:#6ea8e6;--c2:#e8915c;--c3:#5fae7b;--c4:#b48ce0;--c5:#d9bb5f;--c6:#5fc3d1;color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.w{max-width:920px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:23px;line-height:1.25;margin:0;letter-spacing:-.01em}.sub{color:var(--mute);font-size:13px;margin:3px 0 12px}
h2{font-size:19px;margin:34px 0 6px;line-height:1.3}h3{font-size:15px;margin:18px 0 6px}
p{margin:8px 0}code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
b,strong{font-weight:600}.mute{color:var(--mute)}.small{font-size:12.5px}
ul,ol{margin:6px 0;padding-left:22px}li{margin:3px 0}
button,select,input{font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
button{cursor:pointer}button:hover{border-color:var(--mute)}button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc);width:100%}
input[type=checkbox]{accent-color:var(--acc)}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 0;margin:0 0 6px}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:12.5px;text-decoration:none;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
.nav a.cur{border-color:var(--acc);color:var(--acc)}
section{scroll-margin-top:48px}
.lead{font-size:16px}
.try{font-size:13px;color:var(--mute);border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:8px 0 10px}
.try b{color:var(--ink)}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;min-width:0}
.co{border-left:3px solid var(--acc);background:var(--soft);padding:9px 12px;border-radius:0 6px 6px 0;margin:12px 0}
.co.warn{border-left-color:var(--bad)}.co.key{border-left-color:var(--good)}
.co .t{font-weight:600;font-size:13px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px;margin:10px 0}
.grid>div{min-width:0}
.sp{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg)}
.sp .n{font-size:11.5px;color:var(--mute);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.sp p{margin:3px 0 0;font-size:13.5px}.sp a{color:var(--acc);text-decoration:none}.sp a:hover{text-decoration:underline}.sp .n a{text-transform:none;font-size:13.5px;letter-spacing:0}.sp .rt{color:var(--mute);font-size:12.5px}#s-more h3{font-size:14px;margin:14px 0 4px}
.bets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.bet{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--soft)}
.bet h4{margin:0 0 4px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{font-size:12.5px;padding:2px 10px;border-radius:99px}
.band{margin:12px 0 4px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:6px}
.lab{text-align:left;border-radius:8px;padding:6px 9px;border:1px solid var(--line);background:var(--bg);line-height:1.3;min-width:0}
.lab .nm{font-weight:600;font-size:13.5px;display:block}.lab .fl{font-size:12px;color:var(--mute);display:block;overflow-wrap:anywhere}
.lab.o{border-left:4px solid var(--open)}.lab.c{border-left:4px solid var(--closed)}
.lab.sel{outline:2px solid var(--acc);outline-offset:1px}.lab.dim{opacity:.28}
.detail{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:var(--soft)}
.detail h3{margin:0 0 2px}.tag{display:inline-block;font-size:11.5px;border-radius:99px;padding:0 8px;margin:2px 4px 2px 0;border:1px solid var(--line);background:var(--bg)}
.tag.o{color:var(--open);border-color:var(--open)}.tag.c{color:var(--closed);border-color:var(--closed)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;font-size:13.5px;margin:6px 0}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.tw{overflow-x:auto;max-width:100%;margin:8px 0}
table{border-collapse:collapse;font-size:13px;width:100%}
th{text-align:left;color:var(--mute);font-weight:500;border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:bottom}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.fm{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0;overflow-x:auto}
.fm .eq{font-family:"Cambria Math","STIX Two Math",Cambria,Georgia,serif;font-size:18px;text-align:center;white-space:nowrap;padding:4px 0 6px}
.fm dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;margin:4px 0 0;font-size:13px}
.fm dt{font-family:"Cambria Math",Cambria,Georgia,serif;font-style:italic;text-align:right}.fm dd{margin:0}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px 16px;margin:8px 0}
.ctl label{font-size:13px;display:block;min-width:0}.ctl label b{font-variant-numeric:tabular-nums}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);min-width:0}
.stat .k{font-size:12px;color:var(--mute)}.stat .v{font-size:19px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}.stat .d{font-size:12px;color:var(--mute)}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}svg text:not([fill]){fill:var(--ink)}
.ill{font-size:11.5px;color:var(--bad);font-weight:600}
.bars .row{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 5.2em;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}
.bars .row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{height:14px;background:var(--soft);border-radius:3px;position:relative;overflow:hidden}
.bars .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bars .val{text-align:right;font-variant-numeric:tabular-nums}
.bars .row.hl .nm{font-weight:600}
.mist{border:1px solid var(--line);border-radius:8px;margin:6px 0;overflow:hidden}
.mist summary{cursor:pointer;padding:7px 12px;font-size:14px;list-style:none}
.mist summary::-webkit-details-marker{display:none}
.mist summary:before{content:"+";display:inline-block;width:1.2em;color:var(--acc);font-weight:600}
.mist[open] summary:before{content:"\2212"}
.mist .b{padding:0 12px 9px 30px;font-size:13.5px}
.split{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 10px;align-items:center;margin:8px 0;font-size:13px}.sb{display:flex;height:24px;border-radius:4px;overflow:hidden}.sb span{display:flex;align-items:center;padding:0 6px;color:var(--bg);font-size:12.5px;white-space:nowrap;overflow:hidden}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:7px 11px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.tabs button:hover{color:var(--ink)}
.tabs{flex-wrap:wrap}.tabsep{align-self:center;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);border-left:1px solid var(--line);padding:0 4px 0 10px;margin-left:6px}
.tabs button.deep{font-style:italic}
.deepnote{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13px;color:var(--mute)}.deepnote b{color:var(--ink)}
.tab[hidden]{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:6px 0}.seg button{font:inherit;font-size:13px;background:var(--bg);color:var(--mute);border:0;padding:5px 11px;cursor:pointer}.seg button.on{background:var(--acc2);color:var(--ink);font-weight:600}
.hmwrap{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px}
table.hm{border-collapse:collapse;font-size:12.5px;min-width:720px;width:100%}
table.hm th,table.hm td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:center}
table.hm thead th{font-weight:600;vertical-align:bottom;background:var(--soft)}table.hm thead th small,table.hm th.mh small{display:block;font-weight:400;color:var(--mute);font-size:11px}
table.hm th.mh{text-align:left;position:sticky;left:0;background:var(--bg);z-index:1;min-width:9.5em}table.hm thead th.mh{background:var(--soft)}
table.hm td.v{cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}table.hm td.v.on{outline:2px solid var(--ink);outline-offset:-2px}
table.hm td.na{color:var(--dim)}table.hm sup{font-size:9px;margin-left:1px}
.hmleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute)}
.q{color:var(--mute);font-size:12.5px}.mute{color:var(--mute)}ul.tight{margin:4px 0;padding-left:20px}ul.tight li{margin:3px 0;font-size:14px}
.chk{font-size:13px;margin:0 10px 0 4px;white-space:nowrap}.plot{margin:8px 0;overflow:hidden}.small{font-size:13px}.hmleg span{display:inline-flex;align-items:center}.hmleg svg{display:inline-block;margin-right:4px}
.foot{margin-top:30px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
#ovBars .row{grid-template-columns:minmax(0,12em) minmax(0,1fr) 6.6em;margin:5px 0}#ovBars .row .nm{white-space:normal;line-height:1.2}#ovBars .ml{display:block;font-size:11.5px;color:var(--mute)}
#ovBars .track{height:12px}
#pcBars .row{grid-template-columns:minmax(0,11em) minmax(0,1fr) 5.2em}a{color:var(--acc)}a:visited{color:var(--acc)}#s-over .bets{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
@media (max-width:520px){#ovBars .row{grid-template-columns:minmax(0,9em) minmax(0,1fr) 6.2em}h1{font-size:21px}.fm .eq{font-size:15px}.bars .row{grid-template-columns:minmax(0,8.6em) minmax(0,1fr) 4.4em;font-size:12px}.bars .row .nm{white-space:normal;line-height:1.2}}

/* ---- lab tabs (from Topic: rl's Estimator lab, scoped to .lbx) ---- */
/* Estimator lab. Every selector is scoped to .lbx; colours are the page's variables, so light and dark follow prefers-color-scheme. */
.lbx{--la:var(--c1);--lbb:var(--c2)}
.lbx .lb-jump{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.lbx .lb-jump a{font-size:12.5px;text-decoration:none;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.lbx .lb-jump a:hover{border-color:var(--acc);color:var(--acc)}
.lbx h2{scroll-margin-top:12px}
.lbx .lb-fig{font-size:12px;color:var(--mute);margin:-2px 0 6px}
.lbx .lb-v{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:0 8px;margin-right:6px;border:1px solid;white-space:nowrap}
.lbx .lb-v.y{color:var(--good);border-color:var(--good)}.lbx .lb-v.s{color:var(--acc);border-color:var(--acc)}.lbx .lb-v.p{color:var(--bad);border-color:var(--bad)}
.lbx .lb-sum td:first-child{white-space:nowrap}
.lbx .lb-sum td{font-size:13px}
.lbx .lb-tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0 2px}
.lbx .lb-tr .lb-pl{min-width:5.2em;font-weight:600}
.lbx .lb-tr label{font-size:13px;display:inline-flex;gap:5px;align-items:center}
.lbx .lb-tr select{padding:3px 6px}
.lbx .lb-tr .fn{font-size:12.5px;color:var(--mute);margin-left:auto;font-variant-numeric:tabular-nums}
.lbx .lb-scr{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);margin:2px 0 8px}
.lbx .lb-scr input{flex:1 1 auto;min-width:0}
.lbx .lb-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0}
.lbx .lb-two.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.lbx .lb-pan{border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.lbx .lb-pan.a{border-top:4px solid var(--la)}.lbx .lb-pan.b{border-top:4px solid var(--lbb)}
.lbx .lb-pan .hd{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;font-weight:600;margin-bottom:4px}
.lbx .lb-pan .hd select{font-size:12.5px;padding:2px 4px;max-width:100%;min-width:0;font-weight:400}
.lbx .lb-pan .st{font-size:12.5px;line-height:1.45;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin-top:4px}
.lbx .lb-pan .st b{font-weight:600}
.lbx .lb-pan svg{width:100%;height:auto}
.lbx .lb-gwg{max-width:300px;margin:0 auto}
.lbx .lb-cap{font-size:13px;border-left:3px solid var(--acc);padding:3px 0 3px 10px;margin:6px 0;min-height:2.9em;overflow-wrap:anywhere}
.lbx .lb-ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:8px 0;font-size:13px}
.lbx .lb-ctl label{display:inline-flex;gap:5px;align-items:center}
.lbx .lb-ctl select{padding:3px 6px}
.lbx .lb-ctl .seg{margin:0}
.lbx .lb-prog{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin:4px 0;flex:1 1 120px;min-width:80px}
.lbx .lb-prog i{display:block;height:100%;width:0;background:var(--acc)}
.lbx .lb-chart{min-width:0;margin:4px 0}
.lbx .lb-chart .t{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;margin:6px 0 0}
.lbx .lb-leg{display:flex;flex-wrap:wrap;gap:3px 6px;font-size:12px;color:var(--mute);margin:4px 0}
.lbx .lb-leg button{font-size:12px;padding:1px 8px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;background:var(--bg)}
.lbx .lb-leg button.off{opacity:.4}
.lbx .lb-leg i{display:inline-block;width:14px;height:0;border-top:2.5px solid;vertical-align:middle}
.lbx .lb-leg i.d{border-top-style:dashed}
.lbx .lb-chk{list-style:none;padding:0;margin:6px 0;font-size:13px}
.lbx .lb-chk li{display:grid;grid-template-columns:1.4em minmax(0,1fr);gap:4px;margin:4px 0}
.lbx .lb-chk .lb-ok{color:var(--good);font-weight:700}.lbx .lb-chk .lb-no{color:var(--bad);font-weight:700}.lbx .lb-chk .lb-in{color:var(--mute)}
.lbx .lb-note{font-size:12.5px;color:var(--mute)}
.lbx .lb-jb{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12.5px;color:var(--mute);margin:4px 0}
.lbx .lb-jb button{font-size:12px;padding:1px 8px}
.lbx details.lb-how{border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:0 12px}
.lbx details.lb-how summary{cursor:pointer;padding:7px 0;font-size:13.5px;font-weight:600}
.lbx details.lb-how>div{font-size:13.5px;padding-bottom:8px}
.lbx .lb-big{font-size:12px;color:var(--mute)}
@media (max-width:600px){
.lbx .lb-tr .fn{margin-left:0;width:100%}
.lbx .lb-pan{padding:6px}
.lbx .lb-pan .st{font-size:12px}
}

/* ---- Reading tab (from Topic: rl) ---- */
#t-read .nl{display:inline-block;font-style:normal;font-size:10.5px;line-height:1.35;font-weight:600;border-radius:4px;padding:0 4px;margin:0 2px;border:1px solid currentColor;vertical-align:1px;white-space:nowrap}
#t-read .nl.d{color:var(--c1)}#t-read .nl.i{color:var(--bad)}#t-read .nl.r{color:var(--c4)}#t-read .nl.u{color:var(--mute)}
#t-read .co.corr{border-left-color:var(--bad)}#t-read .co.corr .t{color:var(--bad)}
#t-read .an-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0}
#t-read .an-ctl input[type=range]{flex:1 1 120px;width:auto;min-width:0}
#t-read .an-ctl select{padding:3px 6px}#t-read .an-play{min-width:6.4em}
#t-read .an-cap{min-height:5.2em;border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:8px 0}
#t-read .an-cap .t{font-weight:600;font-size:14px}#t-read .an-cap p{margin:2px 0;font-size:13.5px}
#t-read .an-cnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:6px;margin:6px 0}
#t-read .an-cnt .stat .v{font-size:16px}
#t-read .leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:4px 0}
#t-read .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
#t-read .leg i.ln{height:3px;width:14px;border-radius:0}
#t-read .rd-svg{width:100%;overflow:hidden}
#t-read .rd-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
#t-read .rd-two>div{min-width:0}
#t-read .rd-ph{font-size:12px;color:var(--mute);font-weight:600;margin:6px 0 2px}
#t-read table.rd-t{font-size:13px}#t-read table.rd-t td,#t-read table.rd-t th{padding:5px 6px}
#t-read table.rd-t td:first-child{font-weight:600}
#t-read table.rd-t tr.lnk{cursor:pointer}#t-read table.rd-t tr.lnk:hover td{background:var(--soft)}
#t-read .rd-sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:6px 16px;margin:8px 0}
#t-read .rd-sl label{font-size:13px;display:block;min-width:0}
#t-read .rd-btns{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
#t-read .rd-btns button{font-size:12.5px;padding:3px 9px}
#t-read .rd-chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;font-size:12px}
#t-read .rd-chips span{border:1px solid var(--line);border-radius:99px;padding:0 8px;background:var(--bg)}
#t-read .rd-pred{border:1px dashed var(--acc);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13.5px}
#t-read .rd-pred .ans{margin-top:6px}
#t-read .rd-eqline{font-family:"Cambria Math","STIX Two Math",Cambria,Georgia,serif;font-size:15px;overflow-wrap:anywhere;padding:2px 0}
#t-read .rd-big{font-size:13.5px;margin:4px 0}
#t-read .rd-tree .q{font-weight:600;font-size:14px;margin:6px 0 4px}
