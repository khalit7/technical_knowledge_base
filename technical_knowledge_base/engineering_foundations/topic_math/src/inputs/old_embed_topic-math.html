<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KB visual</title>
<style>
:root{--bg:#fff;--ink:#2f3437;--mute:#787774;--line:#e9e9e7;--soft:#f7f6f3;--acc:#2f6fb5;--acc2:#dbe7f5;--good:#3f7f56;--bad:#c2703a;--dim:#d3d3d0;--hl:#fff3c4;--c1:#2f6fb5;--c2:#c2703a;--c3:#3f7f56;--c4:#8a5cb8;--c5:#b8983a;--c6:#3a9aa8}

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.w{max-width:920px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:23px;line-height:1.25;margin:0;letter-spacing:-.01em}.sub{color:var(--mute);font-size:13px;margin:3px 0 12px}
h2{font-size:18px;margin:30px 0 8px;line-height:1.3}h3{font-size:15px;margin:20px 0 6px}
p{margin:8px 0}a{color:var(--acc)}code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
code{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px}
b,strong{font-weight:600}.mute{color:var(--mute)}.small{font-size:12.5px}
ul,ol{margin:6px 0;padding-left:22px}li{margin:3px 0}
button,select,input,textarea{font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
button{cursor:pointer}button:hover{border-color:var(--mute)}button.on,button.pri{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button:disabled{opacity:.45;cursor:default}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc);width:100%}
input[type=checkbox]{accent-color:var(--acc)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 4px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:9px 12px 8px;color:var(--mute);white-space:nowrap;font-weight:500}
.tab.on{color:var(--ink);border-bottom-color:var(--acc);background:none}.tab.lock{opacity:.6}
.tab .lk{font-size:11px;margin-left:4px}
.pane{display:none;min-width:0}.pane.on{display:block}
.prog{height:3px;background:var(--line);border-radius:2px;margin:0 0 10px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
/* read */
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.toc a{font-size:12.5px;text-decoration:none;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.toc a.seen{border-color:var(--acc);color:var(--acc)}
.sec{scroll-margin-top:52px}
.fm{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;overflow-x:auto}
.fm .eq{font-family:"Cambria Math","Latin Modern Math","STIX Two Math",Cambria,Georgia,serif;font-size:18px;text-align:center;white-space:nowrap;padding:4px 0 8px;line-height:1.9}
.fm .lbl{font-size:12.5px;color:var(--mute);font-weight:600;margin-bottom:2px}
.fm dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 12px;margin:6px 0 0;font-size:13.5px}
.fm dt{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:15px;text-align:right}.fm dd{margin:0;color:var(--ink)}
.eq i,.fm dt i{font-style:italic}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}.fr>span:last-child{padding:0 3px}
.bigop{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1}
.bigop>span:nth-child(2){font-size:1.5em;line-height:1.05}.bigop>span:first-child,.bigop>span:last-child{font-size:.62em}
.co{border-left:3px solid var(--acc);background:var(--soft);padding:9px 12px;border-radius:0 6px 6px 0;margin:12px 0}
.co.warn{border-left-color:var(--bad)}.co.key{border-left-color:var(--good)}
.co .t{font-weight:600;font-size:13px;margin-bottom:2px}
.ex{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:12px 0}
.ex .t{font-weight:600;font-size:13.5px;color:var(--good)}
.ex ol{margin:6px 0}.ex .res{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:10px 0}
.two>div{min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px}.two h4{margin:0 0 4px;font-size:14px}
.tw{overflow-x:auto;margin:10px 0;max-width:100%}
table{border-collapse:collapse;font-size:13.5px;width:100%}
th{text-align:left;color:var(--mute);font-weight:500;border-bottom:1px solid var(--line);padding:6px 6px;vertical-align:bottom}
td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
th.sort{cursor:pointer;user-select:none;white-space:nowrap}
pre{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:10px 0}
figure{margin:12px 0}figcaption{font-size:12.5px;color:var(--mute);text-align:center;margin-top:4px}
svg{display:block;max-width:100%;height:auto}
svg text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}

.f-bg{fill:var(--bg)}.f-soft{fill:var(--soft)}.f-acc{fill:var(--acc)}.f-acc2{fill:var(--acc2)}.f-good{fill:var(--good)}.f-bad{fill:var(--bad)}.f-ink{fill:var(--ink)}.f-mute{fill:var(--mute)}.f-none{fill:none}.f-dim{fill:var(--dim)}
text.f-mute,.t-mute{fill:var(--mute)}
.rv{border:1px dashed var(--acc);border-radius:8px;padding:10px 12px;margin:12px 0}
.rv .q{font-weight:600}.rv .a{display:none;margin-top:6px}.rv.open .a{display:block}
.take{background:var(--acc2);border-radius:8px;padding:12px 16px;margin:24px 0 10px}.take h2{margin:0 0 6px;font-size:16px}
.done{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 0}
.skip{font-size:12.5px;color:var(--mute);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
.lockmsg{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:18px;text-align:center;margin:20px 0}
/* widgets */
.card{border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0;min-width:0}
.card>h3:first-child{margin-top:0}.card .intro{color:var(--mute);font-size:13.5px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:12.5px;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:2px 10px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.ctl{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;min-width:0}.ctl label{font-size:12.5px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}.ctl label b{color:var(--ink)}
.ctls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px 16px;margin:8px 0}
.panel{background:var(--soft);border-radius:8px;padding:10px 12px;margin:10px 0;min-height:40px;font-size:14px}
.panel h4{margin:0 0 4px;font-size:14.5px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;font-size:13.5px}.kv>div:nth-child(odd){color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;margin:8px 0}
.tile{background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0}.tile b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile span{color:var(--mute);font-size:12px;display:block;line-height:1.3}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;cursor:default}.item h4{margin:0 0 2px;font-size:14.5px}.item .meta{font-size:12px;color:var(--mute)}
.item.click{cursor:pointer}.item.click:hover{border-color:var(--acc)}.item.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:5px;white-space:nowrap;transform:translate(-50%,-115%);display:none;z-index:9}
.rel{position:relative}
.node{cursor:pointer}.node rect,.node circle{transition:fill .15s,stroke .15s}
.node:hover rect,.node:hover circle{stroke:var(--acc);stroke-width:2}
.node.sel rect,.node.sel circle{stroke:var(--acc);stroke-width:2.5;fill:var(--acc2)}
.node.dim,.edge.dim{opacity:.28}.node.lit rect,.node.lit circle{fill:var(--hl);stroke:var(--bad);stroke-width:2.5}
.edge.lit line,.edge.lit path{stroke:var(--bad);stroke-width:2.5}
.code{font:12.5px/1.65 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 0;overflow-x:auto}
.code div{padding:0 12px;white-space:pre}.code div.cur{background:var(--hl)}.code .ln{color:var(--mute);display:inline-block;width:2.2em;user-select:none}
.fc{border:1px solid var(--line);border-radius:10px;min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;cursor:pointer;font-size:16px;background:var(--soft)}
.fc.back{background:var(--acc2)}
.mcq{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0}.mcq .q{font-weight:600;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;margin:4px 0;background:var(--bg)}.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--bg))}.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg))}
.why{font-size:13.5px;color:var(--mute);margin-top:4px;display:none}.mcq.ans .why{display:block}
.score{font-weight:600}
.res{margin:8px 0}.res .rt{font-weight:600}.res .rm{font-size:12.5px;color:var(--mute)}
.hm{display:grid;gap:1px;font-size:11.5px;margin:6px 0;min-width:0}
.hm .c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:2px;min-width:0;overflow:hidden;cursor:pointer}
.hm .h{display:flex;align-items:center;justify-content:flex-end;padding-right:4px;white-space:nowrap;overflow:hidden;color:var(--mute);min-width:0}
.hm .hc{writing-mode:vertical-rl;transform:rotate(180deg);justify-content:flex-start;padding:4px 0 0;display:flex;align-items:flex-start;color:var(--mute);overflow:hidden;white-space:nowrap}
.hm .h.on,.hm .hc.on{color:var(--ink);font-weight:600}
.toks{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.tok{padding:2px 6px;border-radius:4px;border:1px solid var(--line);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;cursor:pointer}
.tok.on{outline:2px solid var(--acc)}
.log{font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border-radius:6px;padding:6px 10px;max-height:160px;overflow:auto}
.search{width:100%;margin:4px 0 8px}
.hidden{display:none!important}
.narrow{display:none}@media (max-width:600px){.narrow{display:block}}
.fig svg{width:100%;height:auto}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:2px 0 4px}.lg i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
@media (max-width:560px){body{font-size:14.5px}.fm .eq{font-size:16px}h1{font-size:20px}}

const DATA = (() => {
const I = x => `<i>${x}</i>`;
const FR = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const U = id => 'https://app.notion.com/p/3c65c17b0d0d' + id;
const LA = U('81d89c26e1dab2fcb701'), PS = U('815f9a47d613409b5a0c'), CO = U('81eb8b49ed6a0f897f3b'), IT = U('81c6baf3f778a62e14e5'),

const cols = [
  ['Linear algebra', ['Vector spaces, norms, rank', 'Eigen, SVD, QR, Cholesky;', 'condition number', 'Low-rank: LoRA, MLA, GaLore', 'Layout, Jacobians, einsum']],
  ['Probability and statistics', ['Bernoulli to BCE,', 'categorical to softmax CE', 'Gaussian to MSE, Laplace', 'to L1, Poisson', 'MLE vs MAP vs Bayesian', 'Bias-variance, paired tests,', 'CLT, concentration']],

return {
id: "topic-math",
title: "Topic: math",
subtitle: "Built from the page as of 2026-09-30 · the four areas of maths behind ML, what each buys you, the two objects they share, and where every question is answered",
read: [
 { h: "What this page is", blocks: [
  { text: "A refresh-and-reference map of the mathematics behind ML: **linear algebra**, **probability and statistics**, **calculus and optimisation**, and **information theory**. Depth lives in the four deep dives; this page is the index, and the home of the two objects the four areas share: **cross-entropy** and **curvature**." },
  { type: "callout", title: "About the video on the page", text: "The page carries a narrated 7-minute explainer, made on 22 September 2026. It does not cover the two worked examples of the shared objects, the short answers to the flagged questions, or How it connects." }
 ] },
 { h: "The taxonomy", blocks: [
  { type: "svg", svg: taxSvg, caption: "The page's taxonomy diagram: four areas and the subjects under each.", minWidth: 620 }
 ] },
 { h: "What each area buys you", blocks: [
  { text: "Four areas, each earning its place for a different reason, and two objects they turn out to share, which have a section of their own below." },
  { type: "h3", text: "Linear algebra: the notation" },
  { text: "Every model is written in it: a layer is a matrix, an attention head a pair of contractions, a batch one more axis. Four ideas pay off daily." },
  { type: "list", items: [
   "**Rank**: how many independent directions a map actually uses. Fine-tuning updates have low intrinsic rank, which is exactly what LoRA exploits; low-rank KV compression (multi-head latent attention, MLA) and low-rank gradient projection (GaLore) use the same factorisation through a narrow bottleneck.",
   "**The SVD**, via Eckart-Young, turns truncation from guesswork into arithmetic.",
   "**The condition number** is the single number that predicts whether an optimisation problem will be a long narrow valley.",
   "**Layout conventions** (numerator versus denominator) are why a gradient written in a paper and the gradient autograd hands you are transposes of each other."] },
  { type: "h3", text: "Probability and statistics: why this loss, and is the gain real" },
  { text: "Choose a distribution for *p*(*y* | *x*), take the negative log-likelihood, and the standard loss falls out. That one move answers \"why this loss\" every time, and because these are **proper scoring rules** whose optimum is the true conditional probability, it is also what makes calibration a meaningful thing to ask about." },
  { type: "list", items: [
   "**MLE, MAP and Bayesian** are the three things you can do with a likelihood; every \"loss plus regulariser\" is already MAP, whether you say so or not.",
   "The statistics half keeps evals honest: **paired tests** and **bootstrap confidence intervals** on benchmark deltas, and the 1/√*n* shrinkage of error bars that decides whether a claimed one-point gain on a 500-example eval is real at all."] },
  { type: "h3", text: "Calculus and optimisation: the mechanics of training" },
  { type: "two", cols: [
   { title: "First order: backprop", text: "Reverse-mode automatic differentiation never materialises a Jacobian and only asks each op for a **vector-Jacobian product**. So a backward pass costs roughly **twice** a forward one, and stored activations, not FLOPs, are the binding constraint that activation checkpointing exists to relieve." },
   { title: "Second order: the Hessian", text: "Gradient descent diverges above a learning rate of **2/λ_{max}**; ill-conditioning is what normalisation layers and good init are really fixing; Adam's second moment is a crude diagonal curvature proxy (closer to the diagonal of the empirical Fisher than of the Hessian, and not a Newton step); XGBoost's leaf weights are literal per-leaf **Newton steps**." }] },
  { text: "**Convexity** marks which guarantees survive, and **Lagrange multipliers** are the machinery behind KL-constrained policy updates such as TRPO and behind reading a regularisation penalty as a norm-ball constraint." },
  { type: "h3", text: "Information theory: the measurement layer" },
  { type: "list", items: [
   "**Cross-entropy** is the training objective read as a code length: what you pay when the code was built for your model but the data came from reality.",
   "**KL divergence** is the gap, so the loss floors at the data's own entropy rather than at zero.",
   "**Perplexity** is tokenizer-dependent and cannot be compared across models with different vocabularies; **bits-per-byte** is the tokenizer-free unit used in scaling-law work.",

 ] },
 { h: "What only shows with all four in view", blocks: [
  { type: "callout", kind: "key", title: "Cross-entropy is one object wearing four hats", text: "A maximum-likelihood estimator (probability), a code length (information theory), the quantity whose gradient collapses to *p* − *y* (calculus), and, as an *N*-way softmax over a single positive, the contrastive objective **InfoNCE**." },
  { type: "example", title: "Worked example: one set of logits, four hats", setup: "Logits *z* = (2, 1, 0) over classes A, B, C, with A correct. *e*^{z} = (7.389, 2.718, 1), summing to 11.107, so the softmax gives *p* = (0.665, 0.245, 0.090).", steps: [
   "**Probability.** Model the label as a categorical draw. The negative log-likelihood of A is −ln 0.665 = 0.408 nats; minimising its average over a dataset is maximum-likelihood estimation.",
   "**Information theory.** Divided by ln 2 it is 0.588 bits, the length of A's codeword in a code built from *p*. Averaged over real data it is the cross-entropy: the data's entropy plus the KL divergence from data to model.",

  { type: "formula", label: "Softmax and the InfoNCE bound", html: `${I('p')}<sub>${I('k')}</sub> = ${FR(`${I('e')}<sup>${I('z')}<sub>${I('k')}</sub></sup>`, `∑<sub>${I('j')}</sub> ${I('e')}<sup>${I('z')}<sub>${I('j')}</sub></sup>`)}, &nbsp;&nbsp; ${I('I')} ≥ ln ${I('N')} − ${I('L')}<sub>NCE</sub>`, where: [
   [`${I('z')}<sub>${I('k')}</sub>`, "the logit (raw score) of class k"], [`${I('p')}<sub>${I('k')}</sub>`, "its softmax probability"], [`1<sub>A</sub>`, "the one-hot vector of the true class"], [`${I('N')}`, "the number of InfoNCE candidates: the positive plus the negatives"], [`${I('I')}`, "the mutual information between the two views"], [`${I('L')}<sub>NCE</sub>`, "the InfoNCE loss"]] },
  { type: "callout", kind: "key", title: "Curvature is one object read three ways", text: "The **Hessian** of a loss, the **condition number** of a matrix, and the **Fisher information** of a model." },
  { type: "list", items: [
   "The **condition number** is the ratio of the Hessian's largest to smallest eigenvalue: it sets how slowly gradient descent crosses a long narrow valley, while the largest eigenvalue alone sets the 2/λ_{max} learning-rate limit.",
   "The **Fisher information** is the expected curvature of a model's negative log-likelihood, equivalently the variance of its **score** (the gradient of the log-likelihood).",
   "For the canonical losses (sigmoid with BCE, softmax with CE, identity with MSE) the Hessian with respect to the logit **does not depend on the label**, so it equals its own expectation, the Fisher. That is why natural-gradient methods and K-FAC can precondition with the Fisher in place of the Hessian, and why the curvature of TRPO's KL constraint is the Fisher matrix."] },
  { type: "formula", label: "A Bernoulli's curvature, three ways", html: `${FR(`∂<sup>2</sup>${I('L')}`, `∂${I('z')}<sup>2</sup>`)} = ${I('p')}(1 − ${I('p')}) = Var(${I('y')}) = Var(${I('y')} − ${I('p')})`, where: [
   [`${I('L')}`, "binary cross-entropy on the logit"], [`${I('z')}`, "the logit"], [`${I('p')} = σ(${I('z')}) = 1/(1 + ${I('e')}<sup>−${I('z')}</sup>)`, "the sigmoid of the logit"], [`${I('y')} ∈ {0, 1}`, "the label"], [`${I('y')} − ${I('p')}`, "the score: the derivative of the log-likelihood y ln p + (1 − y) ln(1 − p) with respect to z"]],
   note: "Left to right: the Hessian, the Bernoulli variance, and the Fisher information (the variance of the score)." },
  { type: "example", title: "Worked example: a Bernoulli's curvature", setup: "Binary cross-entropy on a logit *z*, with *p* = σ(*z*).", steps: [
   "At *z* = 0 (*p* = 0.5), all three are 0.25, the largest they get.",
   "At *z* = ln 9 = 2.197 (*p* = 0.9), all three are 0.09."],
   result: "A confident prediction sits in a flat direction of the loss." },
  { type: "reveal", q: "Change the label from 1 to 0 at a fixed logit. What happens to the loss's curvature?", a: "Nothing. The loss curve becomes its mirror image, but the second derivative p(1 − p) does not involve y. That label-independence is exactly why the Hessian equals its own expectation, the Fisher." },

 { h: "Flagged questions, answered where", blocks: [
  { type: "list", items: [
   `**Independent vs dependent variables.** Two unrelated meanings. In experimental design the independent variable is what you set (the features *x*) and the dependent one what you measure (the target *y*); in probability, *X* and *Y* are independent when *P*(*X*, *Y*) = *P*(*X*)*P*(*Y*), and features and target must be dependent in that sense for learning to be possible. [Probability and statistics for ML](${PS}), section "Independent vs dependent variables", right after the definitions.`,
   `**What is entropy?** The expected surprise *H*(*X*) = −∑ *p*(*x*) log *p*(*x*), and the shortest average code length any lossless code can achieve: 1 bit for a fair coin, about 0.47 bits for a coin that lands heads 90% of the time. [Information theory for ML](${IT}), first section.`,
   `**Bernoulli and classification.** A single yes/no trial with *P*(*Y* = 1) = *p*; a sigmoid classifier models *y* | *x* as Bernoulli, and its negative log-likelihood is binary cross-entropy. [Probability and statistics for ML](${PS}), section "Bernoulli and binary classification".`,
   `**Differentiation of each cost function.** For MSE with an identity output, BCE with a sigmoid and CE with a softmax, the gradient with respect to the logit is prediction minus target (times 2/*n* for the MSE average). [Calculus and optimisation for ML](${CO}), section "Differentiation of each cost function".`,
   `**Second-order differentiation.** The Hessian, the matrix of second derivatives, which gives Newton's step −*H*^{−1}*g*, XGBoost's leaf weights −*G*/(*H* + λ) and the condition number. [Calculus and optimisation for ML](${CO}), section "Second-order differentiation".`] }
 ] },

takeaways: [
 "Linear algebra is the notation; its daily words are rank, the SVD, the condition number and layout conventions.",
 "Probability makes the loss a consequence: choose p(y | x), take the negative log-likelihood. Statistics makes an eval delta honest.",
 "Calculus is the mechanics: backprop is VJPs at about twice a forward pass; the Hessian sets the 2/λ_{max} limit and the valley's shape.",
 "Information theory is the measurement layer: cross-entropy is a code length, KL the removable part, bits-per-byte the tokenizer-free unit.",
 "Cross-entropy wears four hats and curvature has three readings; which area to reach for is a diagnosis."
],
glossary: [
 { term: "Rank", def: "How many independent directions a linear map actually uses." },
 { term: "SVD", def: "Singular value decomposition; with Eckart-Young, the best rank-k approximation keeps the k largest singular values." },
 { term: "Condition number", def: "The ratio of the largest to smallest eigenvalue of the Hessian: how elongated the valley is, and how slowly gradient descent crosses it." },
 { term: "Layout conventions", def: "Numerator versus denominator layout; why a paper's gradient and autograd's are transposes of each other." },
 { term: "LoRA", def: "Low-rank adaptation: a fine-tuning update constrained to low rank, exploiting its low intrinsic rank." },
 { term: "MLA", def: "Multi-head latent attention: low-rank KV compression through a narrow bottleneck." },
 { term: "GaLore", def: "Low-rank gradient projection, the same factorisation applied to gradients." },
 { term: "Proper scoring rule", def: "A loss whose optimum is the true conditional probability, which makes calibration meaningful." },
 { term: "MLE, MAP, Bayesian", def: "The three things to do with a likelihood: maximise it, maximise it times a prior, or keep the whole posterior. Loss plus regulariser is MAP." },
 { term: "Paired test, bootstrap", def: "Ways to put an honest error bar on a benchmark delta between two models scored on the same examples." },
 { term: "VJP", def: "Vector-Jacobian product: what reverse mode asks each op for, never building the Jacobian." },
 { term: "Activation checkpointing", def: "Storing only some activations and recomputing the rest, to relieve the backward pass's memory." },
 { term: "Hessian", def: "The matrix of second derivatives of the loss; its eigenvalues are curvatures." },
 { term: "Fisher information", def: "The expected curvature of the negative log-likelihood, equivalently the variance of the score." },
 { term: "Score", def: "The gradient of the log-likelihood; for a Bernoulli on a logit it is y − p." },
 { term: "Cross-entropy", def: "The training loss read as a code length built for the model when the data comes from reality." },
 { term: "KL divergence", def: "The gap between cross-entropy and the data's entropy; forward KL covers modes, reverse KL seeks one." },
 { term: "Perplexity", def: "exp of the cross-entropy per token; tokenizer-dependent." },
 { term: "Bits-per-byte", def: "Cross-entropy per byte in bits; the tokenizer-free unit." },
 { term: "InfoNCE", def: "An N-way softmax cross-entropy over one positive; lower-bounds mutual information by ln N minus the loss." }
],

 cards: [
  { q: "Why does fine-tuning with LoRA work, in linear-algebra terms?", a: "Fine-tuning updates have low intrinsic rank, so an update constrained to low rank loses little. MLA and GaLore use the same factorisation through a narrow bottleneck." },
  { q: "What single number predicts a long narrow valley?", a: "The condition number: the ratio of the Hessian's largest to smallest eigenvalue." },
  { q: "Why is a paper's gradient sometimes the transpose of autograd's?", a: "Layout conventions: numerator versus denominator layout. Autograd returns the gradient in the shape of the parameter." },
  { q: "Where does a standard loss come from?", a: "Choose a distribution for p(y | x) and take the negative log-likelihood: Bernoulli gives BCE, categorical softmax CE, Gaussian MSE." },
  { q: "Why is calibration a meaningful thing to ask of these losses?", a: "They are proper scoring rules: their optimum is the true conditional probability." },
  { q: "Which of MLE, MAP and Bayesian is 'loss plus regulariser'?", a: "MAP: the regulariser is the log of a prior." },
  { q: "Why is a backward pass about twice a forward pass, and what runs out first?", a: "Reverse mode asks each op for vector-Jacobian products without building Jacobians; the stored activations, not FLOPs, are the binding constraint." },
  { q: "Above what learning rate does gradient descent diverge?", a: "2/λ_{max}, where λ_{max} is the Hessian's largest eigenvalue." },
  { q: "Is Adam a second-order method?", a: "No. Its second moment is a crude diagonal curvature proxy, closer to the empirical Fisher's diagonal than the Hessian's, and not a Newton step." },
  { q: "Why does the loss not go to zero?", a: "Cross-entropy is the data's entropy plus the KL from data to model; only the KL can be removed." },
  { q: "Why can two models' perplexities not be compared across tokenizers?", a: "Per-token cross-entropy changes when the tokens change; bits-per-byte is the tokenizer-free unit." },
  { q: "What are the four hats of cross-entropy?", a: "A maximum-likelihood estimator, a code length, the quantity whose gradient is p − y, and, as an N-way softmax over one positive, InfoNCE." },
  { q: "For BCE on a logit, why does the Hessian equal the Fisher information?", a: "The second derivative p(1 − p) does not depend on the label, so it equals its own expectation over the label, which is the Fisher." },
  { q: "A fine-tune barely moved anything. Which area, which word?", a: "Linear algebra, and the word is rank." }
 ],

<script>
/* ===== PAGE CUSTOM WIDGETS (optional): CUSTOM.name = (el, props, K) => { ... }; reads its numbers from props or DATA ===== */
const CUSTOM = {};
/* Custom widgets for "Topic: math".
   fourhats: three logits and a true class; the one cross-entropy number read as a negative log-likelihood (probability),
             a code length in bits (information theory), a gradient p - 1_y (calculus) and an InfoNCE loss with its
             lower bound on mutual information (contrastive learning).
   curv3:    binary cross-entropy on a logit; its second derivative (by finite difference), the Bernoulli variance and the
             Fisher information (as an expectation over the label) computed three separate ways, with the label switchable. */

const TM = {
  sig: z => 1 / (1 + Math.exp(-z)),
  tile(K, label) { const b = K.h('b'); const t = K.h('div', { class: 'tile' }, b, K.h('span', { text: label })); t.set = v => b.textContent = v; return t; },
  num(v, d = 3) { if (!isFinite(v)) return '-'; const s = (+v.toFixed(d)).toFixed(d); return s.replace('-', '−'); },
  signed(v, d = 3) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d); }
};

// ---------- 1. one set of logits, four hats ----------
CUSTOM.fourhats = (el, o, K) => {
  const names = o.names || ['A', 'B', 'C'];
  const z = (o.z || [2, 1, 0]).slice(); let y = o.y ?? 0;
  const ctls = K.h('div', { class: 'ctls' });
  z.forEach((v, k) => ctls.append(K.slider({ label: `Logit of ${names[k]}`, min: -4, max: 6, step: 0.1, value: v, fmt: v => K.fmt(v, 1), onInput: v => { z[k] = +v; run(); } })));
  ctls.append(K.h('div', { class: 'ctl' }, K.h('label', null, K.h('span', { text: 'Correct class (the positive)' })), K.seg(names.map((n, k) => [k, n]), y, v => { y = +v; run(); })));
  const tiles = K.h('div', { class: 'tiles' });
  const T = { L: TM.tile(K, 'Cross-entropy L = −ln p(correct), nats'), b: TM.tile(K, 'Same number in bits, L / ln 2'), s: TM.tile(K, 'Sum of the gradient components'), I: TM.tile(K, 'InfoNCE bound ln 3 − L, nats') };
  Object.values(T).forEach(t => tiles.append(t));
  const mk = (title) => { const body = K.h('div'); const note = K.h('div', { class: 'small', style: 'margin-top:6px' }); const box = K.h('div', { class: 'panel', style: 'margin:0' }, K.h('h4', { text: title }), body, note); return { box, body, note }; };
  const P = mk('1. Probability: a categorical model'), C = mk('2. Information theory: a code built from p'), G = mk('3. Calculus: the gradient on the logits'), N = mk('4. Contrastive learning: InfoNCE with N = 3');
  const grid = K.h('div', { class: 'grid2', style: 'margin-top:8px' }, P.box, C.box, G.box, N.box);
  const read = K.h('div', { class: 'panel' });
  el.append(ctls, tiles, grid, read);
  function run() {
    const m = Math.max(...z), e = z.map(v => Math.exp(v - m)), S = e.reduce((a, b) => a + b, 0), p = e.map(v => v / S);
    const L = -Math.log(p[y]), bits = L / Math.LN2, g = p.map((v, k) => v - (k === y ? 1 : 0)), bound = Math.log(3) - L;
    const gs = g.reduce((a, b) => a + b, 0);
    T.L.set(TM.num(L)); T.b.set(TM.num(bits)); T.s.set(Math.abs(gs) < 1e-12 ? '0' : TM.num(gs, 6)); T.I.set(TM.num(bound));
    K.barChart(P.body, { bars: p.map((v, k) => ({ label: `${names[k]}${k === y ? ' ✓' : ''}`, value: v, color: k === y ? '--good' : null })), max: 1, yfmt: v => TM.num(v) });
    P.note.innerHTML = K.md(`The negative log-likelihood of ${names[y]} is −ln ${TM.num(p[y])} = **${TM.num(L)}** nats. Minimising its average over a dataset is maximum-likelihood estimation.`);
    const cl = p.map(v => -Math.log2(v));
    K.barChart(C.body, { bars: cl.map((v, k) => ({ label: `${names[k]}${k === y ? ' ✓' : ''}`, value: v, color: k === y ? '--good' : null })), max: Math.max(4, ...cl), yfmt: v => TM.num(v, 2) + ' bits' });
    C.note.innerHTML = K.md(`An optimal code built from p gives class k about −log_{2} p_{k} bits. The correct class costs **${TM.num(bits)}** bits, the same number as the loss divided by ln 2. Averaged over real data this is the cross-entropy: the data's entropy plus the KL divergence from data to model.`);
    K.barChart(G.body, { bars: g.map((v, k) => ({ label: `${names[k]}${k === y ? ' ✓' : ''}`, value: Math.abs(v), color: v < 0 ? '--good' : '--bad', note: v < 0 ? '(−)' : '(+)' })), max: 1, yfmt: v => TM.num(v) });
    G.note.innerHTML = K.md(`p − 1_{${names[y]}} = (${g.map(v => TM.signed(v)).join(', ')}): prediction minus the one-hot target (✓ marks the correct class). Green is negative, so descent pushes that logit **up**; orange logits are pushed down by the probability each one took. The components sum to zero.`);
    N.body.innerHTML = '';
    const ceil = Math.log(3);
    K.barChart(N.body, { bars: [{ label: 'ln 3', value: ceil }, { label: 'loss L', value: L, color: '--bad' }, { label: 'ln 3 − L', value: Math.max(0, bound), color: '--good' }], max: Math.max(ceil, L), yfmt: v => TM.num(v) });
    N.note.innerHTML = K.md(bound > 0
      ? `Read ${names[y]} as an anchor's positive and the other two as negatives with these similarity scores. The same ${TM.num(L)} is the InfoNCE loss, and it certifies a mutual information of at least ln 3 − ${TM.num(L)} = **${TM.num(bound)}** nats. Even a perfect scorer (L = 0) certifies at most ln 3 = ${TM.num(ceil)}.`
      : `The loss ${TM.num(L)} is above ln 3 = ${TM.num(ceil)}, so the bound ln 3 − L is negative and certifies nothing: the scorer ranks the positive worse than a uniform guess.`);
    read.innerHTML = K.md(`One number, L = ${TM.num(L)}, and four readings of it. Move a logit: all four change together, because they are one computation. Start state: the page's worked example, logits (2, 1, 0) with A correct.`);
  }
  run();
};

// ---------- 2. curvature three ways, on a Bernoulli ----------
CUSTOM.curv3 = (el, o, K) => {
  let z = o.z ?? 0, y = o.y ?? 1;
  const ctls = K.h('div', { class: 'ctls' });
  ctls.append(
    K.slider({ label: 'Logit z', min: -6, max: 6, step: 0.1, value: z, fmt: v => K.fmt(v, 1), onInput: v => { z = +v; run(); } }),
    K.h('div', { class: 'ctl' }, K.h('label', null, K.h('span', { text: 'Observed label y' })), K.seg([[0, 'y = 0'], [1, 'y = 1']], y, v => { y = +v; run(); })));
  const tiles = K.h('div', { class: 'tiles' });
  const T = { p: TM.tile(K, 'p = σ(z)'), L: TM.tile(K, 'BCE loss for this label'), H: TM.tile(K, 'Hessian: finite-difference ∂²L/∂z²'), V: TM.tile(K, 'Variance of a Bernoulli(p) label'), F: TM.tile(K, 'Fisher: E[(y − p)²] over y ~ Bernoulli(p)') };
  Object.values(T).forEach(t => tiles.append(t));
  const chart = K.h('div'); const chart2 = K.h('div', { style: 'margin-top:6px' }); const read = K.h('div', { class: 'panel' });
  el.append(ctls, tiles, chart, chart2, read);
  const bce = (zz, yy) => { const a = Math.max(zz, 0); return a - yy * zz + Math.log1p(Math.exp(-Math.abs(zz))); };
  const xs = [...Array(121)].map((_, i) => -6 + i * 0.1);
  let c = null;
  const series = () => [
    { name: `BCE loss, y = ${y}`, points: xs.map(x => [x, Math.min(bce(x, y), 3)]) },
    { name: `BCE loss, y = ${1 - y}`, points: xs.map(x => [x, Math.min(bce(x, 1 - y), 3)]), dash: '2 4' }];
  const series2 = () => [{ name: 'curvature ∂²L/∂z² = p(1 − p), the same for either label', points: xs.map(x => { const p = TM.sig(x); return [x, p * (1 - p)]; }) }];
  let c2 = null;
  function run() {
    const p = TM.sig(z), h = 1e-3;
    const H = (bce(z + h, y) - 2 * bce(z, y) + bce(z - h, y)) / (h * h);
    const V = p * (1 - p);
    const F = p * Math.pow(1 - p, 2) + (1 - p) * Math.pow(0 - p, 2);
    T.p.set(TM.num(p)); T.L.set(TM.num(bce(z, y))); T.H.set(TM.num(H, 4)); T.V.set(TM.num(V, 4)); T.F.set(TM.num(F, 4));
    const marks = [{ x: z, label: 'z' }];
    if (!c) c = K.lineChart(chart, { series: series(), xlabel: 'logit z', ylabel: 'loss (capped at 3)', ymin: 0, ymax: 3, marks, height: 190 });
    else { c.opts.marks = marks; c.set(series()); }
    if (!c2) c2 = K.lineChart(chart2, { series: series2(), xlabel: 'logit z', ylabel: 'curvature', ymin: 0, ymax: 0.3, marks, height: 170 });
    else { c2.opts.marks = marks; c2.set(series2()); }
    read.innerHTML = K.md(`Three different computations, one number: **${TM.num(V, 4)}**. The Hessian comes from differencing the loss itself, the variance from the Bernoulli formula, the Fisher from averaging the squared score (y − p)² over both labels. Switch the label: the loss curve flips to its mirror image, but its curvature at z does not change, which is why it equals its own expectation. ${Math.abs(z) < 0.05 ? 'At z = 0 the curvature is 0.25, its largest value.' : Math.abs(z) > 3 ? 'This prediction is confident, so the loss is nearly flat here.' : ''}`);
  }
  run();
};

</script>
