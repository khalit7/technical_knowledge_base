# promtool test rules slo_rules_test.yml   (passes with promtool 3.15.0)
# 600 requests a minute. Three clean days (so the 3-day window is full), then 10 minutes in which
# 15% of requests fail (the SRE workbook's figure 5-6), then two clean hours.
rule_files: [slo_rules.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="chat-api", status="200"}'
        values: '0+600x4319 2592000+510x9 2597100+600x119'
      - series: 'http_requests_total{job="chat-api", status="503"}'
        values: '0x4319 0+90x9 900x119'
    alert_rule_test:
      - eval_time: 3d5m
        alertname: ChatApiErrorBudgetBurn
        exp_alerts: []
      - eval_time: 3d6m
        alertname: ChatApiErrorBudgetBurn
        exp_alerts: 
          - exp_labels: {severity: page, job: chat-api}
            exp_annotations:
              summary: "chat-api is burning its 30-day error budget fast"
              runbook_url: "https://runbooks.example.internal/chat-api/error-budget-burn"
      - eval_time: 3d13m
        alertname: ChatApiErrorBudgetBurn
        exp_alerts: 
          - exp_labels: {severity: page, job: chat-api}
            exp_annotations:
              summary: "chat-api is burning its 30-day error budget fast"
              runbook_url: "https://runbooks.example.internal/chat-api/error-budget-burn"
      - eval_time: 3d14m
        alertname: ChatApiErrorBudgetBurn
        exp_alerts: []
      - eval_time: 3d2h
        alertname: ChatApiErrorBudgetBurn
        exp_alerts: []
