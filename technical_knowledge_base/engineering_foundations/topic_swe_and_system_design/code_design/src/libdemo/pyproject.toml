[project]
name = "chatsummary"
version = "0.3.0"
description = "Title and summarise chat transcripts with any LLM (demo package for the Code design page)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "C901", "PLR0911", "PLR0912", "ANN"]

[tool.mypy]
strict = true
