// Version 2 of GenerateRequest, for the schema-evolution runs: adds a field (safe) under the same message name.
syntax = "proto3";
package llm.v2;

message Message {
  string role = 1;
  string content = 2;
}

message GenerateRequest {
  string model = 1;
  repeated Message messages = 2;
  uint32 max_tokens = 3;
  bool stream = 4;
  float temperature = 5;        // new in v2: old readers keep it as an unknown field
  repeated uint32 stop_token_ids = 6;  // packed by default in proto3
}

// The mistake: field 3 reused with a different type after max_tokens was "deleted".
message GenerateRequestBad {
  string model = 1;
  repeated Message messages = 2;
  string max_tokens_note = 3;   // WRONG: number 3 used to be uint32 max_tokens
  bool stream = 4;
}
