[package]
name = "tok"
version = "0.1.0"
edition = "2024"
description = "Part 3 of the Rust page: the root's token counter as a CLI (tokcount) and an HTTP service (tokserve)"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# Size experiments (Packaging section): each profile builds the same code.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.release-small]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[profile.release-strip]
inherits = "release"
strip = true
