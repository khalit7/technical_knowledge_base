[project]
name = "tokrs"
version = "0.1.0"
description = "count_tokens from the Rust page, Part 2: a PyO3 extension built step by step"
requires-python = ">=3.10"
dependencies = ["numpy>=2"]

[tool.maturin]
module-name = "tokrs"
