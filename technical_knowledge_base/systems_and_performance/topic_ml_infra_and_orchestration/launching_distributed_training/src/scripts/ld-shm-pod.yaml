apiVersion: v1
kind: Pod
metadata: {name: ld-shm, namespace: mi}
spec:
  restartPolicy: Never
  containers:
  - name: c
    image: mi-train:1
    imagePullPolicy: IfNotPresent
    command: ["sh","-c","echo default; df -h /dev/shm | tail -1; echo with-emptyDir; df -h /dshm | tail -1; echo memlock $(ulimit -l); ls /sys/class/net | tr '\\n' ' '"]
    resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
    volumeMounts: [{name: dshm, mountPath: /dshm}]
  volumes:
  - name: dshm
    emptyDir: {medium: Memory, sizeLimit: 1Gi}
