# Four independent shards (say, four evaluation tasks) as one Indexed Job. Index 2 always fails.
# backoffLimitPerIndex gives every index its own retry budget, so one bad shard cannot use up the others'.
apiVersion: batch/v1
kind: Job
metadata: {name: km-e4a, namespace: km}
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimitPerIndex: 1
  maxFailedIndexes: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: shard
        image: mi-train:1
        imagePullPolicy: Never
        command: ["sh", "-c", "sleep 3; if [ $JOB_COMPLETION_INDEX = 2 ]; then echo shard 2 is broken; exit 3; fi; echo shard $JOB_COMPLETION_INDEX done"]
        resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {memory: 64Mi}}
