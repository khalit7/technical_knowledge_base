# A leader and two workers as one Indexed Job. successPolicy: the Job has succeeded as soon as index 0
# (the leader) succeeds; the workers, which would otherwise run for 300 s, are then terminated.
apiVersion: batch/v1
kind: Job
metadata: {name: km-e4b, namespace: km}
spec:
  completions: 3
  parallelism: 3
  completionMode: Indexed
  successPolicy:
    rules:
    - succeededIndexes: "0"
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: mi-train:1
        imagePullPolicy: Never
        command: ["sh", "-c", "if [ $JOB_COMPLETION_INDEX = 0 ]; then sleep 5; echo leader finished; else sleep 300; fi"]
        resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {memory: 64Mi}}
