# kube-scheduler configuration used for the page's scoring runs (16 Oct 2026), then removed.
# Two profiles in one scheduler: a pod picks one with spec.schedulerName.
#   default-scheduler: the defaults (NodeResourcesFit LeastAllocated on cpu and memory, weight 1 each)
#   km-binpack:        NodeResourcesFit MostAllocated, counting the fake GPUs with weight 5
apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
clientConnection:
  kubeconfig: /etc/kubernetes/scheduler.conf
leaderElection:
  leaderElect: true
profiles:
- schedulerName: default-scheduler
- schedulerName: km-binpack
  pluginConfig:
  - name: NodeResourcesFit
    args:
      scoringStrategy:
        type: MostAllocated
        resources:
        - {name: cpu, weight: 1}
        - {name: memory, weight: 1}
        - {name: example.com/gpu, weight: 5}
