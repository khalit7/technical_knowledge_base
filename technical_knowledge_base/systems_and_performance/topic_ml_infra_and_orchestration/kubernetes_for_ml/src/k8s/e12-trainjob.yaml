# The running example as a Kubeflow Trainer v2 TrainJob (trainer.kubeflow.org/v1alpha1, Trainer v2.3.0).
# The ClusterTrainingRuntime torch-distributed (Trainer's own, from manifests/base/runtimes) holds the
# JobSet template; the TrainJob says only what differs: image, command, nodes, processes, resources.
# Trainer's controller builds a JobSet from the two and injects torchrun's PET_* variables.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata: {name: km-tj, namespace: km}
spec:
  runtimeRef: {name: torch-distributed}
  trainer:
    image: mi-train:1
    numNodes: 2
    numProcPerNode: 2
    command: ["torchrun", "/opt/mi/train.py", "--ckpt-dir=/tmp/ckpt", "--log-dir=/tmp/logs"]
    resourcesPerNode:
      requests: {cpu: 500m, memory: 400Mi, example.com/gpu: "2"}
      limits: {cpu: "2", memory: 900Mi, example.com/gpu: "2"}
