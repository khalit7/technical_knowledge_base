# The restarted job lands on another node (here forced with a nodeSelector) and asks for the same volume.
apiVersion: v1
kind: Pod
metadata: {name: km-reader, namespace: km}
spec:
  restartPolicy: Never
  nodeSelector: {kubernetes.io/hostname: mi-kind-worker3}
  containers:
  - name: r
    image: mi-train:1
    imagePullPolicy: Never
    command: ["sh", "-c", "cat /ckpt/latest"]
    resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {memory: 64Mi}}
    volumeMounts: [{name: ckpt, mountPath: /ckpt}]
  volumes:
  - name: ckpt
    persistentVolumeClaim: {claimName: km-ckpt}
