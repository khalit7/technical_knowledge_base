# Priority classes for the preemption run. A pod's priority decides its place in the scheduling queue and
# whether the scheduler may evict lower-priority pods to make room (preemptionPolicy).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: km-low}
value: 100
description: "preemptible research jobs"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: km-high}
value: 1000
description: "production training: may preempt km-low"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: km-high-nopreempt}
value: 1000
preemptionPolicy: Never
description: "high priority in the queue, but never evicts anyone"
