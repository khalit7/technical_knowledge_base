# A second pod asking for the same: only two 80Gi devices exist and the first pod holds both.
apiVersion: v1
kind: Pod
metadata: {name: km-dra-pod2, namespace: km}
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  resourceClaims:
  - name: gpus
    resourceClaimTemplateName: km-two-big-gpus
  containers:
  - name: main
    image: mi-train:1
    imagePullPolicy: Never
    command: ["sleep", "30"]
    resources:
      requests: {cpu: 50m, memory: 32Mi}
      limits: {memory: 64Mi}
      claims: [{name: gpus}]
