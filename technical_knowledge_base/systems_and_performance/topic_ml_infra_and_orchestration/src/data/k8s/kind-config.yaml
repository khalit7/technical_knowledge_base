# kind cluster mi-kind: 1 control plane + 3 workers (Kubernetes v1.37.0, kind v0.33.0).
# SHARED_DIR is replaced by up.sh with a host folder mounted at /shared on every node (checkpoints and logs
# of the running example, hostPath volumes in pods): it stands in for a shared file system.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mi-kind
nodes:
- role: control-plane
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
- role: worker
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  labels: {mi.example.com/block: b1}
  extraMounts: [{hostPath: SHARED_DIR, containerPath: /shared}]
- role: worker
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  labels: {mi.example.com/block: b1}
  extraMounts: [{hostPath: SHARED_DIR, containerPath: /shared}]
- role: worker
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  labels: {mi.example.com/block: b2}
  extraMounts: [{hostPath: SHARED_DIR, containerPath: /shared}]
