# Kueue objects for the running example: one ResourceFlavor, one ClusterQueue with quota for the whole
# cluster's workers (in cohort mi-cohort so labs can add borrowing queues), one LocalQueue in namespace mi.
apiVersion: v1
kind: Namespace
metadata: {name: mi}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: default-flavor}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: mi-cq}
spec:
  cohortName: mi-cohort
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources: ["cpu", "memory", "example.com/gpu"]
    flavors:
    - name: default-flavor
      resources:
      - {name: cpu, nominalQuota: 4}
      - {name: memory, nominalQuota: 3Gi}
      - {name: example.com/gpu, nominalQuota: 12}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: mi-lq, namespace: mi}
spec: {clusterQueue: mi-cq}
