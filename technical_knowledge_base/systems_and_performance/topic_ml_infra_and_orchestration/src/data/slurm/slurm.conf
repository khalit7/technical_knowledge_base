# slurm.conf of the mi Slurm cluster (Slurm 24.11.5 from Debian 13 "trixie", in containers).
# One controller (ctl: slurmctld + slurmdbd + MariaDB) and three compute nodes (c1-c3), configless:
# slurmd fetches this file from slurmctld (slurmd --conf-server ctl).
# Change it live: docker cp slurm.conf mi-slurm-ctl:/etc/slurm/slurm.conf && docker exec mi-slurm-ctl scontrol reconfigure
ClusterName=mi
SlurmctldHost=ctl
SlurmctldParameters=enable_configless
SlurmUser=slurm
AuthType=auth/munge
CredType=cred/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info
MpiDefault=none
# No cgroups inside these containers: processes are tracked by parent pid and nothing is confined.
# On a real cluster: ProctrackType=proctrack/cgroup, TaskPlugin=task/cgroup,task/affinity.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
ReturnToService=2
# Failure detection kept short so the Failure lab sees it in seconds (defaults: 120 s and 300 s).
SlurmctldTimeout=30
SlurmdTimeout=30
InactiveLimit=0
KillWait=5
MinJobAge=600
MessageTimeout=10
JobRequeue=1

# Scheduling: backfill over a priority-ordered queue; seconds-scale jobs, so a 1 s time resolution.
SchedulerType=sched/backfill
SchedulerParameters=bf_interval=2,bf_resolution=1,bf_continue,bf_window=60,sched_min_interval=500000
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
GresTypes=gpu

# Fairshare usage is billed in GPU-equivalents: 1 per fake GPU, 0.25 per CPU (TRESBillingWeights on each partition).
# Priority: multifactor, dominated by fairshare; usage decays with a 10-minute half-life (default 7 days)
# so a lab can watch it move.
PriorityType=priority/multifactor
PriorityDecayHalfLife=00:10:00
PriorityCalcPeriod=1
PriorityMaxAge=00:10:00
PriorityWeightFairshare=10000
PriorityWeightAge=1000
PriorityWeightJobSize=0
PriorityWeightPartition=0
PriorityWeightQOS=0

# Preemption: a job in a higher PriorityTier partition (urgent) requeues jobs of a lower one (batch).
PreemptType=preempt/partition_prio
PreemptMode=REQUEUE

# Accounting (needed for fairshare and sacct).
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=ctl
AccountingStorageTRES=gres/gpu
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5
JobCompType=jobcomp/none

# Nodes: 4 CPUs and 4 FAKE "gpu" GRES each (count-only: no device files, no CUDA_VISIBLE_DEVICES).
# RealMemory is declared, not enforced (each container is capped by Docker instead).
NodeName=c[1-3] CPUs=4 Sockets=1 CoresPerSocket=4 ThreadsPerCore=1 RealMemory=4000 Gres=gpu:4 State=UNKNOWN
PartitionName=batch  Nodes=c[1-3] Default=YES MaxTime=60 State=UP PriorityTier=1 TRESBillingWeights="CPU=0.25,GRES/gpu=1.0"
PartitionName=urgent Nodes=c[1-3] MaxTime=60 State=UP PriorityTier=10 PreemptMode=OFF TRESBillingWeights="CPU=0.25,GRES/gpu=1.0"
