# FAKE GPUs. Slurm ignores a gpu GRES without device files, so each node's entrypoint creates four empty
# placeholder files /dev/mi_gpu0..3 (not devices; nothing can run on them). Slurm then schedules, accounts and
# hands out gres/gpu exactly as for real GPUs, including CUDA_VISIBLE_DEVICES in the job's environment.
AutoDetect=off
NodeName=c[1-3] Name=gpu File=/dev/mi_gpu[0-3]
