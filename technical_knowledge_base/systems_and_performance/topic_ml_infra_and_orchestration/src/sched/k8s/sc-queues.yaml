# The Scheduling lab's Kueue objects (Kueue v0.20.2 serves only kueue.x-k8s.io/v1beta2).
# sc-lq: a LocalQueue in namespace sc that feeds the shared ClusterQueue mi-cq (12 fake GPUs of quota).
# sc-cq-a and sc-cq-b: two teams with 6 fake GPUs each in cohort sc-cohort; each may borrow the other's
# unused quota, and reclaims its own by preempting the borrower (reclaimWithinCohort: Any).
apiVersion: v1
kind: Namespace
metadata: {name: sc}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: sc-lq, namespace: sc}
spec: {clusterQueue: mi-cq}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: sc-cq-a}
spec:
  cohortName: sc-cohort
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  preemption: {reclaimWithinCohort: Any, withinClusterQueue: Never}
  resourceGroups:
  - coveredResources: ["cpu", "memory", "example.com/gpu"]
    flavors:
    - name: default-flavor
      resources:
      - {name: cpu, nominalQuota: 2}
      - {name: memory, nominalQuota: 2Gi}
      - {name: example.com/gpu, nominalQuota: 6}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: sc-cq-b}
spec:
  cohortName: sc-cohort
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  preemption: {reclaimWithinCohort: Any, withinClusterQueue: Never}
  resourceGroups:
  - coveredResources: ["cpu", "memory", "example.com/gpu"]
    flavors:
    - name: default-flavor
      resources:
      - {name: cpu, nominalQuota: 2}
      - {name: memory, nominalQuota: 2Gi}
      - {name: example.com/gpu, nominalQuota: 6}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: sc-lq-a, namespace: sc}
spec: {clusterQueue: sc-cq-a}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: sc-lq-b, namespace: sc}
spec: {clusterQueue: sc-cq-b}
