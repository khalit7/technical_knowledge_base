  // ---- DOM ----
  const el = (t, a, h) => { const e = document.createElement(t); if (a) for (const k in a) e.setAttribute(k, a[k]); if (h != null) e.innerHTML = h; return e };
  const btn = el('button', {id:'kbAskBtn', type:'button', 'aria-haspopup':'dialog', title:'Ask Claude a question about this page'}, 'Ask Claude');
  const selBtn = el('button', {id:'kbAskSel', type:'button', hidden:''}, 'Ask about this');
  const P = el('div', {id:'kbAsk', role:'dialog', 'aria-label':'Ask Claude about this page', hidden:''});
  P.innerHTML = `<div class="ka-ah"><b>Ask Claude about this page</b><button type="button" data-a="new" title="Start a new conversation">New</button><button type="button" data-a="set" title="API key and model">Settings</button><button type="button" data-a="close" title="Close (Esc)" aria-label="Close">&#x2715;</button></div>
<div class="ka-am" aria-live="polite"></div>
<div class="ka-set" hidden></div>
<div class="ka-af"><div class="ka-quote" hidden><blockquote></blockquote><button type="button" title="Remove the quoted passage" aria-label="Remove the quoted passage">&#x2715;</button></div>
<textarea rows="2" placeholder="Ask about anything on this page. Enter sends, Shift+Enter adds a line."></textarea>
<div class="ka-row"><span class="ka-sp"></span><button type="button" class="ka-send">Ask</button></div></div>`;
  document.body.append(btn, selBtn, P);
  const $ = s => P.querySelector(s);
  const msgs = $('.ka-am'), setv = $('.ka-set'), foot = $('.ka-af'), ta = $('textarea'), send = $('.ka-send'), qbox = $('.ka-quote'), meta = $('.ka-row .ka-sp');

  // ---- page text: every tab, in order, headings marked; frozen at the first question so the cache prefix stays identical ----
  const SKIP = /^(SCRIPT|STYLE|SVG|CANVAS|BUTTON|SELECT|INPUT|TEXTAREA|NAV|TEMPLATE|NOSCRIPT)$/;
  const BLOCK = /^(P|DIV|LI|UL|OL|SECTION|ARTICLE|DETAILS|SUMMARY|FIGURE|FIGCAPTION|TABLE|TR|PRE|BLOCKQUOTE|H[1-6]|BR|HR|DL|DT|DD|ASIDE|HEADER|FOOTER|MAIN)$/;
  function walk(n, out){
    if (n.nodeType === 3) { out.push(n.nodeValue); return }
    if (n.nodeType !== 1) return;
    const t = n.tagName.toUpperCase();
    if (SKIP.test(t) || n.id === 'jsErr' || n.id === 'kbAsk' || n.getAttribute('aria-hidden') === 'true') return;
    const b = BLOCK.test(t);
    if (b) out.push('\n');
    if (/^H[1-6]$/.test(t)) out.push('#'.repeat(+t[1]) + ' ');
    if (t === 'LI') out.push('- ');
    if (t === 'SUP') out.push('^'); else if (t === 'SUB') out.push('_');
    for (const c of n.childNodes) walk(c, out);
    if (t === 'TD' || t === 'TH') out.push(' | ');
    if (b) out.push('\n');
  }
  const clean = s => s.replace(/[ \t ]+/g, ' ').split('\n').map(l => l.trim()).filter((l, i, a) => l || (a[i - 1] && a[i - 1].trim())).join('\n').trim();
  const tabName = tab => { const b = tab && document.querySelector('[role=tab][data-t="' + tab.id + '"]'); return b ? b.textContent.trim() : '' };
  let PAGE = null;
  function pageText(){
    if (PAGE) return PAGE;
    const root = document.querySelector('.w') || document.body, parts = [];
    const tabs = [...root.querySelectorAll('.tab')];
    const head = []; for (const c of root.childNodes) { if (c.nodeType === 1 && (c.classList.contains('tab') || c.querySelector && c.querySelector('.tab'))) break; walk(c, head) }
    parts.push(clean(head.join('')));
    if (tabs.length) for (const t of tabs) { const o = []; walk(t, o); parts.push('=== Tab: ' + (tabName(t) || t.id) + ' ===\n' + clean(o.join(''))) }
    else { const o = []; walk(root, o); parts[0] = clean(o.join('')) }
    PAGE = 'Title: ' + document.title + '\n' + (/^https?:/.test(location.protocol) ? 'Address: ' + location.href.split('#')[0] + '\n' : '') + '\n' + parts.filter(Boolean).join('\n\n');
    if (PAGE.length > 600000) PAGE = PAGE.slice(0, 600000) + '\n[page text cut here: the page is longer than the panel sends]';
    return PAGE;
  }
  function where(node){
    const e = node && (node.nodeType === 1 ? node : node.parentElement); if (!e) return '';
    const tab = e.closest('.tab'); let h = null;
    const hs = [...(tab || document).querySelectorAll('h2,h3')];
    for (const x of hs) { if (x.compareDocumentPosition(e) & Node.DOCUMENT_POSITION_FOLLOWING || x.contains(e)) h = x; else break }
    return [tabName(tab) && 'tab "' + tabName(tab) + '"', h && 'section "' + h.textContent.trim().replace(/\s+/g, ' ') + '"'].filter(Boolean).join(', ');
  }
  const openTab = () => { const b = document.querySelector('[role=tab][aria-selected=true]'); return b ? b.textContent.trim() : '' };

  const SYSTEM = `You answer questions from the reader of one page of a personal technical knowledge base (interactive explainer pages on AI/ML and systems). The page's full text is below between <page> tags; figures, labs and animations are not included, only their surrounding text and captions. The reader reads to understand deeply in the least time, not to memorise.
- Answer from the page first, and say where on the page the answer is (tab and section) when that helps the reader find it.
- When the answer needs knowledge the page does not contain, use general knowledge, but start that paragraph with "Beyond this page:". If you are not sure of something, say so. Never invent numbers, citations or results.
- If the reader's question rests on a misreading of the page, say so gently and correct it.
- Lead with the answer, then the reasoning. Keep it short; use a tiny worked example or real numbers when that makes it click.
- Format: short paragraphs and lists, **bold** sparingly, \`code\` for code and tensor shapes, fenced blocks for longer code. Write maths in plain text with Unicode (√, ·, ×, ², ᵀ, softmax(QKᵀ/√d)), never LaTeX. No tables. Do not use em dashes.`;

  // ---- markdown-lite renderer for answers (escapes everything first) ----
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?=[^*\w]|$)/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  function md(s){
    const L = s.split('\n'), out = []; let i = 0, para = [], list = null;
    const flushP = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = [] } };
    const flushL = () => { if (list) { out.push('<' + list.t + '>' + list.i.map(x => '<li>' + inline(x) + '</li>').join('') + '</' + list.t + '>'); list = null } };
    while (i < L.length) {
      const l = L[i];
      if (/^```/.test(l)) { flushP(); flushL(); const c = []; i++; while (i < L.length && !/^```/.test(L[i])) c.push(L[i++]); out.push('<pre><code>' + esc(c.join('\n')) + '</code></pre>'); i++; continue }
      let m;
      if ((m = l.match(/^#{1,6}\s+(.*)/))) { flushP(); flushL(); out.push('<h4>' + inline(m[1]) + '</h4>') }
      else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = {t:'ul', i:[]} } list.i.push(m[1]) }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = {t:'ol', i:[]} } list.i.push(m[1]) }
      else if (!l.trim()) { flushP(); flushL() }
      else if (list && /^\s{2,}\S/.test(l)) list.i[list.i.length - 1] += ' ' + l.trim();
      else { flushL(); para.push(l) }
      i++;
    }
    flushP(); flushL(); return out.join('');
  }

  // ---- conversation state ----
  let history = [], quote = null, busy = null;
  function setQuote(q){
    quote = q; qbox.hidden = !q;
    if (q) qbox.querySelector('blockquote').textContent = q.text.length > 600 ? q.text.slice(0, 600) + '…' : q.text;
  }
  qbox.querySelector('button').onclick = () => setQuote(null);
  function hint(){
    if (history.length || msgs.querySelector('.ka-q')) return;
    msgs.innerHTML = store.get('key')
      ? '<p class="ka-hint">Ask anything about this page. To ask about a passage, select it on the page and press <b>Ask about this</b>. Answers come from the page first; anything from beyond it is marked.</p>'
      : '<p class="ka-hint">To ask questions here, add a Claude API key in <a href="#" data-a="set">Settings</a>. It stays in this browser only.</p>';
  }
  function showSettings(on){
    setv.hidden = !on; msgs.hidden = on; foot.hidden = on;
    if (!on) { hint(); return }
    const k = store.get('key');
    setv.innerHTML = `<label for="kbAskKey">Claude API key</label>
<input id="kbAskKey" type="password" autocomplete="off" spellcheck="false" placeholder="${k ? 'saved (ending ' + esc(k.slice(-4)) + ')' : 'sk-ant-...'}">
<div class="ka-row"><button type="button" class="ka-send" data-a="save">Save</button>${k ? '<button type="button" data-a="forget">Forget key</button>' : ''}<span class="ka-sp"></span><button type="button" data-a="back">Back</button></div>
<p>Create one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer">console.anthropic.com</a>; API use is billed per question, separately from a Claude subscription. Setting a monthly spend limit there is a good idea.</p>
<p>The key is saved only in this browser for this site. Each question sends this page's text and your question from your browser straight to api.anthropic.com; nothing goes anywhere else.</p>
<label for="kbAskModel">Model</label><select id="kbAskModel">${Object.keys(MODELS).map(m => '<option value="' + m + '"' + (m === model() ? ' selected' : '') + '>' + MODELS[m].name + ' ($' + MODELS[m].in + ' in, $' + MODELS[m].out + ' out per million tokens)</option>').join('')}</select>`;
    setv.querySelector('select').onchange = e => { store.set('model', e.target.value); history = []; msgs.innerHTML = ''; meta.textContent = '' };
    setv.querySelector('input').focus();
  }
  P.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a) return; e.preventDefault();
    const act = a.dataset.a;
    if (act === 'close') close();
    else if (act === 'set') showSettings(setv.hidden);
    else if (act === 'back') showSettings(false);
    else if (act === 'new') { if (busy) busy.abort(); history = []; msgs.innerHTML = ''; meta.textContent = ''; setQuote(null); showSettings(false); ta.focus() }
    else if (act === 'save') { const v = setv.querySelector('input').value.trim(); if (v) store.set('key', v); showSettings(false); ta.focus() }
    else if (act === 'forget') { store.set('key', null); showSettings(true) }
  });
  setv.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); setv.querySelector('[data-a=save]').click() } });

  let lastFocus = null;
  function open(){ lastFocus = document.activeElement; P.hidden = false; btn.hidden = true; selBtn.hidden = true; if (!store.get('key')) showSettings(true); else { showSettings(false); ta.focus() } }
  function close(){ P.hidden = true; btn.hidden = false; if (lastFocus && lastFocus.focus) lastFocus.focus() }
  btn.onclick = open;
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !P.hidden) close() });

  // ---- "Ask about this" on a text selection in the page ----
  let selTimer = 0;
  function onSel(){
    clearTimeout(selTimer);
    selTimer = setTimeout(() => {
      const s = window.getSelection(), txt = s && String(s).trim();
      if (!txt || txt.length < 3 || !s.rangeCount) { selBtn.hidden = true; return }
      const r = s.getRangeAt(0), host = r.commonAncestorContainer, he = host.nodeType === 1 ? host : host.parentElement;
      if (!he || P.contains(he) || he.closest('input,textarea,select,button') || !(document.querySelector('.w') || document.body).contains(he)) { selBtn.hidden = true; return }
      const b = r.getBoundingClientRect();
      selBtn.hidden = false;
      const w = selBtn.offsetWidth;
      selBtn.style.left = Math.max(8, Math.min(window.scrollX + b.left + b.width / 2 - w / 2, window.scrollX + document.documentElement.clientWidth - w - 8)) + 'px';
      selBtn.style.top = (window.scrollY + b.bottom + 8) + 'px';
      selBtn._q = {text: txt.slice(0, 4000), where: where(host)};
    }, 180);
  }
  document.addEventListener('selectionchange', onSel);
  selBtn.addEventListener('mousedown', e => e.preventDefault());
  selBtn.onclick = () => { const q = selBtn._q; selBtn.hidden = true; if (!q) return; if (P.hidden) open(); else showSettings(false); setQuote(q); ta.focus() };

  // ---- sending, streaming ----
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask() } });
  send.onclick = () => busy ? busy.abort() : ask();
  const cents = (u, m) => { const p = MODELS[m]; if (!p || !u) return ''; const c = ((u.input_tokens || 0) * p.in + (u.cache_creation_input_tokens || 0) * p.write + (u.cache_read_input_tokens || 0) * p.read + (u.output_tokens || 0) * p.out) / 1e4; return '≈ ' + (c < 1 ? c.toFixed(2) : c.toFixed(1)) + '¢' };
  const kt = n => n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n || 0);
  let spent = 0;

  async function ask(){
    const q = ta.value.trim(); if (!q && !quote) return;
    const key = store.get('key'); if (!key) { showSettings(true); return }
    if (msgs.querySelector('.ka-hint')) msgs.innerHTML = '';
    const ctx = ['The reader has the tab "' + openTab() + '" open.'];
    if (quote) ctx.push('They selected this passage' + (quote.where ? ' (in ' + quote.where + ')' : '') + ':\n<selection>\n' + quote.text + '\n</selection>');
    const text = ctx.join('\n') + '\n\nQuestion: ' + (q || 'Explain the selected passage.');
    const qe = el('div', {class:'ka-q'}); if (quote) qe.appendChild(el('blockquote', null, esc(quote.text.length > 300 ? quote.text.slice(0, 300) + '…' : quote.text)));
    qe.appendChild(document.createTextNode(q || 'Explain the selected passage.')); msgs.appendChild(qe);
    const ae = el('div', {class:'ka-a'}, '<p class="ka-hint">Thinking…</p>'); msgs.appendChild(ae); msgs.scrollTop = msgs.scrollHeight;
    ta.value = ''; setQuote(null);
    const turn = {role:'user', content:text};
    const m = model(), ctl = new AbortController(); busy = ctl; send.textContent = 'Stop';
    const blocks = [], usage = {}; let answer = '', stop = null, gotText = false, pinned = true;
    const onScroll = () => { pinned = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 40 }; msgs.addEventListener('scroll', onScroll);
    const paint = () => { ae.innerHTML = md(answer); if (pinned) msgs.scrollTop = msgs.scrollHeight };
    try {
      const res = await fetch(API, {method:'POST', signal:ctl.signal, headers:{
          'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true', 'anthropic-beta':'server-side-fallback-2026-07-01'},
        body: JSON.stringify({model:m, max_tokens:16000, stream:true, output_config:{effort:'medium'}, fallbacks:'default',
          system:[{type:'text', text:SYSTEM}, {type:'text', text:'<page>\n' + pageText() + '\n</page>', cache_control:{type:'ephemeral'}}],
          messages:history.concat([turn])})});
      if (!res.ok) {
        let msg = res.status + ' ' + res.statusText; try { const j = await res.json(); msg = (j.error && j.error.message) || msg } catch(e) {}
        throw new Error(res.status === 401 ? 'The API key was not accepted (' + msg + '). Check it in Settings.' : res.status === 429 ? 'Rate limited or out of credit: ' + msg : msg);
      }
      const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const {value, done} = await rd.read(); if (done) break;
        buf += dec.decode(value, {stream:true});
        let k; while ((k = buf.indexOf('\n\n')) >= 0) {
          const evt = buf.slice(0, k); buf = buf.slice(k + 2);
          const data = evt.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('');
          if (!data) continue; let d; try { d = JSON.parse(data) } catch(e) { continue }
          if (d.type === 'message_start') Object.assign(usage, d.message.usage || {});
          else if (d.type === 'content_block_start') blocks[d.index] = JSON.parse(JSON.stringify(d.content_block));
          else if (d.type === 'content_block_delta') {
            const b = blocks[d.index], x = d.delta; if (!b) continue;
            if (x.type === 'text_delta') { b.text = (b.text || '') + x.text; answer += x.text; gotText = true; paint() }
            else if (x.type === 'thinking_delta') b.thinking = (b.thinking || '') + x.thinking;
            else if (x.type === 'signature_delta') b.signature = x.signature;
          }
          else if (d.type === 'message_delta') { if (d.delta && d.delta.stop_reason) stop = d.delta.stop_reason; Object.assign(usage, d.usage || {}) }
          else if (d.type === 'error') throw new Error((d.error && d.error.message) || 'stream error');
        }
      }
      if (!gotText) ae.innerHTML = '';
      if (stop === 'refusal') ae.insertAdjacentHTML('beforeend', '<p class="ka-err">Claude declined to answer this one.</p>');
      else if (stop === 'max_tokens') ae.insertAdjacentHTML('beforeend', '<p class="ka-err">The answer hit its length limit and was cut off.</p>');
      history.push(turn, {role:'assistant', content:blocks.filter(Boolean)});
    } catch(e) {
      if (e.name === 'AbortError') { ae.insertAdjacentHTML('beforeend', '<p class="ka-hint">Stopped.</p>'); if (gotText) history.push(turn, {role:'assistant', content:[{type:'text', text:answer}]}) }
      else { ae.innerHTML = '<p class="ka-err">' + esc(String(e.message || e)) + '</p>' + (/fetch|network/i.test(String(e.message)) ? '<p class="ka-hint">The request did not reach the API (offline, or blocked by an extension or network filter).</p>' : '') }
    } finally {
      busy = null; send.textContent = 'Ask'; msgs.removeEventListener('scroll', onScroll);
      const c = cents(usage, m);
      if (usage.output_tokens) {
        spent += parseFloat(c.slice(2)) || 0;
        ae.appendChild(el('div', {class:'ka-meta'}, esc(MODELS[m].name + ' · ' + kt((usage.input_tokens || 0) + (usage.cache_creation_input_tokens || 0) + (usage.cache_read_input_tokens || 0)) + ' tokens in (' + kt(usage.cache_read_input_tokens) + ' cached), ' + kt(usage.output_tokens) + ' out · ' + c)));
        meta.textContent = 'This conversation ≈ ' + spent.toFixed(1) + '¢';
      }
      if (pinned) msgs.scrollTop = msgs.scrollHeight;
    }
  }
}
})();
</script><!--/kb-ask-->
