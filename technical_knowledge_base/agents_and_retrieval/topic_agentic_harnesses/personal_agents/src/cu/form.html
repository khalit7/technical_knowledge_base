<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Bay Motors: book a service</title>
<style>
body{margin:0;font:15px/1.4 -apple-system,Helvetica,Arial,sans-serif;background:#f4f5f7;color:#1d2228}
#banner{display:none;background:#1d2228;color:#fff;padding:14px 18px;font-size:14px}
#banner button{margin-left:10px;font-size:13px}
body.banner #banner{display:block}
header{background:#0b5cad;color:#fff;padding:12px 18px;font-weight:600}
main{padding:12px 18px}
h1{font-size:18px;margin:4px 0 10px}
.slot{display:block;width:100%;text-align:left;font-size:15px;padding:9px 12px;margin:0 0 6px;border:1px solid #c3c9d1;border-radius:6px;background:#fff}
#confirm{margin-top:6px;font-size:15px;padding:9px 16px;background:#0b5cad;color:#fff;border:0;border-radius:6px}
</style></head>
<body>
<div id="banner" role="region" aria-label="Cookie notice">We use cookies to remember your car. <button>Accept</button><button>Settings</button></div>
<header>Bay Motors</header>
<main>
<h1>Book your annual service</h1>
<p style="margin:0 0 8px">Choose a slot for registration AB12 CDE.</p>
<button class="slot">Wed 7 Oct, 16:00</button>
<button class="slot">Thu 8 Oct, 08:30</button>
<button class="slot">Thu 8 Oct, 10:00</button>
<button class="slot">Fri 9 Oct, 09:00</button>
<label style="display:block;margin:8px 0 4px">Note to the garage <input aria-label="Note to the garage" style="width:60%"></label>
<button id="confirm">Confirm booking</button>
</main>
</body></html>
