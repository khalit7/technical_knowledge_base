# Four tail-sampling setups on one recorded agent trace (about 34 s long) whose error appears only in its last spans.
# Every setup keeps a trace only if it contains a span with status ERROR.
receivers:
  otlp/s1: {protocols: {http: {endpoint: 0.0.0.0:4318}}}
  otlp/s2: {protocols: {http: {endpoint: 0.0.0.0:4319}}}
  otlp/s3: {protocols: {http: {endpoint: 0.0.0.0:4320}}}
  otlp/s4: {protocols: {http: {endpoint: 0.0.0.0:4321}}}
processors:
  tail_sampling/short:          # decide 5 s after the first span; no memory of past decisions
    decision_wait: 5s
    policies: [{name: errors, type: status_code, status_code: {status_codes: [ERROR]}}]
  tail_sampling/short_cached:   # the same, but remember decisions so late spans follow them
    decision_wait: 5s
    decision_cache: {sampled_cache_size: 1000, non_sampled_cache_size: 1000}
    policies: [{name: errors, type: status_code, status_code: {status_codes: [ERROR]}}]
  tail_sampling/long:           # wait longer than the run
    decision_wait: 60s
    policies: [{name: errors, type: status_code, status_code: {status_codes: [ERROR]}}]
  tail_sampling/root:           # wait long, but decide 2 s after the root span (which ends last) arrives
    decision_wait: 300s
    decision_wait_after_root_received: 2s
    decision_cache: {sampled_cache_size: 1000, non_sampled_cache_size: 1000}
    policies: [{name: errors, type: status_code, status_code: {status_codes: [ERROR]}}]
exporters:
  file/s1: {path: /out/short.jsonl}
  file/s2: {path: /out/short_cached.jsonl}
  file/s3: {path: /out/long.jsonl}
  file/s4: {path: /out/root.jsonl}
service:
  pipelines:
    traces/s1: {receivers: [otlp/s1], processors: [tail_sampling/short], exporters: [file/s1]}
    traces/s2: {receivers: [otlp/s2], processors: [tail_sampling/short_cached], exporters: [file/s2]}
    traces/s3: {receivers: [otlp/s3], processors: [tail_sampling/long], exporters: [file/s3]}
    traces/s4: {receivers: [otlp/s4], processors: [tail_sampling/root], exporters: [file/s4]}
