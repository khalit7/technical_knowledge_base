model_list:
  - model_name: primary
    litellm_params:
      model: openai/flaky-model
      api_base: http://127.0.0.1:8095/v1
      api_key: fake
      timeout: 8
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
  - model_name: backup
    litellm_params:
      model: openai/mlx-community/Qwen3-4B-Instruct-2507-4bit
      api_base: http://127.0.0.1:8096/v1
      api_key: local
      timeout: 120
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
litellm_settings:
  num_retries: 2
  request_timeout: 120
router_settings:
  fallbacks: [{"primary": ["backup"]}]
  allowed_fails: 3
  cooldown_time: 30
general_settings:
  master_key: sk-local-demo  # a throwaway key for a proxy on 127.0.0.1
  database_url: postgresql://afops:afops@127.0.0.1:55432/litellm
