model_list:
  - model_name: chat
    litellm_params:
      model: openai/fake-A
      api_base: http://127.0.0.1:8601/v1
      api_key: fake
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
  - model_name: slow
    litellm_params:
      model: openai/fake-C
      api_base: http://127.0.0.1:8603/v1
      api_key: fake
      timeout: 5
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
  - model_name: local
    litellm_params:
      model: openai/mlx-community/Qwen3-4B-Instruct-2507-4bit
      api_base: http://127.0.0.1:8611/v1
      api_key: local
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
  - model_name: local-lmstudio
    litellm_params:
      model: lm_studio/mlx-community/Qwen3-4B-Instruct-2507-4bit
      api_base: http://127.0.0.1:8611/v1
      api_key: local
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
litellm_settings:
  num_retries: 2
  request_timeout: 120
  cache: true
  cache_params:
    type: local
    supported_call_types: ["acompletion", "completion"]
general_settings:
  master_key: sk-fgw-local-demo  # throwaway key for a proxy on 127.0.0.1
  database_url: postgresql://fgw:fgw@127.0.0.1:55533/litellm
