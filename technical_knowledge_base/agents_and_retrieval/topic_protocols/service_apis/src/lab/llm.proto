// The running example's internal call: the API front door (REST + SSE outside) asks an inference
// service for tokens over gRPC. Field numbers are the contract; names never travel on the wire.
syntax = "proto3";
package llm.v1;

message Message {
  string role = 1;
  string content = 2;
}

message GenerateRequest {
  string model = 1;
  repeated Message messages = 2;
  uint32 max_tokens = 3;
  bool stream = 4;
}

message Token {
  string text = 1;
  uint32 index = 2;
}

message WhoRequest {}
message WhoReply {
  string backend = 1;
  uint32 connection_calls = 2;  // calls this backend has served on this client's connection
}

service Inference {
  rpc Generate(GenerateRequest) returns (stream Token);  // server streaming
  rpc Who(WhoRequest) returns (WhoReply);                 // unary: which replica answered
}
