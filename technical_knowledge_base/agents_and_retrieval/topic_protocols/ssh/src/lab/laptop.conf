# The laptop's SSH config for the lab (used with ssh -F; the user's ~/.ssh is never read).
# First match wins for each keyword, so specific Host blocks come first and Host * last.
Host bastion
    HostName 127.0.0.1
    Port 30922
    HostKeyAlias bastion

Host bastion-obs
    HostName 127.0.0.1
    Port 30923
    HostKeyAlias bastion

Host gpu-node-*
    ProxyJump bastion

Host *
    User khalid
    IdentityFile ./keys/id_ed25519
    IdentitiesOnly yes
    IdentityAgent none
    UserKnownHostsFile ./known_hosts
    GlobalKnownHostsFile /dev/null
    StrictHostKeyChecking accept-new
    BatchMode yes
    ControlMaster no
    ControlPath none
    LogLevel ERROR
