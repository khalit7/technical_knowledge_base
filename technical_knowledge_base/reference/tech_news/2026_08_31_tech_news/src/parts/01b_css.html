<style>
/* 2026-08-31 additions: an eighth section colour, part labels, the issue's own notes, the visuals */
:root{--c8:#6f7d32}
@media (prefers-color-scheme:dark){:root{--c8:#a9ba62}}
.c8{--k:var(--c8)}
.it[data-sec=models]{border-left-color:var(--c2)}.it[data-sec=research]{border-left-color:var(--c3)}.it[data-sec=industry]{border-left-color:var(--c4)}.it[data-sec=compute]{border-left-color:var(--c5)}.it[data-sec=dev]{border-left-color:var(--c6)}.it[data-sec=security]{border-left-color:var(--c7)}.it[data-sec=talk]{border-left-color:var(--c8)}
.pv{font-size:11px;border-radius:4px;padding:0 6px;border:1px dashed var(--mute);color:var(--mute)}
.pv.pv-merged{border-style:solid;border-color:var(--c6);color:var(--c6)}
.pv.pv-backfill{border-style:solid;border-color:var(--c5);color:var(--c5)}
.inote{font-size:12.5px;margin:6px 0 2px;padding:5px 9px;border-radius:6px;border:1px dashed var(--line);overflow-wrap:anywhere}
.inote .nl,.mc-req .nl{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-right:4px;color:var(--mute)}
.srcs.nosrc{color:var(--mute)}
.parts{display:grid;gap:8px;margin:8px 0}
.part{border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:0}
.part .ph{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13.5px}
.part .cnt{font-size:12px;color:var(--mute)}
.part .inote{margin:4px 0}
.df-lab{font-size:12px;color:var(--mute);margin:6px 0 3px}
.df-toks{display:flex;flex-wrap:wrap;gap:4px}
.df-t{font-size:12.5px;padding:1px 6px;border-radius:5px;border:1.5px solid var(--line);color:var(--dim)}
.df-t.on{color:var(--ink);background:var(--soft)}
.df-cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:5px}
.df-c{border:1px solid var(--line);border-radius:6px;padding:3px 5px;min-width:0;display:flex;flex-direction:column;gap:1px;background:var(--bg)}
.df-c .df-i{font-size:11px;color:var(--mute)}
.df-k{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.df-k.top{font-style:italic}.df-k.sel{color:var(--ink);font-weight:600;font-style:normal}
.df-c.ok{border-color:var(--good);background:var(--open2)}.df-c.bad{border-color:var(--bad)}.df-c.bad .df-k.sel{color:var(--bad);text-decoration:line-through}
.df-c.gone{opacity:.4}.df-c.empty{border-style:dashed}.df-c.bonus{border-style:solid;border-color:var(--c1)}.df-c.bonus.empty{border-style:dashed}
.mc-req{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:6px;margin:4px 0;min-height:4.2em}
.mc-req pre{margin:2px 0 0;font:11.5px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 7px}
.mc-req pre.bad{border-color:var(--bad);color:var(--bad)}
#pmBytes .sr .nm{white-space:normal}
@media (min-width:521px){#pmBytes .sr{grid-template-columns:minmax(0,10.5em) minmax(0,1fr) minmax(0,21em)}}
#v-traffic input[type=range]{max-width:420px;display:block}
</style>
