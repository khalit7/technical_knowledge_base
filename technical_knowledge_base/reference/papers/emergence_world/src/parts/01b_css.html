<style>
/* Emergence World page additions */
:root{--pk:#c0378a}@media (prefers-color-scheme:dark){:root{--pk:#e879b9}}
.verdict{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:0 8px 8px 0;padding:9px 12px;background:var(--soft)}
blockquote.q2{margin:8px 0;padding:6px 12px;border-left:3px solid var(--line);color:var(--ink);font-size:14px}
blockquote.q2 .by{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.scg{display:grid;gap:2px;font-size:12px;overflow-x:auto}
.scg .h{font-weight:600;color:var(--mute);text-align:center;padding:2px 0;cursor:help}
.scg .wn{font-weight:600;padding:3px 4px;white-space:nowrap}
.scg .c{text-align:center;padding:4px 0;border-radius:3px;font-weight:600}
.scg .c1{background:var(--open2);color:var(--open)}.scg .c0{background:var(--soft);color:var(--mute)}.scg .cn{background:transparent;color:var(--mute)}
.scg .tot{text-align:right;padding:3px 6px;font-weight:700}
.evleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin:6px 0}
.evleg span{display:inline-flex;align-items:center;gap:4px}
.evleg i{display:inline-block;width:10px;height:10px;border-radius:50%}
.evlist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12.5px;margin:6px 0}
.evlist div{padding:3px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.evlist div:last-child{border-bottom:0}
.evlist .tm{color:var(--mute);font-variant-numeric:tabular-nums;margin-right:6px}
.chk td{vertical-align:top}
.vd{display:inline-block;padding:1px 6px;border-radius:9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.vd.reproduces{background:var(--open2);color:var(--open)}.vd.close{background:var(--acc2);color:var(--acc)}.vd.does{background:#f6e3d6;color:#9a4f1f}.vd.paper{background:var(--closed2);color:var(--closed)}.vd.derived{background:var(--soft);color:var(--mute)}
@media (prefers-color-scheme:dark){.vd.does{background:#43291a;color:#e8915c}}
.ctlrow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:6px 0}
.ctlrow label{font-size:13px;display:inline-flex;gap:6px;align-items:center}
.ctlrow select{max-width:100%}
table.tt{border-collapse:collapse;width:100%;font-size:13px}
table.tt th,table.tt td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
table.tt th{color:var(--mute);font-weight:600;cursor:pointer;white-space:nowrap}
table.tt td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;max-width:100%}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:6px;font-size:13px}
.agents div{border:1px solid var(--line);border-radius:6px;padding:5px 8px}
details.more{border:1px solid var(--line);border-radius:8px;padding:4px 12px;margin:8px 0;background:var(--bg)}
details.more>summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0;color:var(--acc)}
details.more[open]>summary{margin-bottom:4px}
@media (max-width:560px){table.chk tr:first-child{display:none}table.chk tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}table.chk td{display:block;border:0;padding:1px 0}table.chk td[data-l]::before{content:attr(data-l) ": ";color:var(--mute);font-size:12px}}
</style>
